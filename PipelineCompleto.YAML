trigger: none

schedules:
- cron: "30 18 * * *"
  displayName: "Ejecutar diariamente 15:30 ARG"
  branches:
    include:
    - main
  always: true

# ============================================================
# STAGE 1 - ACTUALIZAR CARPETAS RELEASE
# ============================================================

stages:

- stage: ActualizaCarpetaRelease
  displayName: "01 - Actualizar carpetas Release"

  jobs:

  - job: ActualizarRelease

    strategy:
      matrix:
        QA01:
          AgentName: "Softland-QA-01"
        QA02:
          AgentName: "Softland-QA-02"

    pool:
      name: "Softland-QA"
      demands:
      - Agent.OS -equals Windows_NT
      - Agent.Name -equals $(AgentName)

    steps:
    - template: ActualizaCarpetaRelease.yaml

# ============================================================
# STAGE 2 - EJECUTAR SETUP
# ============================================================

- stage: EjecutaSetup
  displayName: "02 - Ejecutar Setup"

  dependsOn: ActualizaCarpetaRelease
  condition: succeeded()

  jobs:

  - job: InstalarSetup

    strategy:
      matrix:
        QA01:
          AgentName: "Softland-QA-01"
        QA02:
          AgentName: "Softland-QA-02"

    pool:
      name: "Softland-QA"
      demands:
      - Agent.OS -equals Windows_NT
      - Agent.Name -equals $(AgentName)

    timeoutInMinutes: 90

    steps:
    - template: ejecuta.yaml
