trigger: none

parameters:
- name: debugPauseMinutes
  displayName: "Minutos para dejar Config abierto si falla"
  type: number
  default: 20

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: ConvertirEmpresasSoftland
  displayName: "Convertir empresas Softland"
  timeoutInMinutes: 360

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Convertir empresas Softland"
    env:
      SOFTLAND_PASSWORD: $(SOFTLAND_PASSWORD)
      DEBUG_PAUSE_MINUTES: ${{ parameters.debugPauseMinutes }}

    inputs:
      targetType: inline
      pwsh: false
      script: |

        $ErrorActionPreference = "Stop"

        $Password = $env:SOFTLAND_PASSWORD
        $DebugPauseMinutes = [int]$env:DEBUG_PAUSE_MINUTES

        if ([string]::IsNullOrWhiteSpace($Password)) {
            throw "No se encontro la variable secreta SOFTLAND_PASSWORD."
        }

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - CONVERSION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # WIN32 - MENU, DIALOGOS, TEXTBOX Y TECLADO
        # ============================================================

        Add-Type @"
        using System;
        using System.Text;
        using System.Collections.Generic;
        using System.Runtime.InteropServices;
        using System.Threading;

        public static class NativeUI
        {
            public const uint WM_COMMAND = 0x0111;
            public const uint WM_INITMENUPOPUP = 0x0117;

            public const uint WM_KEYDOWN = 0x0100;
            public const uint WM_KEYUP = 0x0101;
            public const uint WM_CHAR = 0x0102;

            public const uint WM_CLEAR = 0x0303;

            public const uint EM_SETSEL = 0x00B1;

            public const uint BM_CLICK = 0x00F5;

            public const uint MF_BYPOSITION = 0x00000400;

            public const int GWL_STYLE = -16;
            public const long ES_PASSWORD = 0x0020;

            public const uint INPUT_KEYBOARD = 1;

            public const uint KEYEVENTF_KEYUP = 0x0002;
            public const uint KEYEVENTF_UNICODE = 0x0004;

            public const ushort VK_CONTROL = 0x11;
            public const ushort VK_A = 0x41;
            public const ushort VK_BACK = 0x08;

            public const uint MOUSEEVENTF_LEFTDOWN = 0x0002;
            public const uint MOUSEEVENTF_LEFTUP = 0x0004;


            public delegate bool EnumWindowsProc(
                IntPtr hWnd,
                IntPtr lParam
            );


            [StructLayout(LayoutKind.Sequential)]
            public struct RECT
            {
                public int Left;
                public int Top;
                public int Right;
                public int Bottom;
            }


            [StructLayout(LayoutKind.Sequential)]
            public struct INPUT
            {
                public uint type;
                public InputUnion U;
            }


            [StructLayout(LayoutKind.Explicit)]
            public struct InputUnion
            {
                [FieldOffset(0)]
                public KEYBDINPUT ki;
            }


            [StructLayout(LayoutKind.Sequential)]
            public struct KEYBDINPUT
            {
                public ushort wVk;
                public ushort wScan;
                public uint dwFlags;
                public uint time;
                public UIntPtr dwExtraInfo;
            }


            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(
                IntPtr hWnd
            );


            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );


            [DllImport("user32.dll")]
            public static extern IntPtr SetFocus(
                IntPtr hWnd
            );


            [DllImport("user32.dll")]
            public static extern IntPtr GetMenu(
                IntPtr hWnd
            );


            [DllImport("user32.dll")]
            public static extern int GetMenuItemCount(
                IntPtr hMenu
            );


            [DllImport("user32.dll")]
            public static extern IntPtr GetSubMenu(
                IntPtr hMenu,
                int nPos
            );


            [DllImport("user32.dll")]
            public static extern uint GetMenuItemID(
                IntPtr hMenu,
                int nPos
            );


            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            public static extern int GetMenuString(
                IntPtr hMenu,
                uint uIDItem,
                StringBuilder lpString,
                int cchMax,
                uint flags
            );


            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );


            [DllImport("user32.dll")]
            public static extern bool PostMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );


            [DllImport("user32.dll")]
            static extern bool EnumWindows(
                EnumWindowsProc callback,
                IntPtr lParam
            );


            [DllImport("user32.dll")]
            static extern bool EnumChildWindows(
                IntPtr hWndParent,
                EnumWindowsProc callback,
                IntPtr lParam
            );


            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );


            [DllImport("user32.dll")]
            static extern bool IsWindowVisible(
                IntPtr hWnd
            );


            [DllImport("user32.dll")]
            public static extern bool IsWindow(
                IntPtr hWnd
            );


            [DllImport("user32.dll")]
            public static extern bool IsWindowEnabled(
                IntPtr hWnd
            );


            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            static extern int GetWindowText(
                IntPtr hWnd,
                StringBuilder lpString,
                int nMaxCount
            );


            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            static extern int GetClassName(
                IntPtr hWnd,
                StringBuilder lpClassName,
                int nMaxCount
            );


            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(
                IntPtr hWnd,
                out RECT lpRect
            );


            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(
                int X,
                int Y
            );


            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );


            [DllImport(
                "user32.dll",
                EntryPoint = "GetWindowLong"
            )]
            static extern IntPtr GetWindowLongPtr32(
                IntPtr hWnd,
                int nIndex
            );


            [DllImport(
                "user32.dll",
                EntryPoint = "GetWindowLongPtr"
            )]
            static extern IntPtr GetWindowLongPtr64(
                IntPtr hWnd,
                int nIndex
            );


            [DllImport(
                "user32.dll",
                SetLastError = true
            )]
            static extern uint SendInput(
                uint nInputs,
                INPUT[] pInputs,
                int cbSize
            );


            static IntPtr GetWindowLongPtr(
                IntPtr hWnd,
                int nIndex
            )
            {
                if (IntPtr.Size == 8)
                {
                    return GetWindowLongPtr64(
                        hWnd,
                        nIndex
                    );
                }

                return GetWindowLongPtr32(
                    hWnd,
                    nIndex
                );
            }


            public static string Text(
                IntPtr hWnd
            )
            {
                StringBuilder sb =
                    new StringBuilder(2048);

                GetWindowText(
                    hWnd,
                    sb,
                    sb.Capacity
                );

                return sb.ToString();
            }


            public static string ClassName(
                IntPtr hWnd
            )
            {
                StringBuilder sb =
                    new StringBuilder(512);

                GetClassName(
                    hWnd,
                    sb,
                    sb.Capacity
                );

                return sb.ToString();
            }


            public static IntPtr[] TopWindows(
                int processId
            )
            {
                List<IntPtr> result =
                    new List<IntPtr>();

                EnumWindows(
                    delegate(IntPtr hWnd, IntPtr lParam)
                    {
                        uint pid;

                        GetWindowThreadProcessId(
                            hWnd,
                            out pid
                        );

                        if (
                            pid == processId &&
                            IsWindowVisible(hWnd)
                        )
                        {
                            result.Add(hWnd);
                        }

                        return true;
                    },
                    IntPtr.Zero
                );

                return result.ToArray();
            }


            public static IntPtr[] Children(
                IntPtr parent
            )
            {
                List<IntPtr> result =
                    new List<IntPtr>();

                EnumChildWindows(
                    parent,
                    delegate(IntPtr hWnd, IntPtr lParam)
                    {
                        result.Add(hWnd);

                        return true;
                    },
                    IntPtr.Zero
                );

                return result.ToArray();
            }


            public static string CombinedText(
                IntPtr parent
            )
            {
                StringBuilder result =
                    new StringBuilder();

                string root =
                    Text(parent);

                if (!String.IsNullOrWhiteSpace(root))
                {
                    result.Append(root);
                    result.Append(" ");
                }

                foreach (
                    IntPtr child in
                    Children(parent)
                )
                {
                    string text =
                        Text(child);

                    if (!String.IsNullOrWhiteSpace(text))
                    {
                        result.Append(text);
                        result.Append(" ");
                    }
                }

                return result.ToString();
            }


            static string Normalize(
                string value
            )
            {
                if (value == null)
                    return "";

                return value
                    .Replace("&", "")
                    .Trim();
            }


            static bool ContainsAll(
                string source,
                string[] values
            )
            {
                if (values == null)
                    return true;

                string text =
                    source.ToLowerInvariant();

                foreach (
                    string value in
                    values
                )
                {
                    if (
                        String.IsNullOrWhiteSpace(value)
                    )
                    {
                        continue;
                    }

                    if (
                        !text.Contains(
                            value.ToLowerInvariant()
                        )
                    )
                    {
                        return false;
                    }
                }

                return true;
            }


            public static IntPtr FindWindow(
                int processId,
                string[] terms
            )
            {
                foreach (
                    IntPtr window in
                    TopWindows(processId)
                )
                {
                    string text =
                        CombinedText(window);

                    if (
                        ContainsAll(
                            text,
                            terms
                        )
                    )
                    {
                        return window;
                    }
                }

                return IntPtr.Zero;
            }


            public static IntPtr FindChildText(
                IntPtr parent,
                string[] names
            )
            {
                foreach (
                    IntPtr child in
                    Children(parent)
                )
                {
                    string current =
                        Normalize(
                            Text(child)
                        );

                    foreach (
                        string wanted in
                        names
                    )
                    {
                        if (
                            String.Equals(
                                current,
                                Normalize(wanted),
                                StringComparison.OrdinalIgnoreCase
                            )
                        )
                        {
                            return child;
                        }
                    }
                }

                return IntPtr.Zero;
            }


            public static bool IsTextBox(
                IntPtr hWnd
            )
            {
                string cls =
                    ClassName(hWnd);

                if (
                    cls.IndexOf(
                        "ThunderRT6TextBox",
                        StringComparison.OrdinalIgnoreCase
                    ) >= 0
                )
                {
                    return true;
                }

                if (
                    String.Equals(
                        cls,
                        "Edit",
                        StringComparison.OrdinalIgnoreCase
                    )
                )
                {
                    return true;
                }

                return false;
            }


            // =======================================================
            // IDENTIFICAR TEXTBOX DE CONTRASEÑA
            //
            // 1) Prioridad: estilo ES_PASSWORD
            // 2) Fallback: TextBox ubicado mas abajo en pantalla.
            //
            // Esto evita escribir sobre el campo Usuario.
            // =======================================================

            public static IntPtr FindPasswordTextBox(
                IntPtr parent
            )
            {
                List<IntPtr> textBoxes =
                    new List<IntPtr>();

                foreach (
                    IntPtr child in
                    Children(parent)
                )
                {
                    if (!IsTextBox(child))
                    {
                        continue;
                    }

                    textBoxes.Add(child);


                    long style =
                        GetWindowLongPtr(
                            child,
                            GWL_STYLE
                        ).ToInt64();


                    if (
                        (style & ES_PASSWORD) ==
                        ES_PASSWORD
                    )
                    {
                        return child;
                    }
                }


                if (textBoxes.Count == 0)
                {
                    return IntPtr.Zero;
                }


                // Fallback:
                // elegir el TextBox que esta mas abajo.
                //
                // En esta ventana:
                //
                // Usuario
                // [sa]
                //
                // Contraseña
                // [_____]
                //
                // El campo contraseña tiene el Top mayor.

                IntPtr selected =
                    IntPtr.Zero;

                int greatestTop =
                    Int32.MinValue;


                foreach (
                    IntPtr box in
                    textBoxes
                )
                {
                    RECT rect;

                    if (
                        GetWindowRect(
                            box,
                            out rect
                        )
                    )
                    {
                        if (
                            rect.Top >
                            greatestTop
                        )
                        {
                            greatestTop =
                                rect.Top;

                            selected =
                                box;
                        }
                    }
                }


                if (
                    selected !=
                    IntPtr.Zero
                )
                {
                    return selected;
                }


                return textBoxes[
                    textBoxes.Count - 1
                ];
            }


            public static string GetRectInfo(
                IntPtr hWnd
            )
            {
                RECT rect;

                if (
                    !GetWindowRect(
                        hWnd,
                        out rect
                    )
                )
                {
                    return "RECT desconocido";
                }

                return String.Format(
                    "Left={0}, Top={1}, Right={2}, Bottom={3}",
                    rect.Left,
                    rect.Top,
                    rect.Right,
                    rect.Bottom
                );
            }


            public static bool ClickAsync(
                IntPtr hWnd
            )
            {
                if (
                    hWnd == IntPtr.Zero ||
                    !IsWindow(hWnd)
                )
                {
                    return false;
                }

                return PostMessage(
                    hWnd,
                    BM_CLICK,
                    IntPtr.Zero,
                    IntPtr.Zero
                );
            }


            // =======================================================
            // CLICK FISICO SOBRE UN CONTROL
            // =======================================================

            public static bool PhysicalClick(
                IntPtr hWnd
            )
            {
                if (
                    hWnd == IntPtr.Zero ||
                    !IsWindow(hWnd)
                )
                {
                    return false;
                }


                RECT rect;

                if (
                    !GetWindowRect(
                        hWnd,
                        out rect
                    )
                )
                {
                    return false;
                }


                int x =
                    rect.Left +
                    (
                        (
                            rect.Right -
                            rect.Left
                        ) / 2
                    );


                int y =
                    rect.Top +
                    (
                        (
                            rect.Bottom -
                            rect.Top
                        ) / 2
                    );


                SetCursorPos(
                    x,
                    y
                );


                Thread.Sleep(150);


                mouse_event(
                    MOUSEEVENTF_LEFTDOWN,
                    0,
                    0,
                    0,
                    UIntPtr.Zero
                );


                mouse_event(
                    MOUSEEVENTF_LEFTUP,
                    0,
                    0,
                    0,
                    UIntPtr.Zero
                );


                Thread.Sleep(200);


                return true;
            }


            // =======================================================
            // METODO 1:
            //
            // Escribir usando WM_CHAR directamente sobre el
            // ThunderRT6TextBox.
            //
            // A diferencia de WM_SETTEXT, WM_CHAR simula el ingreso
            // caracter por caracter y VB6 puede ejecutar eventos
            // Change / KeyPress.
            // =======================================================

            public static bool TypeTextByMessages(
                IntPtr dialog,
                IntPtr edit,
                string value
            )
            {
                if (
                    dialog == IntPtr.Zero ||
                    edit == IntPtr.Zero ||
                    !IsWindow(edit)
                )
                {
                    return false;
                }


                SetForegroundWindow(
                    dialog
                );


                Thread.Sleep(200);


                PhysicalClick(
                    edit
                );


                Thread.Sleep(200);


                // Seleccionar todo

                SendMessage(
                    edit,
                    EM_SETSEL,
                    IntPtr.Zero,
                    new IntPtr(-1)
                );


                Thread.Sleep(100);


                // Limpiar

                SendMessage(
                    edit,
                    WM_CLEAR,
                    IntPtr.Zero,
                    IntPtr.Zero
                );


                Thread.Sleep(100);


                foreach (
                    char character in
                    value.ToCharArray()
                )
                {
                    SendMessage(
                        edit,
                        WM_CHAR,
                        new IntPtr(
                            (int)character
                        ),
                        IntPtr.Zero
                    );


                    Thread.Sleep(40);
                }


                Thread.Sleep(700);


                return true;
            }


            static void SendVirtualKey(
                ushort key,
                bool keyUp
            )
            {
                INPUT input =
                    new INPUT();


                input.type =
                    INPUT_KEYBOARD;


                input.U.ki.wVk =
                    key;


                input.U.ki.wScan =
                    0;


                input.U.ki.dwFlags =
                    keyUp
                    ? KEYEVENTF_KEYUP
                    : 0;


                input.U.ki.time =
                    0;


                input.U.ki.dwExtraInfo =
                    UIntPtr.Zero;


                SendInput(
                    1,
                    new INPUT[] { input },
                    Marshal.SizeOf(
                        typeof(INPUT)
                    )
                );
            }


            static void SendUnicodeCharacter(
                char character,
                bool keyUp
            )
            {
                INPUT input =
                    new INPUT();


                input.type =
                    INPUT_KEYBOARD;


                input.U.ki.wVk =
                    0;


                input.U.ki.wScan =
                    character;


                input.U.ki.dwFlags =
                    KEYEVENTF_UNICODE |
                    (
                        keyUp
                        ? KEYEVENTF_KEYUP
                        : 0
                    );


                input.U.ki.time =
                    0;


                input.U.ki.dwExtraInfo =
                    UIntPtr.Zero;


                SendInput(
                    1,
                    new INPUT[] { input },
                    Marshal.SizeOf(
                        typeof(INPUT)
                    )
                );
            }


            // =======================================================
            // METODO 2 - FALLBACK
            //
            // Click fisico + SendInput.
            // =======================================================

            public static bool TypeTextBySendInput(
                IntPtr dialog,
                IntPtr edit,
                string value
            )
            {
                if (
                    dialog == IntPtr.Zero ||
                    edit == IntPtr.Zero ||
                    !IsWindow(edit)
                )
                {
                    return false;
                }


                SetForegroundWindow(
                    dialog
                );


                Thread.Sleep(250);


                PhysicalClick(
                    edit
                );


                Thread.Sleep(300);


                // CTRL + A

                SendVirtualKey(
                    VK_CONTROL,
                    false
                );


                SendVirtualKey(
                    VK_A,
                    false
                );


                SendVirtualKey(
                    VK_A,
                    true
                );


                SendVirtualKey(
                    VK_CONTROL,
                    true
                );


                Thread.Sleep(100);


                // BACKSPACE

                SendVirtualKey(
                    VK_BACK,
                    false
                );


                SendVirtualKey(
                    VK_BACK,
                    true
                );


                Thread.Sleep(100);


                // CONTRASEÑA

                foreach (
                    char character in
                    value.ToCharArray()
                )
                {
                    SendUnicodeCharacter(
                        character,
                        false
                    );


                    SendUnicodeCharacter(
                        character,
                        true
                    );


                    Thread.Sleep(40);
                }


                Thread.Sleep(700);


                return true;
            }
        }
        "@


        # ============================================================
        # LISTVIEW NATIVO
        # YA VALIDADO
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;
            const uint LVM_GETITEMCOUNT = LVM_FIRST + 4;
            const uint LVM_SETITEMSTATE = LVM_FIRST + 43;
            const uint LVM_GETITEMSTATE = LVM_FIRST + 44;

            const uint LVIS_STATEIMAGEMASK = 0xF000;

            const uint PROCESS_VM_OPERATION = 0x0008;
            const uint PROCESS_VM_READ = 0x0010;
            const uint PROCESS_VM_WRITE = 0x0020;
            const uint PROCESS_QUERY_INFORMATION = 0x0400;

            const uint MEM_COMMIT = 0x1000;
            const uint MEM_RESERVE = 0x2000;
            const uint MEM_RELEASE = 0x8000;
            const uint PAGE_READWRITE = 0x04;


            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );


            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );


            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );


            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }


            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state =
                    SendMessage(
                        handle,
                        LVM_GETITEMSTATE,
                        new IntPtr(index),
                        new IntPtr(
                            LVIS_STATEIMAGEMASK
                        )
                    ).ToInt32();


                return (
                    state &
                    0xF000
                ) >> 12;
            }


            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;


                GetWindowThreadProcessId(
                    handle,
                    out processId
                );


                IntPtr process =
                    OpenProcess(
                        PROCESS_VM_OPERATION |
                        PROCESS_VM_READ |
                        PROCESS_VM_WRITE |
                        PROCESS_QUERY_INFORMATION,
                        false,
                        processId
                    );


                if (
                    process ==
                    IntPtr.Zero
                )
                {
                    return false;
                }


                byte[] item =
                    new byte[20];


                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;


                Buffer.BlockCopy(
                    BitConverter.GetBytes(
                        stateValue
                    ),
                    0,
                    item,
                    12,
                    4
                );


                Buffer.BlockCopy(
                    BitConverter.GetBytes(
                        LVIS_STATEIMAGEMASK
                    ),
                    0,
                    item,
                    16,
                    4
                );


                IntPtr remote =
                    VirtualAllocEx(
                        process,
                        IntPtr.Zero,
                        (UIntPtr)item.Length,
                        MEM_COMMIT |
                        MEM_RESERVE,
                        PAGE_READWRITE
                    );


                if (
                    remote ==
                    IntPtr.Zero
                )
                {
                    CloseHandle(
                        process
                    );

                    return false;
                }


                UIntPtr written;


                bool result =
                    WriteProcessMemory(
                        process,
                        remote,
                        item,
                        (UIntPtr)item.Length,
                        out written
                    );


                if (result)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remote
                    );
                }


                VirtualFreeEx(
                    process,
                    remote,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );


                CloseHandle(
                    process
                );


                return result;
            }
        }
        "@


        # ============================================================
        # FUNCIONES POWERSHELL
        # ============================================================

        function Normalize-Text {

            param(
                [string]$Text
            )

            if ($null -eq $Text) {
                return ""
            }

            $Text =
                $Text.Replace(
                    "&",
                    ""
                ).Trim().ToLowerInvariant()

            if ($Text.Contains("`t")) {
                $Text =
                    $Text.Split("`t")[0]
            }

            $Normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )

            $Builder =
                New-Object Text.StringBuilder

            foreach (
                $Char in
                $Normalized.ToCharArray()
            ) {

                $Category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $Char
                    )

                if (
                    $Category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$Builder.Append(
                        $Char
                    )
                }
            }

            return $Builder.ToString()
        }


        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$ClassName
            )

            $Condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )

            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }


        function Get-MenuText {

            param(
                [IntPtr]$MenuHandle,
                [int]$Position
            )

            $Builder =
                New-Object System.Text.StringBuilder 512

            [void][NativeUI]::GetMenuString(
                $MenuHandle,
                [uint32]$Position,
                $Builder,
                512,
                [NativeUI]::MF_BYPOSITION
            )

            return $Builder.ToString()
        }


        function Find-MenuPosition {

            param(
                [IntPtr]$MenuHandle,
                [string]$Text
            )

            $Wanted =
                Normalize-Text $Text

            $Count =
                [NativeUI]::GetMenuItemCount(
                    $MenuHandle
                )

            for (
                $i = 0;
                $i -lt $Count;
                $i++
            ) {

                $Current =
                    Get-MenuText `
                        -MenuHandle $MenuHandle `
                        -Position $i

                if (
                    (Normalize-Text $Current) -eq
                    $Wanted
                ) {

                    return $i
                }
            }

            return -1
        }


        function Wait-Dialog {

            param(
                [int]$ProcessId,
                [string[]]$Terms,
                [int]$TimeoutSeconds = 120
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                $Handle =
                    [NativeUI]::FindWindow(
                        $ProcessId,
                        $Terms
                    )

                if (
                    $Handle -ne
                    [IntPtr]::Zero
                ) {

                    return $Handle
                }

                Start-Sleep -Milliseconds 300
            }

            return [IntPtr]::Zero
        }


        function Wait-WindowGone {

            param(
                [IntPtr]$Handle,
                [int]$TimeoutSeconds = 30
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                if (
                    -not (
                        [NativeUI]::IsWindow(
                            $Handle
                        )
                    )
                ) {

                    return $true
                }

                Start-Sleep -Milliseconds 250
            }

            return $false
        }


        function Find-Button {

            param(
                [IntPtr]$Window,
                [string[]]$Names
            )

            return [NativeUI]::FindChildText(
                $Window,
                $Names
            )
        }


        function Click-ButtonAsync {

            param(
                [IntPtr]$Window,
                [string[]]$Names
            )

            $Button =
                Find-Button `
                    -Window $Window `
                    -Names $Names

            if (
                $Button -eq
                [IntPtr]::Zero
            ) {

                throw "No se encontro boton: $($Names -join ', ')"
            }


            $Text =
                [NativeUI]::Text(
                    $Button
                )


            $Class =
                [NativeUI]::ClassName(
                    $Button
                )


            Write-Host "[INFO] Boton detectado:"
            Write-Host "       Texto  : $Text"
            Write-Host "       Clase  : $Class"
            Write-Host "       Handle : $Button"


            if (
                -not (
                    [NativeUI]::ClickAsync(
                        $Button
                    )
                )
            ) {

                throw "No fue posible enviar click a $Text."
            }


            return $Button
        }


        function Wait-DialogWithButton {

            param(
                [int]$ProcessId,
                [string[]]$ButtonNames,
                [int]$TimeoutSeconds = 120
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )


            while (
                (Get-Date) -lt $End
            ) {

                $Windows =
                    [NativeUI]::TopWindows(
                        $ProcessId
                    )


                foreach (
                    $Window in
                    $Windows
                ) {

                    $Button =
                        Find-Button `
                            -Window $Window `
                            -Names $ButtonNames


                    if (
                        $Button -ne
                        [IntPtr]::Zero
                    ) {

                        return [PSCustomObject]@{
                            Window = $Window
                            Button = $Button
                        }
                    }
                }


                Start-Sleep -Milliseconds 300
            }


            return $null
        }


        function Wait-ButtonEnabled {

            param(
                [IntPtr]$Window,
                [string[]]$Names,
                [int]$TimeoutSeconds = 8
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )


            while (
                (Get-Date) -lt $End
            ) {

                $Button =
                    Find-Button `
                        -Window $Window `
                        -Names $Names


                if (
                    $Button -ne
                    [IntPtr]::Zero
                ) {

                    if (
                        [NativeUI]::IsWindowEnabled(
                            $Button
                        )
                    ) {

                        return $Button
                    }
                }


                Start-Sleep -Milliseconds 250
            }


            return [IntPtr]::Zero
        }


        # ============================================================
        # PASSWORD
        # ============================================================

        function Set-Password {

            param(
                [IntPtr]$Dialog,
                [string]$Value
            )


            $PasswordEdit =
                [NativeUI]::FindPasswordTextBox(
                    $Dialog
                )


            if (
                $PasswordEdit -eq
                [IntPtr]::Zero
            ) {

                Write-Host "[ERROR] No se encontro el campo de contraseña."

                return $false
            }


            Write-Host "[OK] TextBox de contraseña identificado."
            Write-Host "[INFO] Clase : $([NativeUI]::ClassName($PasswordEdit))"
            Write-Host "[INFO] Handle: $PasswordEdit"
            Write-Host "[INFO] Posicion: $([NativeUI]::GetRectInfo($PasswordEdit))"
            Write-Host "[INFO] La contraseña NO se mostrara en el log."
            Write-Host ""


            # ========================================================
            # INTENTO 1 - WM_CHAR
            # ========================================================

            Write-Host "[INFO] Intento 1: escribiendo mediante WM_CHAR..."


            $Result =
                [NativeUI]::TypeTextByMessages(
                    $Dialog,
                    $PasswordEdit,
                    $Value
                )


            if (-not $Result) {

                Write-Host "[WARN] No fue posible usar WM_CHAR."
            }


            Start-Sleep -Milliseconds 800


            $Aceptar =
                Find-Button `
                    -Window $Dialog `
                    -Names @(
                        "Aceptar",
                        "OK"
                    )


            if (
                $Aceptar -ne
                [IntPtr]::Zero
            ) {

                if (
                    [NativeUI]::IsWindowEnabled(
                        $Aceptar
                    )
                ) {

                    Write-Host "[OK] Aceptar se habilito con WM_CHAR."

                    return $true
                }
            }


            # ========================================================
            # INTENTO 2 - SENDINPUT
            # ========================================================

            Write-Host "[WARN] Aceptar sigue deshabilitado."
            Write-Host "[INFO] Intento 2: click fisico + SendInput..."


            $Result2 =
                [NativeUI]::TypeTextBySendInput(
                    $Dialog,
                    $PasswordEdit,
                    $Value
                )


            if (-not $Result2) {

                Write-Host "[ERROR] Fallo tambien SendInput."

                return $false
            }


            Start-Sleep -Milliseconds 800


            return $true
        }


        # ============================================================
        # PROCESO PRINCIPAL
        # ============================================================

        try {


            # ========================================================
            # 1 - BUSCAR CWCONFIG
            # ========================================================

            Write-Host "[1] Buscando cwConfig.exe..."


            $Paths = @(
                "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",
                "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
            )


            $ConfigExe =
                $null


            foreach (
                $Path in
                $Paths
            ) {

                Write-Host "[INFO] Probando: $Path"


                if (
                    Test-Path $Path
                ) {

                    $ConfigExe =
                        $Path

                    break
                }
            }


            if (-not $ConfigExe) {

                foreach (
                    $RootPath in
                    @(
                        "C:\Program Files (x86)\Softland",
                        "C:\Program Files\Softland"
                    )
                ) {

                    if (
                        Test-Path $RootPath
                    ) {

                        $Found =
                            Get-ChildItem `
                                -Path $RootPath `
                                -Filter "cwConfig.exe" `
                                -File `
                                -Recurse `
                                -ErrorAction SilentlyContinue |
                            Select-Object -First 1


                        if ($Found) {

                            $ConfigExe =
                                $Found.FullName

                            break
                        }
                    }
                }
            }


            if (-not $ConfigExe) {

                throw "No se encontro cwConfig.exe."
            }


            Write-Host "[OK] Ejecutable encontrado:"
            Write-Host "     $ConfigExe"


            # ========================================================
            # 2 - ABRIR
            # ========================================================

            $Existing =
                Get-Process `
                    -Name cwConfig `
                    -ErrorAction SilentlyContinue


            if (-not $Existing) {

                $Started =
                    Start-Process `
                        -FilePath $ConfigExe `
                        -PassThru


                Write-Host "[OK] cwConfig iniciado."
                Write-Host "[INFO] PID inicial: $($Started.Id)"
            }
            else {

                Write-Host "[WARN] cwConfig ya estaba abierto."
            }


            # ========================================================
            # VENTANA PRINCIPAL
            # ========================================================

            $MainWindow =
                $null


            $End =
                (Get-Date).AddSeconds(
                    60
                )


            while (
                (Get-Date) -lt $End
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )


                foreach (
                    $Window in
                    $Windows
                ) {

                    try {

                        $Title =
                            Normalize-Text `
                                $Window.Current.Name


                        if (
                            $Title -like "*configuracion del sistema de gestion*" -or
                            $Title -like "*configuracion de softland*"
                        ) {

                            $MainWindow =
                                $Window

                            break
                        }
                    }
                    catch {
                    }
                }


                if ($MainWindow) {
                    break
                }


                Start-Sleep -Seconds 1
            }


            if (-not $MainWindow) {

                throw "No se encontro la ventana principal."
            }


            $MainHandle =
                [IntPtr]$MainWindow.Current.NativeWindowHandle


            $SoftlandProcessId =
                $MainWindow.Current.ProcessId


            [NativeUI]::ShowWindowAsync(
                $MainHandle,
                9
            ) | Out-Null


            [NativeUI]::SetForegroundWindow(
                $MainHandle
            ) | Out-Null


            Write-Host "[OK] Configuracion abierta."
            Write-Host "[INFO] PID: $SoftlandProcessId"


            # ========================================================
            # 3 - OPERACIONES -> EMPRESAS
            # YA VALIDADO
            # ========================================================

            Write-Host "[3] Abriendo Operaciones -> Empresas..."


            $MainMenu =
                [NativeUI]::GetMenu(
                    $MainHandle
                )


            $PosOperaciones =
                Find-MenuPosition `
                    -MenuHandle $MainMenu `
                    -Text "Operaciones"


            if (
                $PosOperaciones -lt 0
            ) {

                throw "No se encontro Operaciones."
            }


            $MenuOperaciones =
                [NativeUI]::GetSubMenu(
                    $MainMenu,
                    $PosOperaciones
                )


            [void][NativeUI]::SendMessage(
                $MainHandle,
                [NativeUI]::WM_INITMENUPOPUP,
                $MenuOperaciones,
                [IntPtr]$PosOperaciones
            )


            $PosEmpresas =
                Find-MenuPosition `
                    -MenuHandle $MenuOperaciones `
                    -Text "Empresas"


            if (
                $PosEmpresas -lt 0
            ) {

                throw "No se encontro Empresas."
            }


            $CommandEmpresas =
                [NativeUI]::GetMenuItemID(
                    $MenuOperaciones,
                    $PosEmpresas
                )


            [void][NativeUI]::PostMessage(
                $MainHandle,
                [NativeUI]::WM_COMMAND,
                [IntPtr]$CommandEmpresas,
                [IntPtr]::Zero
            )


            Start-Sleep -Seconds 4


            Write-Host "[OK] Empresas abierto."


            # ========================================================
            # 4 - LISTVIEW
            # YA VALIDADO
            # ========================================================

            $Lista =
                Get-ElementByClass `
                    -Root $MainWindow `
                    -ClassName "ListView20WndClass"


            if (-not $Lista) {

                throw "No se encontro ListView20WndClass."
            }


            $ListHandle =
                [IntPtr]$Lista.Current.NativeWindowHandle


            $CantidadEmpresas =
                [NativeListView]::GetItemCount(
                    $ListHandle
                )


            if (
                $CantidadEmpresas -le 0
            ) {

                throw "No se detectaron empresas."
            }


            Write-Host "[INFO] Empresas detectadas: $CantidadEmpresas"


            # ========================================================
            # 5 - MARCAR TODAS
            # YA VALIDADO
            # ========================================================

            Write-Host "[5] Marcando empresas..."


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -ne 2
                ) {

                    if (
                        -not (
                            [NativeListView]::SetChecked(
                                $ListHandle,
                                $i,
                                $true
                            )
                        )
                    ) {

                        throw "No se pudo marcar fila $($i + 1)."
                    }
                }
            }


            Write-Host "[OK] Empresas seleccionadas: $CantidadEmpresas"


            # ========================================================
            # 6 - CONVERTIR
            # YA VALIDADO
            # ========================================================

            Write-Host "[6] Buscando boton Convertir..."


            $Convertir =
                [NativeUI]::FindChildText(
                    $MainHandle,
                    @(
                        "Convertir"
                    )
                )


            if (
                $Convertir -eq
                [IntPtr]::Zero
            ) {

                throw "No se encontro Convertir."
            }


            Write-Host "[OK] Convertir detectado."
            Write-Host "[INFO] Texto  : $([NativeUI]::Text($Convertir))"
            Write-Host "[INFO] Clase  : $([NativeUI]::ClassName($Convertir))"
            Write-Host "[INFO] Handle : $Convertir"


            Write-Host "[INFO] Presionando Convertir de forma ASINCRONICA..."


            if (
                -not (
                    [NativeUI]::ClickAsync(
                        $Convertir
                    )
                )
            ) {

                throw "No fue posible enviar click a Convertir."
            }


            Write-Host "[OK] Click asincronico enviado a Convertir."


            # ========================================================
            # 7 - CONFIRMACION GENERAL
            # YA VALIDADO
            # ========================================================

            Write-Host "[7] Esperando confirmacion general..."


            $General =
                Wait-Dialog `
                    -ProcessId $SoftlandProcessId `
                    -Terms @(
                        "convertir",
                        "empresa"
                    ) `
                    -TimeoutSeconds 120


            if (
                $General -eq
                [IntPtr]::Zero
            ) {

                throw "No se detecto la confirmacion general."
            }


            Write-Host "[OK] Confirmacion general detectada:"
            Write-Host "     $([NativeUI]::CombinedText($General))"


            [void](
                Click-ButtonAsync `
                    -Window $General `
                    -Names @(
                        "Si",
                        "Sí"
                    )
            )


            Write-Host "[OK] Click asincronico enviado a Si."


            [void](
                Wait-WindowGone `
                    -Handle $General `
                    -TimeoutSeconds 30
            )


            Start-Sleep -Milliseconds 500


            # ========================================================
            # 8 - PROCESAR EMPRESAS
            # ========================================================

            $Convertidas =
                0


            for (
                $Numero = 1;
                $Numero -le $CantidadEmpresas;
                $Numero++
            ) {

                Write-Host ""
                Write-Host "=========================================================="
                Write-Host " EMPRESA $Numero DE $CantidadEmpresas"
                Write-Host "=========================================================="
                Write-Host ""


                # ====================================================
                # CONTRASEÑA
                # ====================================================

                Write-Host "[INFO] Esperando Ingrese contraseña..."


                $PasswordDialog =
                    Wait-Dialog `
                        -ProcessId $SoftlandProcessId `
                        -Terms @(
                            "contrase"
                        ) `
                        -TimeoutSeconds 120


                if (
                    $PasswordDialog -eq
                    [IntPtr]::Zero
                ) {

                    throw "No aparecio Ingrese contraseña."
                }


                Write-Host "[OK] Ventana contraseña detectada:"
                Write-Host "     $([NativeUI]::CombinedText($PasswordDialog))"


                if (
                    -not (
                        Set-Password `
                            -Dialog $PasswordDialog `
                            -Value $Password
                    )
                ) {

                    throw "No se pudo completar la contraseña."
                }


                Write-Host ""
                Write-Host "[INFO] Esperando que Softland habilite Aceptar..."


                $Aceptar =
                    Wait-ButtonEnabled `
                        -Window $PasswordDialog `
                        -Names @(
                            "Aceptar",
                            "OK"
                        ) `
                        -TimeoutSeconds 12


                if (
                    $Aceptar -eq
                    [IntPtr]::Zero
                ) {

                    throw "La contraseña se intento ingresar pero Aceptar no se habilito."
                }


                Write-Host "[OK] Aceptar habilitado."
                Write-Host "[INFO] Presionando Aceptar..."


                if (
                    -not (
                        [NativeUI]::ClickAsync(
                            $Aceptar
                        )
                    )
                ) {

                    throw "No fue posible presionar Aceptar."
                }


                Write-Host "[OK] Aceptar enviado."


                [void](
                    Wait-WindowGone `
                        -Handle $PasswordDialog `
                        -TimeoutSeconds 30
                )


                Start-Sleep -Milliseconds 500


                # ====================================================
                # PRIMER SI
                # ====================================================

                Write-Host "[INFO] Esperando primera confirmacion posterior..."


                $Confirm1 =
                    Wait-DialogWithButton `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "Si",
                            "Sí"
                        ) `
                        -TimeoutSeconds 120


                if (-not $Confirm1) {

                    throw "No aparecio la primera confirmacion posterior."
                }


                Write-Host "[INFO] Confirmacion 1:"
                Write-Host "       $([NativeUI]::CombinedText($Confirm1.Window))"


                if (
                    -not (
                        [NativeUI]::ClickAsync(
                            $Confirm1.Button
                        )
                    )
                ) {

                    throw "No se pudo presionar Si #1."
                }


                Write-Host "[OK] Si #1 enviado."


                [void](
                    Wait-WindowGone `
                        -Handle $Confirm1.Window `
                        -TimeoutSeconds 30
                )


                Start-Sleep -Milliseconds 500


                # ====================================================
                # SEGUNDO SI
                # ====================================================

                Write-Host "[INFO] Esperando segunda confirmacion posterior..."


                $Confirm2 =
                    Wait-DialogWithButton `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "Si",
                            "Sí"
                        ) `
                        -TimeoutSeconds 120


                if (-not $Confirm2) {

                    throw "No aparecio la segunda confirmacion posterior."
                }


                Write-Host "[INFO] Confirmacion 2:"
                Write-Host "       $([NativeUI]::CombinedText($Confirm2.Window))"


                if (
                    -not (
                        [NativeUI]::ClickAsync(
                            $Confirm2.Button
                        )
                    )
                ) {

                    throw "No se pudo presionar Si #2."
                }


                Write-Host "[OK] Si #2 enviado."


                [void](
                    Wait-WindowGone `
                        -Handle $Confirm2.Window `
                        -TimeoutSeconds 30
                )


                Start-Sleep -Seconds 1


                # ====================================================
                # FINALIZACION
                # ====================================================

                Write-Host "[INFO] Conversion en curso..."
                Write-Host "[INFO] Esperando cartel de finalizacion..."


                $Finalizado =
                    Wait-Dialog `
                        -ProcessId $SoftlandProcessId `
                        -Terms @(
                            "finaliz",
                            "convers"
                        ) `
                        -TimeoutSeconds 1800


                if (
                    $Finalizado -eq
                    [IntPtr]::Zero
                ) {

                    throw "No aparecio el cartel de finalizacion."
                }


                Write-Host ""
                Write-Host "[OK] Conversion finalizada:"
                Write-Host "     $([NativeUI]::CombinedText($Finalizado))"


                [void](
                    Click-ButtonAsync `
                        -Window $Finalizado `
                        -Names @(
                            "OK",
                            "Aceptar"
                        )
                )


                Write-Host "[OK] OK de finalizacion enviado."


                [void](
                    Wait-WindowGone `
                        -Handle $Finalizado `
                        -TimeoutSeconds 30
                )


                $Convertidas++


                Write-Host ""
                Write-Host "[OK] Empresas convertidas: $Convertidas / $CantidadEmpresas"


                # ====================================================
                # SIGUIENTE EMPRESA
                # ====================================================

                if (
                    $Numero -lt
                    $CantidadEmpresas
                ) {

                    Start-Sleep -Milliseconds 500


                    Write-Host ""
                    Write-Host "[INFO] Esperando confirmacion de la siguiente empresa..."


                    $Siguiente =
                        Wait-Dialog `
                            -ProcessId $SoftlandProcessId `
                            -Terms @(
                                "convertir",
                                "empresa"
                            ) `
                            -TimeoutSeconds 120


                    if (
                        $Siguiente -eq
                        [IntPtr]::Zero
                    ) {

                        throw "No aparecio la confirmacion de la siguiente empresa."
                    }


                    Write-Host "[INFO] Siguiente empresa:"
                    Write-Host "       $([NativeUI]::CombinedText($Siguiente))"


                    [void](
                        Click-ButtonAsync `
                            -Window $Siguiente `
                            -Names @(
                                "Si",
                                "Sí"
                            )
                    )


                    Write-Host "[OK] Si enviado para continuar."


                    [void](
                        Wait-WindowGone `
                            -Handle $Siguiente `
                            -TimeoutSeconds 30
                    )


                    Start-Sleep -Milliseconds 500
                }
            }


            # ========================================================
            # FINAL
            # ========================================================

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " CONVERSION MULTIEMPRESA FINALIZADA"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Servidor             : $env:COMPUTERNAME"
            Write-Host "Empresas detectadas  : $CantidadEmpresas"
            Write-Host "Empresas convertidas : $Convertidas"
            Write-Host ""


            if (
                $Convertidas -ne
                $CantidadEmpresas
            ) {

                throw "No se convirtieron todas las empresas."
            }


            Write-Host "=========================================================="
            Write-Host " OK - TODAS LAS EMPRESAS FUERON CONVERTIDAS"
            Write-Host "=========================================================="
            Write-Host ""


            exit 0
        }


        # ============================================================
        # ERROR / DEBUG
        # ============================================================

        catch {

            $MensajeError =
                $_.Exception.Message


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ERROR DURANTE LA CONVERSION"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Error:"
            Write-Host $MensajeError
            Write-Host ""


            $Procesos =
                Get-Process `
                    -Name cwConfig `
                    -ErrorAction SilentlyContinue


            if ($Procesos) {

                Write-Host "[DEBUG] cwConfig.exe continua abierto."


                foreach (
                    $Proceso in
                    $Procesos
                ) {

                    Write-Host "[DEBUG] PID cwConfig: $($Proceso.Id)"
                }
            }


            Write-Host ""
            Write-Host "[DEBUG] El job permanecera activo durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Revise visualmente donde quedo Softland."
            Write-Host ""


            if (
                $DebugPauseMinutes -gt 0
            ) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            throw $MensajeError
        }
