trigger: none

parameters:
- name: debugPauseMinutes
  displayName: "Minutos para dejar Config abierto"
  type: number
  default: 20

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: SeleccionarEmpresasSoftland
  displayName: "Seleccionar empresas Softland"
  timeoutInMinutes: 60

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Abrir Config y seleccionar empresas"
    env:
      DEBUG_PAUSE_MINUTES: ${{ parameters.debugPauseMinutes }}

    inputs:
      targetType: inline
      pwsh: false
      script: |

        $ErrorActionPreference = "Stop"

        $DebugPauseMinutes = [int]$env:DEBUG_PAUSE_MINUTES

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - SELECCION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # WIN32 GENERAL
        # ============================================================

        Add-Type @"
        using System;
        using System.Text;
        using System.Runtime.InteropServices;

        public static class NativeWindows
        {
            public const uint WM_COMMAND = 0x0111;
            public const uint WM_INITMENUPOPUP = 0x0117;
            public const uint MF_BYPOSITION = 0x00000400;

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(
                int X,
                int Y
            );

            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetMenu(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern int GetMenuItemCount(
                IntPtr hMenu
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetSubMenu(
                IntPtr hMenu,
                int nPos
            );

            [DllImport("user32.dll")]
            public static extern uint GetMenuItemID(
                IntPtr hMenu,
                int nPos
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            public static extern int GetMenuString(
                IntPtr hMenu,
                uint uIDItem,
                StringBuilder lpString,
                int cchMax,
                uint flags
            );

            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            public static extern bool PostMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );
        }
        "@


        # ============================================================
        # LISTVIEW NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;
            const uint LVM_GETITEMCOUNT = LVM_FIRST + 4;
            const uint LVM_SETITEMSTATE = LVM_FIRST + 43;
            const uint LVM_GETITEMSTATE = LVM_FIRST + 44;

            const uint LVIS_STATEIMAGEMASK = 0xF000;

            const uint PROCESS_VM_OPERATION = 0x0008;
            const uint PROCESS_VM_READ = 0x0010;
            const uint PROCESS_VM_WRITE = 0x0020;
            const uint PROCESS_QUERY_INFORMATION = 0x0400;

            const uint MEM_COMMIT = 0x1000;
            const uint MEM_RESERVE = 0x2000;
            const uint MEM_RELEASE = 0x8000;
            const uint PAGE_READWRITE = 0x04;

            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );

            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );

            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }

            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state = SendMessage(
                    handle,
                    LVM_GETITEMSTATE,
                    new IntPtr(index),
                    new IntPtr(LVIS_STATEIMAGEMASK)
                ).ToInt32();

                return (state & 0xF000) >> 12;
            }

            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;

                GetWindowThreadProcessId(
                    handle,
                    out processId
                );

                IntPtr process = OpenProcess(
                    PROCESS_VM_OPERATION |
                    PROCESS_VM_READ |
                    PROCESS_VM_WRITE |
                    PROCESS_QUERY_INFORMATION,
                    false,
                    processId
                );

                if (process == IntPtr.Zero)
                {
                    return false;
                }

                byte[] lvItem = new byte[20];

                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;

                Buffer.BlockCopy(
                    BitConverter.GetBytes(stateValue),
                    0,
                    lvItem,
                    12,
                    4
                );

                Buffer.BlockCopy(
                    BitConverter.GetBytes(LVIS_STATEIMAGEMASK),
                    0,
                    lvItem,
                    16,
                    4
                );

                IntPtr remoteMemory = VirtualAllocEx(
                    process,
                    IntPtr.Zero,
                    (UIntPtr)lvItem.Length,
                    MEM_COMMIT | MEM_RESERVE,
                    PAGE_READWRITE
                );

                if (remoteMemory == IntPtr.Zero)
                {
                    CloseHandle(process);
                    return false;
                }

                UIntPtr written;

                bool ok = WriteProcessMemory(
                    process,
                    remoteMemory,
                    lvItem,
                    (UIntPtr)lvItem.Length,
                    out written
                );

                if (ok)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remoteMemory
                    );
                }

                VirtualFreeEx(
                    process,
                    remoteMemory,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );

                CloseHandle(process);

                return ok;
            }
        }
        "@


        # ============================================================
        # FUNCIONES POWERSHELL
        # ============================================================

        function Normalize-Text {

            param(
                [string]$Text
            )

            if ($null -eq $Text) {
                return ""
            }

            $Text =
                $Text.Replace(
                    "&",
                    ""
                ).Trim().ToLowerInvariant()

            # Elimina atajos tipo TAB + Ctrl+...
            if ($Text.Contains("`t")) {
                $Text = $Text.Split("`t")[0]
            }

            $Normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )

            $Builder =
                New-Object Text.StringBuilder

            foreach ($Char in $Normalized.ToCharArray()) {

                $Category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $Char
                    )

                if (
                    $Category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$Builder.Append(
                        $Char
                    )
                }
            }

            return $Builder.ToString()
        }


        function Get-MenuText {

            param(
                [IntPtr]$MenuHandle,
                [int]$Position
            )

            $Builder =
                New-Object System.Text.StringBuilder 512

            [void][NativeWindows]::GetMenuString(
                $MenuHandle,
                [uint32]$Position,
                $Builder,
                512,
                [NativeWindows]::MF_BYPOSITION
            )

            return $Builder.ToString()
        }


        function Dump-NativeMenu {

            param(
                [IntPtr]$MenuHandle,
                [string]$Title
            )

            Write-Host ""
            Write-Host "----------------------------------------------------------"
            Write-Host " $Title"
            Write-Host "----------------------------------------------------------"

            $Count =
                [NativeWindows]::GetMenuItemCount(
                    $MenuHandle
                )

            Write-Host "[INFO] Cantidad de elementos: $Count"

            for (
                $i = 0;
                $i -lt $Count;
                $i++
            ) {

                $Text =
                    Get-MenuText `
                        -MenuHandle $MenuHandle `
                        -Position $i

                $Id =
                    [NativeWindows]::GetMenuItemID(
                        $MenuHandle,
                        $i
                    )

                Write-Host (
                    "Posicion={0} | Texto=[{1}] | ID={2}" -f
                    $i,
                    $Text,
                    $Id
                )
            }

            Write-Host "----------------------------------------------------------"
            Write-Host ""
        }


        function Find-NativeMenuPosition {

            param(
                [IntPtr]$MenuHandle,
                [string]$WantedText
            )

            $Wanted =
                Normalize-Text $WantedText

            $Count =
                [NativeWindows]::GetMenuItemCount(
                    $MenuHandle
                )

            for (
                $i = 0;
                $i -lt $Count;
                $i++
            ) {

                $Current =
                    Get-MenuText `
                        -MenuHandle $MenuHandle `
                        -Position $i

                if (
                    (Normalize-Text $Current) -eq $Wanted
                ) {

                    return $i
                }
            }

            return -1
        }


        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$ClassName
            )

            $Condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )

            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }


        # ============================================================
        # PROCESO PRINCIPAL
        # ============================================================

        try {

            # ========================================================
            # 1 - BUSCAR CWCONFIG
            # ========================================================

            Write-Host "[1] Buscando cwConfig.exe..."

            $PossiblePaths = @(

                "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",

                "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
            )

            $ConfigExe = $null

            foreach ($Path in $PossiblePaths) {

                Write-Host "[INFO] Probando: $Path"

                if (Test-Path $Path) {

                    $ConfigExe = $Path
                    break
                }
            }


            # ========================================================
            # BUSQUEDA DINAMICA
            # ========================================================

            if (-not $ConfigExe) {

                Write-Host "[INFO] No se encontro en rutas estandar."
                Write-Host "[INFO] Buscando cwConfig.exe dentro de Softland..."

                $SearchRoots = @(

                    "C:\Program Files (x86)\Softland",

                    "C:\Program Files\Softland"
                )

                foreach ($RootPath in $SearchRoots) {

                    if (Test-Path $RootPath) {

                        $Found =
                            Get-ChildItem `
                                -Path $RootPath `
                                -Filter "cwConfig.exe" `
                                -File `
                                -Recurse `
                                -ErrorAction SilentlyContinue |
                            Select-Object -First 1

                        if ($Found) {

                            $ConfigExe =
                                $Found.FullName

                            break
                        }
                    }
                }
            }


            if (-not $ConfigExe) {

                throw "No se encontro cwConfig.exe en este servidor."
            }


            Write-Host ""
            Write-Host "[OK] Ejecutable encontrado:"
            Write-Host "     $ConfigExe"
            Write-Host ""


            # ========================================================
            # 2 - ABRIR CONFIG
            # ========================================================

            Write-Host "[2] Abriendo Configuracion del Sistema de Gestion..."

            $ExistingConfig =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if ($ExistingConfig) {

                Write-Host "[WARN] Ya existe cwConfig.exe abierto."
                Write-Host "[INFO] Se intentara utilizar la ventana existente."
            }
            else {

                $ConfigProcess =
                    Start-Process `
                        -FilePath $ConfigExe `
                        -PassThru

                Write-Host "[INFO] PID iniciado: $($ConfigProcess.Id)"
            }


            Write-Host "[INFO] Esperando ventana principal..."


            # ========================================================
            # 3 - LOCALIZAR VENTANA
            # ========================================================

            $MainWindow = $null

            $Timeout =
                (Get-Date).AddSeconds(
                    60
                )

            while (
                (Get-Date) -lt $Timeout
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement

                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )

                foreach ($Window in $Windows) {

                    try {

                        $Title =
                            Normalize-Text `
                                $Window.Current.Name

                        if (
                            $Title -like "*configuracion del sistema de gestion*" -or
                            $Title -like "*configuracion de softland*"
                        ) {

                            $MainWindow = $Window
                            break
                        }
                    }
                    catch {
                    }
                }

                if ($MainWindow) {
                    break
                }

                Start-Sleep -Seconds 1
            }


            if (-not $MainWindow) {

                throw "No se encontro la ventana Configuracion del Sistema de Gestion."
            }


            $MainHandle =
                [IntPtr]$MainWindow.Current.NativeWindowHandle


            [NativeWindows]::ShowWindowAsync(
                $MainHandle,
                9
            ) | Out-Null


            [NativeWindows]::SetForegroundWindow(
                $MainHandle
            ) | Out-Null


            Write-Host "[OK] Configuracion de Softland abierta."
            Write-Host "[INFO] PID real : $($MainWindow.Current.ProcessId)"
            Write-Host "[INFO] Handle   : $MainHandle"
            Write-Host ""


            # ========================================================
            # 4 - MENU NATIVO
            # ========================================================

            Write-Host "[3] Navegando a Operaciones -> Empresas..."
            Write-Host ""
            Write-Host "[INFO] Obteniendo menu nativo de cwConfig..."


            $MainMenu =
                [NativeWindows]::GetMenu(
                    $MainHandle
                )


            if (
                $MainMenu -eq [IntPtr]::Zero
            ) {

                throw "Windows no devolvio un menu nativo para cwConfig.exe."
            }


            Write-Host "[OK] Menu nativo detectado."
            Write-Host "[INFO] Handle menu: $MainMenu"


            Dump-NativeMenu `
                -MenuHandle $MainMenu `
                -Title "MENU PRINCIPAL DE CWCONFIG"


            # ========================================================
            # 5 - BUSCAR OPERACIONES
            # ========================================================

            Write-Host "[INFO] Buscando Operaciones en menu nativo..."


            $PosOperaciones =
                Find-NativeMenuPosition `
                    -MenuHandle $MainMenu `
                    -WantedText "Operaciones"


            if (
                $PosOperaciones -lt 0
            ) {

                throw "No se encontro Operaciones dentro del menu nativo de cwConfig."
            }


            Write-Host "[OK] Operaciones encontrado."
            Write-Host "[INFO] Posicion menu: $PosOperaciones"


            $MenuOperaciones =
                [NativeWindows]::GetSubMenu(
                    $MainMenu,
                    $PosOperaciones
                )


            if (
                $MenuOperaciones -eq [IntPtr]::Zero
            ) {

                throw "Operaciones fue encontrado pero Windows no devolvio su submenu."
            }


            # Fuerza la inicializacion del submenu

            [void][NativeWindows]::SendMessage(
                $MainHandle,
                [NativeWindows]::WM_INITMENUPOPUP,
                $MenuOperaciones,
                [IntPtr]$PosOperaciones
            )


            Start-Sleep -Milliseconds 500


            Dump-NativeMenu `
                -MenuHandle $MenuOperaciones `
                -Title "SUBMENU OPERACIONES"


            # ========================================================
            # 6 - BUSCAR EMPRESAS
            # ========================================================

            Write-Host "[INFO] Buscando Empresas dentro de Operaciones..."


            $PosEmpresas =
                Find-NativeMenuPosition `
                    -MenuHandle $MenuOperaciones `
                    -WantedText "Empresas"


            if (
                $PosEmpresas -lt 0
            ) {

                throw "No se encontro Empresas dentro del submenu Operaciones."
            }


            Write-Host "[OK] Empresas encontrado."
            Write-Host "[INFO] Posicion submenu: $PosEmpresas"


            $EmpresaCommandId =
                [NativeWindows]::GetMenuItemID(
                    $MenuOperaciones,
                    $PosEmpresas
                )


            if (
                $EmpresaCommandId -eq 4294967295
            ) {

                throw "El item Empresas no devolvio un Command ID valido."
            }


            Write-Host "[INFO] Command ID Empresas: $EmpresaCommandId"


            # ========================================================
            # 7 - EJECUTAR EMPRESAS
            # ========================================================

            Write-Host ""
            Write-Host "[INFO] Ejecutando Operaciones -> Empresas..."


            $Posted =
                [NativeWindows]::PostMessage(
                    $MainHandle,
                    [NativeWindows]::WM_COMMAND,
                    [IntPtr]$EmpresaCommandId,
                    [IntPtr]::Zero
                )


            if (-not $Posted) {

                throw "No fue posible enviar WM_COMMAND para abrir Empresas."
            }


            Start-Sleep -Seconds 4


            Write-Host "[OK] Comando Empresas enviado."


            # ========================================================
            # 8 - BUSCAR LISTVIEW DE EMPRESAS
            # ========================================================

            Write-Host ""
            Write-Host "[4] Buscando grilla ListView20WndClass..."


            $ListaEmpresas = $null

            $TimeoutLista =
                (Get-Date).AddSeconds(
                    20
                )


            while (
                (Get-Date) -lt $TimeoutLista -and
                -not $ListaEmpresas
            ) {

                $ListaEmpresas =
                    Get-ElementByClass `
                        -Root $MainWindow `
                        -ClassName "ListView20WndClass"


                if (-not $ListaEmpresas) {

                    Start-Sleep -Milliseconds 300
                }
            }


            # Fallback desde escritorio completo

            if (-not $ListaEmpresas) {

                $ListaEmpresas =
                    Get-ElementByClass `
                        -Root ([System.Windows.Automation.AutomationElement]::RootElement) `
                        -ClassName "ListView20WndClass"
            }


            if (-not $ListaEmpresas) {

                throw "Se ejecuto Empresas pero no se encontro ListView20WndClass."
            }


            $ListHandle =
                [IntPtr]$ListaEmpresas.Current.NativeWindowHandle


            Write-Host "[OK] Grilla de empresas detectada."
            Write-Host "[INFO] Clase  : $($ListaEmpresas.Current.ClassName)"
            Write-Host "[INFO] Handle : $ListHandle"
            Write-Host ""


            # ========================================================
            # 9 - CANTIDAD DE EMPRESAS
            # ========================================================

            $CantidadEmpresas =
                [NativeListView]::GetItemCount(
                    $ListHandle
                )


            Write-Host "[INFO] Empresas encontradas en la grilla: $CantidadEmpresas"


            if (
                $CantidadEmpresas -le 0
            ) {

                throw "La grilla fue encontrada pero no contiene empresas."
            }


            # ========================================================
            # 10 - ESTADO INICIAL
            # ========================================================

            Write-Host ""
            Write-Host "[5] Estado inicial de los checks..."


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                Write-Host "[INFO] Fila $($i + 1) - Estado inicial: $Estado"
            }


            # ========================================================
            # 11 - MARCAR TODAS
            # ========================================================

            Write-Host ""
            Write-Host "[6] Marcando todas las empresas..."


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -eq 2
                ) {

                    Write-Host "[OK] Fila $($i + 1) ya estaba marcada."

                    continue
                }


                Write-Host "[INFO] Marcando fila $($i + 1)..."


                $Resultado =
                    [NativeListView]::SetChecked(
                        $ListHandle,
                        $i,
                        $true
                    )


                if (-not $Resultado) {

                    throw "No fue posible marcar la fila $($i + 1)."
                }


                Start-Sleep -Milliseconds 150
            }


            # ========================================================
            # 12 - VERIFICAR
            # ========================================================

            Write-Host ""
            Write-Host "[7] Verificando seleccion..."


            $Marcadas = 0
            $NoMarcadas = 0


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -eq 2
                ) {

                    $Marcadas++

                    Write-Host "[OK] Fila $($i + 1) marcada."
                }
                else {

                    $NoMarcadas++

                    Write-Host "[ERROR] Fila $($i + 1) NO marcada. Estado=$Estado"
                }
            }


            # ========================================================
            # RESULTADO
            # ========================================================

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " RESULTADO DE LA PRUEBA"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Servidor            : $env:COMPUTERNAME"
            Write-Host "Empresas detectadas : $CantidadEmpresas"
            Write-Host "Empresas marcadas   : $Marcadas"
            Write-Host "No marcadas         : $NoMarcadas"
            Write-Host ""


            if (
                $Marcadas -ne
                $CantidadEmpresas
            ) {

                throw "No quedaron seleccionadas todas las empresas."
            }


            Write-Host "=========================================================="
            Write-Host " OK - TODAS LAS EMPRESAS QUEDARON MARCADAS"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "[TEST] NO se ejecuta Convertir."
            Write-Host ""
            Write-Host "[DEBUG] Config quedara abierto durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Revise visualmente la pantalla Empresas."
            Write-Host ""


            if (
                $DebugPauseMinutes -gt 0
            ) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            Write-Host "[OK] Prueba finalizada correctamente."

            exit 0
        }


        # ============================================================
        # ERROR / DEBUG
        # ============================================================

        catch {

            $MensajeError =
                $_.Exception.Message


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ERROR DURANTE LA AUTOMATIZACION"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Error:"
            Write-Host $MensajeError
            Write-Host ""


            $ProcesosConfig =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if ($ProcesosConfig) {

                Write-Host "[DEBUG] cwConfig.exe continua abierto."

                foreach ($Proceso in $ProcesosConfig) {

                    Write-Host "[DEBUG] PID cwConfig: $($Proceso.Id)"
                }
            }
            else {

                Write-Host "[WARN] cwConfig.exe no aparece como proceso activo."
            }


            Write-Host ""
            Write-Host "[DEBUG] El job permanecera activo durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Puede revisar manualmente donde quedo Configuracion."
            Write-Host ""


            if (
                $DebugPauseMinutes -gt 0
            ) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            throw $MensajeError
        }
