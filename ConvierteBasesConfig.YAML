trigger: none

parameters:
- name: debugPauseMinutes
  displayName: "Minutos para dejar Config abierto si falla"
  type: number
  default: 20

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: ConvertirEmpresasSoftland
  displayName: "Convertir empresas Softland"
  timeoutInMinutes: 360

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Convertir empresas Softland"

    env:
      SOFTLAND_PASSWORD: $(SOFTLAND_PASSWORD)
      DEBUG_PAUSE_MINUTES: ${{ parameters.debugPauseMinutes }}

    inputs:
      targetType: inline
      pwsh: false

      script: |

        $ErrorActionPreference = "Stop"

        $Password = $env:SOFTLAND_PASSWORD
        $DebugPauseMinutes = [int]$env:DEBUG_PAUSE_MINUTES

        if ([string]::IsNullOrWhiteSpace($Password)) {
            throw "No se encontro la variable secreta SOFTLAND_PASSWORD."
        }

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - CONVERSION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # WIN32 / MENU NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Text;
        using System.Runtime.InteropServices;

        public static class NativeWindows
        {
            public const uint WM_COMMAND = 0x0111;
            public const uint WM_INITMENUPOPUP = 0x0117;
            public const uint MF_BYPOSITION = 0x00000400;

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetMenu(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern int GetMenuItemCount(
                IntPtr hMenu
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetSubMenu(
                IntPtr hMenu,
                int nPos
            );

            [DllImport("user32.dll")]
            public static extern uint GetMenuItemID(
                IntPtr hMenu,
                int nPos
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            public static extern int GetMenuString(
                IntPtr hMenu,
                uint uIDItem,
                StringBuilder lpString,
                int cchMax,
                uint flags
            );

            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            public static extern bool PostMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );
        }
        "@


        # ============================================================
        # CONTROLES / DIALOGOS NATIVOS
        # ============================================================

        Add-Type @"
        using System;
        using System.Collections.Generic;
        using System.Text;
        using System.Runtime.InteropServices;

        public static class NativeDialogs
        {
            public const uint BM_CLICK = 0x00F5;
            public const uint WM_SETTEXT = 0x000C;
            public const uint WM_LBUTTONDOWN = 0x0201;
            public const uint WM_LBUTTONUP = 0x0202;
            public const uint MK_LBUTTON = 0x0001;

            public delegate bool EnumWindowsProc(
                IntPtr hWnd,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern bool EnumWindows(
                EnumWindowsProc lpEnumFunc,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern bool EnumChildWindows(
                IntPtr hWndParent,
                EnumWindowsProc lpEnumFunc,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint lpdwProcessId
            );

            [DllImport("user32.dll")]
            static extern bool IsWindowVisible(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool IsWindow(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool IsWindowEnabled(
                IntPtr hWnd
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            static extern int GetWindowText(
                IntPtr hWnd,
                StringBuilder lpString,
                int nMaxCount
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            static extern int GetClassName(
                IntPtr hWnd,
                StringBuilder lpClassName,
                int nMaxCount
            );

            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                string lParam
            );

            [DllImport("user32.dll")]
            static extern bool PostMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );


            public static string GetText(
                IntPtr hWnd
            )
            {
                StringBuilder sb =
                    new StringBuilder(2048);

                GetWindowText(
                    hWnd,
                    sb,
                    sb.Capacity
                );

                return sb.ToString();
            }


            public static string GetClass(
                IntPtr hWnd
            )
            {
                StringBuilder sb =
                    new StringBuilder(512);

                GetClassName(
                    hWnd,
                    sb,
                    sb.Capacity
                );

                return sb.ToString();
            }


            public static IntPtr[] GetTopWindows(
                int processId
            )
            {
                List<IntPtr> result =
                    new List<IntPtr>();

                EnumWindows(
                    delegate(IntPtr hWnd, IntPtr lParam)
                    {
                        uint pid;

                        GetWindowThreadProcessId(
                            hWnd,
                            out pid
                        );

                        if (
                            pid == processId &&
                            IsWindowVisible(hWnd)
                        )
                        {
                            result.Add(hWnd);
                        }

                        return true;
                    },
                    IntPtr.Zero
                );

                return result.ToArray();
            }


            public static IntPtr[] GetChildren(
                IntPtr parent
            )
            {
                List<IntPtr> result =
                    new List<IntPtr>();

                EnumChildWindows(
                    parent,
                    delegate(IntPtr hWnd, IntPtr lParam)
                    {
                        result.Add(hWnd);
                        return true;
                    },
                    IntPtr.Zero
                );

                return result.ToArray();
            }


            public static string GetCombinedText(
                IntPtr parent
            )
            {
                StringBuilder result =
                    new StringBuilder();

                string rootText =
                    GetText(parent);

                if (!String.IsNullOrWhiteSpace(rootText))
                {
                    result.Append(rootText);
                    result.Append(" ");
                }

                foreach (
                    IntPtr child in
                    GetChildren(parent)
                )
                {
                    string text =
                        GetText(child);

                    if (!String.IsNullOrWhiteSpace(text))
                    {
                        result.Append(text);
                        result.Append(" ");
                    }
                }

                return result.ToString();
            }


            static bool ContainsAll(
                string source,
                string[] terms
            )
            {
                if (terms == null)
                    return true;

                string value =
                    source.ToLowerInvariant();

                foreach (string term in terms)
                {
                    if (
                        String.IsNullOrWhiteSpace(term)
                    )
                        continue;

                    if (
                        !value.Contains(
                            term.ToLowerInvariant()
                        )
                    )
                        return false;
                }

                return true;
            }


            public static IntPtr FindWindow(
                int processId,
                string[] requiredTerms
            )
            {
                foreach (
                    IntPtr hWnd in
                    GetTopWindows(processId)
                )
                {
                    string text =
                        GetCombinedText(hWnd);

                    if (
                        ContainsAll(
                            text,
                            requiredTerms
                        )
                    )
                    {
                        return hWnd;
                    }
                }

                return IntPtr.Zero;
            }


            static string NormalizeText(
                string value
            )
            {
                if (value == null)
                    return "";

                return value
                    .Replace("&", "")
                    .Trim();
            }


            public static IntPtr FindChildByText(
                IntPtr parent,
                string[] names
            )
            {
                foreach (
                    IntPtr child in
                    GetChildren(parent)
                )
                {
                    string current =
                        NormalizeText(
                            GetText(child)
                        );

                    foreach (
                        string wanted in
                        names
                    )
                    {
                        if (
                            String.Equals(
                                current,
                                NormalizeText(wanted),
                                StringComparison.OrdinalIgnoreCase
                            )
                        )
                        {
                            return child;
                        }
                    }
                }

                return IntPtr.Zero;
            }


            public static IntPtr FindChildByClass(
                IntPtr parent,
                string[] classParts
            )
            {
                foreach (
                    IntPtr child in
                    GetChildren(parent)
                )
                {
                    string current =
                        GetClass(child);

                    foreach (
                        string wanted in
                        classParts
                    )
                    {
                        if (
                            current.IndexOf(
                                wanted,
                                StringComparison.OrdinalIgnoreCase
                            ) >= 0
                        )
                        {
                            return child;
                        }
                    }
                }

                return IntPtr.Zero;
            }


            public static bool Click(
                IntPtr hWnd
            )
            {
                if (
                    hWnd == IntPtr.Zero ||
                    !IsWindow(hWnd)
                )
                {
                    return false;
                }

                SendMessage(
                    hWnd,
                    BM_CLICK,
                    IntPtr.Zero,
                    IntPtr.Zero
                );

                return true;
            }


            public static bool ClickWithMouseMessages(
                IntPtr hWnd
            )
            {
                if (
                    hWnd == IntPtr.Zero ||
                    !IsWindow(hWnd)
                )
                {
                    return false;
                }

                PostMessage(
                    hWnd,
                    WM_LBUTTONDOWN,
                    new IntPtr(MK_LBUTTON),
                    IntPtr.Zero
                );

                PostMessage(
                    hWnd,
                    WM_LBUTTONUP,
                    IntPtr.Zero,
                    IntPtr.Zero
                );

                return true;
            }


            public static bool SetText(
                IntPtr hWnd,
                string value
            )
            {
                if (
                    hWnd == IntPtr.Zero ||
                    !IsWindow(hWnd)
                )
                {
                    return false;
                }

                SendMessage(
                    hWnd,
                    WM_SETTEXT,
                    IntPtr.Zero,
                    value
                );

                return true;
            }
        }
        "@


        # ============================================================
        # LISTVIEW NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;
            const uint LVM_GETITEMCOUNT = LVM_FIRST + 4;
            const uint LVM_SETITEMSTATE = LVM_FIRST + 43;
            const uint LVM_GETITEMSTATE = LVM_FIRST + 44;

            const uint LVIS_STATEIMAGEMASK = 0xF000;

            const uint PROCESS_VM_OPERATION = 0x0008;
            const uint PROCESS_VM_READ = 0x0010;
            const uint PROCESS_VM_WRITE = 0x0020;
            const uint PROCESS_QUERY_INFORMATION = 0x0400;

            const uint MEM_COMMIT = 0x1000;
            const uint MEM_RESERVE = 0x2000;
            const uint MEM_RELEASE = 0x8000;
            const uint PAGE_READWRITE = 0x04;

            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );

            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );


            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }


            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state =
                    SendMessage(
                        handle,
                        LVM_GETITEMSTATE,
                        new IntPtr(index),
                        new IntPtr(LVIS_STATEIMAGEMASK)
                    ).ToInt32();

                return (
                    state & 0xF000
                ) >> 12;
            }


            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;

                GetWindowThreadProcessId(
                    handle,
                    out processId
                );

                IntPtr process =
                    OpenProcess(
                        PROCESS_VM_OPERATION |
                        PROCESS_VM_READ |
                        PROCESS_VM_WRITE |
                        PROCESS_QUERY_INFORMATION,
                        false,
                        processId
                    );

                if (
                    process ==
                    IntPtr.Zero
                )
                {
                    return false;
                }

                byte[] lvItem =
                    new byte[20];

                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;

                Buffer.BlockCopy(
                    BitConverter.GetBytes(
                        stateValue
                    ),
                    0,
                    lvItem,
                    12,
                    4
                );

                Buffer.BlockCopy(
                    BitConverter.GetBytes(
                        LVIS_STATEIMAGEMASK
                    ),
                    0,
                    lvItem,
                    16,
                    4
                );

                IntPtr remoteMemory =
                    VirtualAllocEx(
                        process,
                        IntPtr.Zero,
                        (UIntPtr)lvItem.Length,
                        MEM_COMMIT |
                        MEM_RESERVE,
                        PAGE_READWRITE
                    );

                if (
                    remoteMemory ==
                    IntPtr.Zero
                )
                {
                    CloseHandle(
                        process
                    );

                    return false;
                }

                UIntPtr written;

                bool ok =
                    WriteProcessMemory(
                        process,
                        remoteMemory,
                        lvItem,
                        (UIntPtr)lvItem.Length,
                        out written
                    );

                if (ok)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remoteMemory
                    );
                }

                VirtualFreeEx(
                    process,
                    remoteMemory,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );

                CloseHandle(
                    process
                );

                return ok;
            }
        }
        "@


        # ============================================================
        # FUNCIONES POWERSHELL
        # ============================================================

        function Normalize-Text {

            param(
                [string]$Text
            )

            if (
                $null -eq $Text
            ) {
                return ""
            }

            $Text =
                $Text.Replace(
                    "&",
                    ""
                ).Trim().ToLowerInvariant()

            if (
                $Text.Contains("`t")
            ) {
                $Text =
                    $Text.Split("`t")[0]
            }

            $Normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )

            $Builder =
                New-Object Text.StringBuilder

            foreach (
                $Char in
                $Normalized.ToCharArray()
            ) {

                $Category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $Char
                    )

                if (
                    $Category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$Builder.Append(
                        $Char
                    )
                }
            }

            return $Builder.ToString()
        }


        function Get-Descendants {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            return $Root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
            )
        }


        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$ClassName
            )

            $Condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )

            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }


        function Get-ElementByName {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string[]]$Names
            )

            foreach (
                $Element in
                (Get-Descendants -Root $Root)
            ) {

                try {

                    $Actual =
                        Normalize-Text `
                            $Element.Current.Name

                    foreach (
                        $Name in
                        $Names
                    ) {

                        if (
                            $Actual -eq
                            (Normalize-Text $Name)
                        ) {

                            return $Element
                        }
                    }
                }
                catch {
                }
            }

            return $null
        }


        function Get-MenuText {

            param(
                [IntPtr]$MenuHandle,
                [int]$Position
            )

            $Builder =
                New-Object System.Text.StringBuilder 512

            [void][NativeWindows]::GetMenuString(
                $MenuHandle,
                [uint32]$Position,
                $Builder,
                512,
                [NativeWindows]::MF_BYPOSITION
            )

            return $Builder.ToString()
        }


        function Find-NativeMenuPosition {

            param(
                [IntPtr]$MenuHandle,
                [string]$WantedText
            )

            $Wanted =
                Normalize-Text $WantedText

            $Count =
                [NativeWindows]::GetMenuItemCount(
                    $MenuHandle
                )

            for (
                $i = 0;
                $i -lt $Count;
                $i++
            ) {

                $Current =
                    Get-MenuText `
                        -MenuHandle $MenuHandle `
                        -Position $i

                if (
                    (Normalize-Text $Current) -eq
                    $Wanted
                ) {

                    return $i
                }
            }

            return -1
        }


        function Wait-NativeDialog {

            param(
                [int]$ProcessId,
                [string[]]$Terms,
                [int]$TimeoutSeconds = 60
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                $Handle =
                    [NativeDialogs]::FindWindow(
                        $ProcessId,
                        $Terms
                    )

                if (
                    $Handle -ne
                    [IntPtr]::Zero
                ) {

                    return $Handle
                }

                Start-Sleep -Milliseconds 300
            }

            return [IntPtr]::Zero
        }


        function Wait-NativeDialogWithButton {

            param(
                [int]$ProcessId,
                [string[]]$ButtonNames,
                [int]$TimeoutSeconds = 60
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                $Windows =
                    [NativeDialogs]::GetTopWindows(
                        $ProcessId
                    )

                foreach (
                    $WindowHandle in
                    $Windows
                ) {

                    $Button =
                        [NativeDialogs]::FindChildByText(
                            $WindowHandle,
                            $ButtonNames
                        )

                    if (
                        $Button -ne
                        [IntPtr]::Zero
                    ) {

                        return [PSCustomObject]@{
                            Window = $WindowHandle
                            Button = $Button
                        }
                    }
                }

                Start-Sleep -Milliseconds 300
            }

            return $null
        }


        function Wait-NativeHandleGone {

            param(
                [IntPtr]$Handle,
                [int]$TimeoutSeconds = 30
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                if (
                    -not (
                        [NativeDialogs]::IsWindow(
                            $Handle
                        )
                    )
                ) {

                    return $true
                }

                Start-Sleep -Milliseconds 250
            }

            return $false
        }


        function Click-NativeButton {

            param(
                [IntPtr]$Window,
                [string[]]$Names
            )

            $Button =
                [NativeDialogs]::FindChildByText(
                    $Window,
                    $Names
                )

            if (
                $Button -eq
                [IntPtr]::Zero
            ) {

                throw "No se encontro el boton: $($Names -join ', ')"
            }

            $ButtonText =
                [NativeDialogs]::GetText(
                    $Button
                )

            $ButtonClass =
                [NativeDialogs]::GetClass(
                    $Button
                )

            Write-Host "[INFO] Control encontrado:"
            Write-Host "       Texto  : $ButtonText"
            Write-Host "       Clase  : $ButtonClass"
            Write-Host "       Handle : $Button"


            $Clicked =
                [NativeDialogs]::Click(
                    $Button
                )


            if (-not $Clicked) {

                Write-Host "[WARN] BM_CLICK fallo."
                Write-Host "[INFO] Intentando mensajes de mouse..."


                $Clicked =
                    [NativeDialogs]::ClickWithMouseMessages(
                        $Button
                    )
            }


            if (-not $Clicked) {

                throw "No fue posible ejecutar click sobre $($Names -join ', ')."
            }


            return $Button
        }


        function Wait-PasswordDialog {

            param(
                [int]$ProcessId,
                [int]$TimeoutSeconds = 120
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                $Dialog =
                    [NativeDialogs]::FindWindow(
                        $ProcessId,
                        @(
                            "contrase"
                        )
                    )

                if (
                    $Dialog -ne
                    [IntPtr]::Zero
                ) {

                    return $Dialog
                }


                # ----------------------------------------------------
                # CONFIRMACION INTERMEDIA
                # ----------------------------------------------------

                $ConversionDialog =
                    [NativeDialogs]::FindWindow(
                        $ProcessId,
                        @(
                            "convert",
                            "empresa"
                        )
                    )


                if (
                    $ConversionDialog -ne
                    [IntPtr]::Zero
                ) {

                    $YesButton =
                        [NativeDialogs]::FindChildByText(
                            $ConversionDialog,
                            @(
                                "Si",
                                "Sí"
                            )
                        )


                    if (
                        $YesButton -ne
                        [IntPtr]::Zero
                    ) {

                        $Texto =
                            [NativeDialogs]::GetCombinedText(
                                $ConversionDialog
                            )


                        Write-Host "[INFO] Confirmacion previa a contraseña:"
                        Write-Host "       $Texto"
                        Write-Host "[INFO] Presionando Si..."


                        [void][NativeDialogs]::Click(
                            $YesButton
                        )


                        Start-Sleep -Milliseconds 500
                    }
                }


                Start-Sleep -Milliseconds 300
            }


            return [IntPtr]::Zero
        }


        function Set-NativePassword {

            param(
                [IntPtr]$Dialog,
                [string]$Value
            )

            $Edit =
                [NativeDialogs]::FindChildByClass(
                    $Dialog,
                    @(
                        "TextBox",
                        "Edit"
                    )
                )


            if (
                $Edit -ne
                [IntPtr]::Zero
            ) {

                Write-Host "[INFO] Campo contraseña detectado."
                Write-Host "[INFO] Clase: $([NativeDialogs]::GetClass($Edit))"


                return [NativeDialogs]::SetText(
                    $Edit,
                    $Value
                )
            }


            # --------------------------------------------------------
            # FALLBACK UI AUTOMATION
            # --------------------------------------------------------

            $Desktop =
                [System.Windows.Automation.AutomationElement]::RootElement


            foreach (
                $Element in
                (Get-Descendants -Root $Desktop)
            ) {

                try {

                    if (
                        $Element.Current.ProcessId -ne
                        $SoftlandProcessId
                    ) {

                        continue
                    }


                    if (
                        $Element.Current.ControlType -ne
                        [System.Windows.Automation.ControlType]::Edit
                    ) {

                        continue
                    }


                    try {

                        $ValuePattern =
                            $Element.GetCurrentPattern(
                                [System.Windows.Automation.ValuePattern]::Pattern
                            )


                        $ValuePattern.SetValue(
                            $Value
                        )


                        return $true
                    }
                    catch {
                    }
                }
                catch {
                }
            }


            return $false
        }


        # ============================================================
        # PROCESO PRINCIPAL
        # ============================================================

        try {


            # ========================================================
            # 1 - BUSCAR CWCONFIG
            # ========================================================

            Write-Host "[1] Buscando cwConfig.exe..."


            $PossiblePaths = @(
                "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",
                "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
            )


            $ConfigExe =
                $null


            foreach (
                $Path in
                $PossiblePaths
            ) {

                Write-Host "[INFO] Probando: $Path"


                if (
                    Test-Path $Path
                ) {

                    $ConfigExe =
                        $Path

                    break
                }
            }


            if (
                -not $ConfigExe
            ) {

                $SearchRoots = @(
                    "C:\Program Files (x86)\Softland",
                    "C:\Program Files\Softland"
                )


                foreach (
                    $RootPath in
                    $SearchRoots
                ) {

                    if (
                        Test-Path $RootPath
                    ) {

                        $Found =
                            Get-ChildItem `
                                -Path $RootPath `
                                -Filter "cwConfig.exe" `
                                -File `
                                -Recurse `
                                -ErrorAction SilentlyContinue |
                            Select-Object -First 1


                        if (
                            $Found
                        ) {

                            $ConfigExe =
                                $Found.FullName

                            break
                        }
                    }
                }
            }


            if (
                -not $ConfigExe
            ) {

                throw "No se encontro cwConfig.exe."
            }


            Write-Host "[OK] Ejecutable encontrado:"
            Write-Host "     $ConfigExe"


            # ========================================================
            # 2 - ABRIR CWCONFIG
            # ========================================================

            $Existing =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if (
                $Existing
            ) {

                Write-Host "[WARN] cwConfig.exe ya estaba abierto."
                Write-Host "[INFO] Se utilizara la ventana existente."
            }
            else {

                $Started =
                    Start-Process `
                        -FilePath $ConfigExe `
                        -PassThru


                Write-Host "[OK] cwConfig iniciado."
                Write-Host "[INFO] PID inicial: $($Started.Id)"
            }


            # ========================================================
            # 3 - VENTANA PRINCIPAL
            # ========================================================

            $MainWindow =
                $null


            $Timeout =
                (Get-Date).AddSeconds(
                    60
                )


            while (
                (Get-Date) -lt $Timeout
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )


                foreach (
                    $Window in
                    $Windows
                ) {

                    try {

                        $Title =
                            Normalize-Text `
                                $Window.Current.Name


                        if (
                            $Title -like "*configuracion del sistema de gestion*" -or
                            $Title -like "*configuracion de softland*"
                        ) {

                            $MainWindow =
                                $Window

                            break
                        }
                    }
                    catch {
                    }
                }


                if (
                    $MainWindow
                ) {

                    break
                }


                Start-Sleep -Seconds 1
            }


            if (
                -not $MainWindow
            ) {

                throw "No se encontro la ventana principal."
            }


            $MainHandle =
                [IntPtr]$MainWindow.Current.NativeWindowHandle


            $SoftlandProcessId =
                $MainWindow.Current.ProcessId


            [NativeWindows]::ShowWindowAsync(
                $MainHandle,
                9
            ) | Out-Null


            [NativeWindows]::SetForegroundWindow(
                $MainHandle
            ) | Out-Null


            Write-Host "[OK] Configuracion abierta."
            Write-Host "[INFO] PID: $SoftlandProcessId"


            # ========================================================
            # 4 - OPERACIONES -> EMPRESAS
            # ========================================================

            Write-Host "[3] Abriendo Operaciones -> Empresas..."


            $MainMenu =
                [NativeWindows]::GetMenu(
                    $MainHandle
                )


            if (
                $MainMenu -eq
                [IntPtr]::Zero
            ) {

                throw "No se obtuvo el menu principal."
            }


            $PosOperaciones =
                Find-NativeMenuPosition `
                    -MenuHandle $MainMenu `
                    -WantedText "Operaciones"


            if (
                $PosOperaciones -lt 0
            ) {

                throw "No se encontro Operaciones."
            }


            $MenuOperaciones =
                [NativeWindows]::GetSubMenu(
                    $MainMenu,
                    $PosOperaciones
                )


            if (
                $MenuOperaciones -eq
                [IntPtr]::Zero
            ) {

                throw "No se obtuvo el submenu Operaciones."
            }


            [void][NativeWindows]::SendMessage(
                $MainHandle,
                [NativeWindows]::WM_INITMENUPOPUP,
                $MenuOperaciones,
                [IntPtr]$PosOperaciones
            )


            $PosEmpresas =
                Find-NativeMenuPosition `
                    -MenuHandle $MenuOperaciones `
                    -WantedText "Empresas"


            if (
                $PosEmpresas -lt 0
            ) {

                throw "No se encontro Empresas."
            }


            $CommandEmpresas =
                [NativeWindows]::GetMenuItemID(
                    $MenuOperaciones,
                    $PosEmpresas
                )


            [void][NativeWindows]::PostMessage(
                $MainHandle,
                [NativeWindows]::WM_COMMAND,
                [IntPtr]$CommandEmpresas,
                [IntPtr]::Zero
            )


            Start-Sleep -Seconds 4


            Write-Host "[OK] Empresas abierto."


            # ========================================================
            # 5 - LISTVIEW
            # ========================================================

            $ListaEmpresas =
                Get-ElementByClass `
                    -Root $MainWindow `
                    -ClassName "ListView20WndClass"


            if (
                -not $ListaEmpresas
            ) {

                throw "No se encontro ListView20WndClass."
            }


            $ListHandle =
                [IntPtr]$ListaEmpresas.Current.NativeWindowHandle


            $CantidadEmpresas =
                [NativeListView]::GetItemCount(
                    $ListHandle
                )


            if (
                $CantidadEmpresas -le 0
            ) {

                throw "No se detectaron empresas."
            }


            Write-Host "[INFO] Empresas detectadas: $CantidadEmpresas"


            # ========================================================
            # 6 - MARCAR TODAS
            # ========================================================

            Write-Host "[5] Marcando empresas..."


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -ne 2
                ) {

                    $Resultado =
                        [NativeListView]::SetChecked(
                            $ListHandle,
                            $i,
                            $true
                        )


                    if (
                        -not $Resultado
                    ) {

                        throw "No se pudo marcar fila $($i + 1)."
                    }
                }
            }


            Write-Host "[OK] Empresas seleccionadas: $CantidadEmpresas"


            # ========================================================
            # 7 - CONVERTIR
            #
            # CORRECCION:
            # Ya no se usa UI Automation para hacer click.
            # Se usa el handle Win32 real del control.
            # ========================================================

            Write-Host "[6] Buscando boton Convertir..."


            $ConvertirNative =
                [NativeDialogs]::FindChildByText(
                    $MainHandle,
                    @(
                        "Convertir"
                    )
                )


            if (
                $ConvertirNative -eq
                [IntPtr]::Zero
            ) {

                throw "No se encontro el control nativo Convertir."
            }


            $ConvertirTexto =
                [NativeDialogs]::GetText(
                    $ConvertirNative
                )


            $ConvertirClase =
                [NativeDialogs]::GetClass(
                    $ConvertirNative
                )


            Write-Host "[OK] Convertir detectado."
            Write-Host "[INFO] Texto  : $ConvertirTexto"
            Write-Host "[INFO] Clase  : $ConvertirClase"
            Write-Host "[INFO] Handle : $ConvertirNative"


            Write-Host "[INFO] Presionando Convertir mediante Win32..."


            $ClickConvertir =
                [NativeDialogs]::Click(
                    $ConvertirNative
                )


            if (
                -not $ClickConvertir
            ) {

                Write-Host "[WARN] BM_CLICK no pudo utilizarse."
                Write-Host "[INFO] Probando WM_LBUTTONDOWN / WM_LBUTTONUP..."


                $ClickConvertir =
                    [NativeDialogs]::ClickWithMouseMessages(
                        $ConvertirNative
                    )
            }


            if (
                -not $ClickConvertir
            ) {

                throw "No fue posible presionar Convertir mediante Win32."
            }


            Write-Host "[OK] Comando de click enviado a Convertir."


            # ========================================================
            # 8 - CONFIRMACION GENERAL
            # ========================================================

            Write-Host "[7] Esperando confirmacion general..."


            $ConfirmacionGeneral =
                Wait-NativeDialog `
                    -ProcessId $SoftlandProcessId `
                    -Terms @(
                        "convertir",
                        "empresa"
                    ) `
                    -TimeoutSeconds 120


            if (
                $ConfirmacionGeneral -eq
                [IntPtr]::Zero
            ) {

                throw "No se detecto el cartel de confirmacion general."
            }


            $TextoGeneral =
                [NativeDialogs]::GetCombinedText(
                    $ConfirmacionGeneral
                )


            Write-Host "[OK] Confirmacion general detectada:"
            Write-Host "     $TextoGeneral"


            $BotonSiGeneral =
                Click-NativeButton `
                    -Window $ConfirmacionGeneral `
                    -Names @(
                        "Si",
                        "Sí"
                    )


            Write-Host "[OK] Se presiono Si en la confirmacion general."


            Start-Sleep -Milliseconds 800


            # ========================================================
            # 9 - PROCESAR EMPRESAS
            # ========================================================

            $Convertidas =
                0


            for (
                $Numero = 1;
                $Numero -le $CantidadEmpresas;
                $Numero++
            ) {

                Write-Host ""
                Write-Host "=========================================================="
                Write-Host " EMPRESA $Numero DE $CantidadEmpresas"
                Write-Host "=========================================================="
                Write-Host ""


                # ====================================================
                # CONTRASEÑA
                # ====================================================

                Write-Host "[INFO] Esperando Ingrese contraseña..."


                $PasswordDialog =
                    Wait-PasswordDialog `
                        -ProcessId $SoftlandProcessId `
                        -TimeoutSeconds 120


                if (
                    $PasswordDialog -eq
                    [IntPtr]::Zero
                ) {

                    throw "No aparecio la ventana Ingrese contraseña."
                }


                $TextoPassword =
                    [NativeDialogs]::GetCombinedText(
                        $PasswordDialog
                    )


                Write-Host "[OK] Ventana contraseña detectada:"
                Write-Host "     $TextoPassword"


                $PasswordResult =
                    Set-NativePassword `
                        -Dialog $PasswordDialog `
                        -Value $Password


                if (
                    -not $PasswordResult
                ) {

                    throw "No fue posible completar la contraseña."
                }


                Write-Host "[OK] Contraseña ingresada."
                Write-Host "[INFO] El valor secreto no se muestra en el log."


                $AceptarPassword =
                    Click-NativeButton `
                        -Window $PasswordDialog `
                        -Names @(
                            "Aceptar",
                            "OK"
                        )


                Write-Host "[OK] Aceptar presionado."


                Start-Sleep -Milliseconds 800


                # ====================================================
                # PRIMERA CONFIRMACION POSTERIOR
                # ====================================================

                Write-Host "[INFO] Esperando primera confirmacion posterior..."


                $Confirm1 =
                    Wait-NativeDialogWithButton `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "Si",
                            "Sí"
                        ) `
                        -TimeoutSeconds 120


                if (
                    -not $Confirm1
                ) {

                    throw "No aparecio la primera confirmacion posterior."
                }


                $Texto1 =
                    [NativeDialogs]::GetCombinedText(
                        $Confirm1.Window
                    )


                Write-Host "[INFO] Confirmacion 1:"
                Write-Host "       $Texto1"


                [void][NativeDialogs]::Click(
                    $Confirm1.Button
                )


                Write-Host "[OK] Si #1 presionado."


                Start-Sleep -Milliseconds 800


                # ====================================================
                # SEGUNDA CONFIRMACION POSTERIOR
                # ====================================================

                Write-Host "[INFO] Esperando segunda confirmacion posterior..."


                $Confirm2 =
                    Wait-NativeDialogWithButton `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "Si",
                            "Sí"
                        ) `
                        -TimeoutSeconds 120


                if (
                    -not $Confirm2
                ) {

                    throw "No aparecio la segunda confirmacion posterior."
                }


                $Texto2 =
                    [NativeDialogs]::GetCombinedText(
                        $Confirm2.Window
                    )


                Write-Host "[INFO] Confirmacion 2:"
                Write-Host "       $Texto2"


                [void][NativeDialogs]::Click(
                    $Confirm2.Button
                )


                Write-Host "[OK] Si #2 presionado."


                Start-Sleep -Seconds 1


                # ====================================================
                # FINALIZACION
                # ====================================================

                Write-Host "[INFO] Conversion en curso..."
                Write-Host "[INFO] Esperando cartel de finalizacion..."


                $Finalizado =
                    Wait-NativeDialog `
                        -ProcessId $SoftlandProcessId `
                        -Terms @(
                            "finaliz",
                            "convers"
                        ) `
                        -TimeoutSeconds 1800


                if (
                    $Finalizado -eq
                    [IntPtr]::Zero
                ) {

                    throw "No aparecio el cartel de finalizacion de conversion."
                }


                $TextoFinal =
                    [NativeDialogs]::GetCombinedText(
                        $Finalizado
                    )


                Write-Host ""
                Write-Host "[OK] Conversion finalizada."
                Write-Host "[INFO] Mensaje:"
                Write-Host "       $TextoFinal"


                $BotonOK =
                    Click-NativeButton `
                        -Window $Finalizado `
                        -Names @(
                            "OK",
                            "Aceptar"
                        )


                Write-Host "[OK] OK de finalizacion presionado."


                $Convertidas++


                Write-Host ""
                Write-Host "[OK] Empresas convertidas: $Convertidas / $CantidadEmpresas"


                # ====================================================
                # SIGUIENTE EMPRESA
                # ====================================================

                if (
                    $Numero -lt
                    $CantidadEmpresas
                ) {

                    Start-Sleep -Milliseconds 800


                    Write-Host ""
                    Write-Host "[INFO] Esperando confirmacion para la siguiente empresa..."


                    $Siguiente =
                        Wait-NativeDialog `
                            -ProcessId $SoftlandProcessId `
                            -Terms @(
                                "convertir",
                                "empresa"
                            ) `
                            -TimeoutSeconds 120


                    if (
                        $Siguiente -eq
                        [IntPtr]::Zero
                    ) {

                        throw "No aparecio la confirmacion de la siguiente empresa."
                    }


                    $TextoSiguiente =
                        [NativeDialogs]::GetCombinedText(
                            $Siguiente
                        )


                    Write-Host "[INFO] Softland solicita continuar:"
                    Write-Host "       $TextoSiguiente"


                    $BotonSiguiente =
                        Click-NativeButton `
                            -Window $Siguiente `
                            -Names @(
                                "Si",
                                "Sí"
                            )


                    Write-Host "[OK] Se autorizo continuar con la siguiente empresa."


                    Start-Sleep -Milliseconds 800
                }
            }


            # ========================================================
            # FINAL
            # ========================================================

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " CONVERSION MULTIEMPRESA FINALIZADA"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Servidor             : $env:COMPUTERNAME"
            Write-Host "Empresas detectadas  : $CantidadEmpresas"
            Write-Host "Empresas convertidas : $Convertidas"
            Write-Host ""


            if (
                $Convertidas -ne
                $CantidadEmpresas
            ) {

                throw "No se convirtieron todas las empresas."
            }


            Write-Host "=========================================================="
            Write-Host " OK - TODAS LAS EMPRESAS FUERON CONVERTIDAS"
            Write-Host "=========================================================="
            Write-Host ""


            exit 0
        }


        # ============================================================
        # ERROR / DEBUG
        # ============================================================

        catch {

            $MensajeError =
                $_.Exception.Message


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ERROR DURANTE LA CONVERSION"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Error:"
            Write-Host $MensajeError
            Write-Host ""


            $Procesos =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if (
                $Procesos
            ) {

                Write-Host "[DEBUG] cwConfig.exe continua abierto."


                foreach (
                    $Proceso in
                    $Procesos
                ) {

                    Write-Host "[DEBUG] PID cwConfig: $($Proceso.Id)"
                }
            }
            else {

                Write-Host "[WARN] cwConfig.exe no aparece ejecutandose."
            }


            Write-Host ""
            Write-Host "[DEBUG] El job permanecera activo durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Revise visualmente donde quedo Softland."
            Write-Host ""


            if (
                $DebugPauseMinutes -gt 0
            ) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            throw $MensajeError
        }
