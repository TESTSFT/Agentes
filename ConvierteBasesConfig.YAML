trigger: none

parameters:
- name: debugPauseMinutes
  displayName: "Minutos para dejar Config abierto si falla"
  type: number
  default: 20

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: ConvertirEmpresasSoftland
  displayName: "Convertir empresas Softland"
  timeoutInMinutes: 360

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Convertir empresas Softland"
    env:
      SOFTLAND_PASSWORD: $(SOFTLAND_PASSWORD)
      DEBUG_PAUSE_MINUTES: ${{ parameters.debugPauseMinutes }}

    inputs:
      targetType: inline
      pwsh: false
      script: |

        $ErrorActionPreference = "Stop"

        $Password = $env:SOFTLAND_PASSWORD
        $DebugPauseMinutes = [int]$env:DEBUG_PAUSE_MINUTES

        if ([string]::IsNullOrWhiteSpace($Password)) {
            throw "No se encontro la variable secreta SOFTLAND_PASSWORD."
        }

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - CONVERSION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # WIN32 / MENU NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Text;
        using System.Runtime.InteropServices;

        public static class NativeWindows
        {
            public const uint WM_COMMAND = 0x0111;
            public const uint WM_INITMENUPOPUP = 0x0117;
            public const uint MF_BYPOSITION = 0x00000400;

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(
                int X,
                int Y
            );

            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetMenu(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern int GetMenuItemCount(
                IntPtr hMenu
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetSubMenu(
                IntPtr hMenu,
                int nPos
            );

            [DllImport("user32.dll")]
            public static extern uint GetMenuItemID(
                IntPtr hMenu,
                int nPos
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            public static extern int GetMenuString(
                IntPtr hMenu,
                uint uIDItem,
                StringBuilder lpString,
                int cchMax,
                uint flags
            );

            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            public static extern bool PostMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );
        }
        "@


        # ============================================================
        # LISTVIEW NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;
            const uint LVM_GETITEMCOUNT = LVM_FIRST + 4;
            const uint LVM_SETITEMSTATE = LVM_FIRST + 43;
            const uint LVM_GETITEMSTATE = LVM_FIRST + 44;

            const uint LVIS_STATEIMAGEMASK = 0xF000;

            const uint PROCESS_VM_OPERATION = 0x0008;
            const uint PROCESS_VM_READ = 0x0010;
            const uint PROCESS_VM_WRITE = 0x0020;
            const uint PROCESS_QUERY_INFORMATION = 0x0400;

            const uint MEM_COMMIT = 0x1000;
            const uint MEM_RESERVE = 0x2000;
            const uint MEM_RELEASE = 0x8000;
            const uint PAGE_READWRITE = 0x04;

            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );

            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );

            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );

            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );

            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );

            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );

            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }

            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state = SendMessage(
                    handle,
                    LVM_GETITEMSTATE,
                    new IntPtr(index),
                    new IntPtr(LVIS_STATEIMAGEMASK)
                ).ToInt32();

                return (state & 0xF000) >> 12;
            }

            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;

                GetWindowThreadProcessId(
                    handle,
                    out processId
                );

                IntPtr process = OpenProcess(
                    PROCESS_VM_OPERATION |
                    PROCESS_VM_READ |
                    PROCESS_VM_WRITE |
                    PROCESS_QUERY_INFORMATION,
                    false,
                    processId
                );

                if (process == IntPtr.Zero)
                {
                    return false;
                }

                byte[] lvItem = new byte[20];

                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;

                Buffer.BlockCopy(
                    BitConverter.GetBytes(stateValue),
                    0,
                    lvItem,
                    12,
                    4
                );

                Buffer.BlockCopy(
                    BitConverter.GetBytes(LVIS_STATEIMAGEMASK),
                    0,
                    lvItem,
                    16,
                    4
                );

                IntPtr remoteMemory = VirtualAllocEx(
                    process,
                    IntPtr.Zero,
                    (UIntPtr)lvItem.Length,
                    MEM_COMMIT | MEM_RESERVE,
                    PAGE_READWRITE
                );

                if (remoteMemory == IntPtr.Zero)
                {
                    CloseHandle(process);
                    return false;
                }

                UIntPtr written;

                bool ok = WriteProcessMemory(
                    process,
                    remoteMemory,
                    lvItem,
                    (UIntPtr)lvItem.Length,
                    out written
                );

                if (ok)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remoteMemory
                    );
                }

                VirtualFreeEx(
                    process,
                    remoteMemory,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );

                CloseHandle(process);

                return ok;
            }
        }
        "@


        # ============================================================
        # FUNCIONES GENERALES
        # ============================================================

        function Normalize-Text {

            param(
                [string]$Text
            )

            if ($null -eq $Text) {
                return ""
            }

            $Text =
                $Text.Replace(
                    "&",
                    ""
                ).Trim().ToLowerInvariant()

            if ($Text.Contains("`t")) {
                $Text = $Text.Split("`t")[0]
            }

            $Normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )

            $Builder =
                New-Object Text.StringBuilder

            foreach ($Char in $Normalized.ToCharArray()) {

                $Category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $Char
                    )

                if (
                    $Category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$Builder.Append(
                        $Char
                    )
                }
            }

            return $Builder.ToString()
        }


        function Get-Descendants {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            return $Root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
            )
        }


        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$ClassName
            )

            $Condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )

            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }


        function Get-ElementByName {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string[]]$Names
            )

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    $CurrentName =
                        Normalize-Text `
                            $Element.Current.Name

                    foreach ($Name in $Names) {

                        if (
                            $CurrentName -eq
                            (Normalize-Text $Name)
                        ) {

                            return $Element
                        }
                    }
                }
                catch {
                }
            }

            return $null
        }


        function Click-Element {

            param(
                [System.Windows.Automation.AutomationElement]$Element
            )

            if ($null -eq $Element) {

                throw "Se intento hacer clic sobre un elemento inexistente."
            }


            # --------------------------------------------------------
            # INVOKE
            # --------------------------------------------------------

            try {

                $Invoke =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.InvokePattern]::Pattern
                    )

                $Invoke.Invoke()

                return
            }
            catch {
            }


            # --------------------------------------------------------
            # LEGACY
            # --------------------------------------------------------

            try {

                $Legacy =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                    )

                $Legacy.DoDefaultAction()

                return
            }
            catch {
            }


            # --------------------------------------------------------
            # CLICK FISICO
            # --------------------------------------------------------

            $Rect =
                $Element.Current.BoundingRectangle

            $X =
                [int](
                    $Rect.Left +
                    ($Rect.Width / 2)
                )

            $Y =
                [int](
                    $Rect.Top +
                    ($Rect.Height / 2)
                )

            [NativeWindows]::SetCursorPos(
                $X,
                $Y
            ) | Out-Null

            Start-Sleep -Milliseconds 250

            [NativeWindows]::mouse_event(
                0x0002,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )

            [NativeWindows]::mouse_event(
                0x0004,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )
        }


        function Get-MenuText {

            param(
                [IntPtr]$MenuHandle,
                [int]$Position
            )

            $Builder =
                New-Object System.Text.StringBuilder 512

            [void][NativeWindows]::GetMenuString(
                $MenuHandle,
                [uint32]$Position,
                $Builder,
                512,
                [NativeWindows]::MF_BYPOSITION
            )

            return $Builder.ToString()
        }


        function Find-NativeMenuPosition {

            param(
                [IntPtr]$MenuHandle,
                [string]$WantedText
            )

            $Wanted =
                Normalize-Text $WantedText

            $Count =
                [NativeWindows]::GetMenuItemCount(
                    $MenuHandle
                )

            for (
                $i = 0;
                $i -lt $Count;
                $i++
            ) {

                $Current =
                    Get-MenuText `
                        -MenuHandle $MenuHandle `
                        -Position $i

                if (
                    (Normalize-Text $Current) -eq $Wanted
                ) {

                    return $i
                }
            }

            return -1
        }


        function Get-WindowText {

            param(
                [System.Windows.Automation.AutomationElement]$Window
            )

            $Texts = @()

            try {

                if (
                    -not [string]::IsNullOrWhiteSpace(
                        $Window.Current.Name
                    )
                ) {

                    $Texts +=
                        $Window.Current.Name
                }
            }
            catch {
            }


            foreach ($Element in (Get-Descendants -Root $Window)) {

                try {

                    if (
                        -not [string]::IsNullOrWhiteSpace(
                            $Element.Current.Name
                        )
                    ) {

                        $Texts +=
                            $Element.Current.Name
                    }
                }
                catch {
                }
            }


            return (
                $Texts -join " "
            )
        }


        function Get-ProcessDialogs {

            param(
                [int]$ProcessId,
                [int64]$MainHandle
            )

            $Desktop =
                [System.Windows.Automation.AutomationElement]::RootElement


            $Windows =
                $Desktop.FindAll(
                    [System.Windows.Automation.TreeScope]::Children,
                    [System.Windows.Automation.Condition]::TrueCondition
                )


            $Result = @()


            foreach ($Window in $Windows) {

                try {

                    if (
                        $Window.Current.ProcessId -eq $ProcessId -and
                        $Window.Current.NativeWindowHandle -ne $MainHandle -and
                        -not $Window.Current.IsOffscreen
                    ) {

                        $Result += $Window
                    }
                }
                catch {
                }
            }


            return @($Result)
        }


        function Wait-Dialog {

            param(
                [int]$ProcessId,
                [int64]$MainHandle,
                [scriptblock]$Condition,
                [int]$TimeoutSeconds = 60
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )


            while (
                (Get-Date) -lt $End
            ) {

                $Dialogs =
                    @(
                        Get-ProcessDialogs `
                            -ProcessId $ProcessId `
                            -MainHandle $MainHandle
                    )


                foreach ($Dialog in $Dialogs) {

                    try {

                        if (
                            & $Condition $Dialog
                        ) {

                            return $Dialog
                        }
                    }
                    catch {
                    }
                }


                Start-Sleep -Milliseconds 500
            }


            return $null
        }


        function Wait-DialogClose {

            param(
                [int64]$Handle,
                [int]$TimeoutSeconds = 30
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )


            while (
                (Get-Date) -lt $End
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )


                $Found =
                    $false


                foreach ($Window in $Windows) {

                    try {

                        if (
                            [int64]$Window.Current.NativeWindowHandle -eq
                            $Handle
                        ) {

                            $Found =
                                $true

                            break
                        }
                    }
                    catch {
                    }
                }


                if (-not $Found) {

                    return $true
                }


                Start-Sleep -Milliseconds 300
            }


            return $false
        }


        function Get-YesButton {

            param(
                [System.Windows.Automation.AutomationElement]$Window
            )

            return Get-ElementByName `
                -Root $Window `
                -Names @(
                    "Si",
                    "Sí",
                    "&Si",
                    "&Sí"
                )
        }


        function Get-OkButton {

            param(
                [System.Windows.Automation.AutomationElement]$Window
            )

            return Get-ElementByName `
                -Root $Window `
                -Names @(
                    "OK",
                    "Aceptar",
                    "&Aceptar"
                )
        }


        function Set-Password {

            param(
                [System.Windows.Automation.AutomationElement]$Window,
                [string]$Value
            )

            foreach ($Element in (Get-Descendants -Root $Window)) {

                try {

                    if (
                        $Element.Current.ControlType -eq
                        [System.Windows.Automation.ControlType]::Edit
                    ) {


                        # ------------------------------------------------
                        # VALUE PATTERN
                        # ------------------------------------------------

                        try {

                            $ValuePattern =
                                $Element.GetCurrentPattern(
                                    [System.Windows.Automation.ValuePattern]::Pattern
                                )

                            $ValuePattern.SetValue(
                                $Value
                            )

                            return $true
                        }
                        catch {
                        }


                        # ------------------------------------------------
                        # LEGACY
                        # ------------------------------------------------

                        try {

                            $Legacy =
                                $Element.GetCurrentPattern(
                                    [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                                )

                            $Legacy.SetValue(
                                $Value
                            )

                            return $true
                        }
                        catch {
                        }
                    }
                }
                catch {
                }
            }


            return $false
        }


        function Get-CompanyFromText {

            param(
                [string]$Text
            )

            $Clean =
                $Text `
                -replace "`r"," " `
                -replace "`n"," "


            $Patterns = @(

                '(?i)convertir\s+la\s+empresa\s+([A-Za-z0-9_\.-]+)',

                '(?i)convertir\s+empresa\s+([A-Za-z0-9_\.-]+)'
            )


            foreach ($Pattern in $Patterns) {

                $Match =
                    [regex]::Match(
                        $Clean,
                        $Pattern
                    )


                if (
                    $Match.Success
                ) {

                    return $Match.Groups[1].Value
                }
            }


            return "DESCONOCIDA"
        }


        function Wait-FinishDialog {

            param(
                [int]$ProcessId,
                [int64]$MainHandle,
                [int]$TimeoutSeconds = 1800
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            $LastLog =
                Get-Date


            while (
                (Get-Date) -lt $End
            ) {

                $Dialogs =
                    @(
                        Get-ProcessDialogs `
                            -ProcessId $ProcessId `
                            -MainHandle $MainHandle
                    )


                foreach ($Dialog in $Dialogs) {

                    try {

                        $OriginalText =
                            Get-WindowText `
                                -Window $Dialog


                        $Text =
                            Normalize-Text `
                                $OriginalText


                        # ------------------------------------------------
                        # ERROR
                        # ------------------------------------------------

                        if (
                            $Text -match "error|excepcion|exception|fallo|failed"
                        ) {

                            throw "Softland informo un error durante la conversion: $OriginalText"
                        }


                        # ------------------------------------------------
                        # FINALIZACION
                        # ------------------------------------------------

                        if (
                            $Text -like "*finaliz*" -and
                            (
                                $Text -like "*convers*" -or
                                $Text -like "*convert*" -or
                                $Text -like "*proceso*"
                            )
                        ) {

                            return $Dialog
                        }
                    }
                    catch {

                        if (
                            $_.Exception.Message -like
                            "Softland informo un error*"
                        ) {

                            throw
                        }
                    }
                }


                if (
                    ((Get-Date) - $LastLog).TotalSeconds -ge 15
                ) {

                    Write-Host "[INFO] Conversion todavia en curso..."

                    $LastLog =
                        Get-Date
                }


                Start-Sleep -Seconds 1
            }


            return $null
        }


        # ============================================================
        # PROCESO PRINCIPAL
        # ============================================================

        try {


            # ========================================================
            # 1 - BUSCAR CWCONFIG
            # ========================================================

            Write-Host "[1] Buscando cwConfig.exe..."


            $PossiblePaths = @(

                "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",

                "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
            )


            $ConfigExe =
                $null


            foreach ($Path in $PossiblePaths) {

                Write-Host "[INFO] Probando: $Path"

                if (
                    Test-Path $Path
                ) {

                    $ConfigExe =
                        $Path

                    break
                }
            }


            if (
                -not $ConfigExe
            ) {

                Write-Host "[INFO] No se encontro en rutas estandar."
                Write-Host "[INFO] Buscando dentro de Softland..."


                $SearchRoots = @(

                    "C:\Program Files (x86)\Softland",

                    "C:\Program Files\Softland"
                )


                foreach ($RootPath in $SearchRoots) {

                    if (
                        Test-Path $RootPath
                    ) {

                        $Found =
                            Get-ChildItem `
                                -Path $RootPath `
                                -Filter "cwConfig.exe" `
                                -File `
                                -Recurse `
                                -ErrorAction SilentlyContinue |
                            Select-Object -First 1


                        if (
                            $Found
                        ) {

                            $ConfigExe =
                                $Found.FullName

                            break
                        }
                    }
                }
            }


            if (
                -not $ConfigExe
            ) {

                throw "No se encontro cwConfig.exe en este servidor."
            }


            Write-Host ""
            Write-Host "[OK] Ejecutable encontrado:"
            Write-Host "     $ConfigExe"
            Write-Host ""


            # ========================================================
            # 2 - ABRIR CONFIG
            # ========================================================

            Write-Host "[2] Abriendo Configuracion del Sistema de Gestion..."


            $ExistingConfig =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if (
                $ExistingConfig
            ) {

                Write-Host "[WARN] Ya existe cwConfig.exe abierto."
                Write-Host "[INFO] Se utilizara la ventana existente."
            }
            else {

                $ConfigProcess =
                    Start-Process `
                        -FilePath $ConfigExe `
                        -PassThru


                Write-Host "[INFO] PID iniciado: $($ConfigProcess.Id)"
            }


            # ========================================================
            # 3 - VENTANA PRINCIPAL
            # ========================================================

            Write-Host "[INFO] Esperando ventana principal..."


            $MainWindow =
                $null


            $Timeout =
                (Get-Date).AddSeconds(
                    60
                )


            while (
                (Get-Date) -lt $Timeout
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )


                foreach ($Window in $Windows) {

                    try {

                        $Title =
                            Normalize-Text `
                                $Window.Current.Name


                        if (
                            $Title -like "*configuracion del sistema de gestion*" -or
                            $Title -like "*configuracion de softland*"
                        ) {

                            $MainWindow =
                                $Window

                            break
                        }
                    }
                    catch {
                    }
                }


                if (
                    $MainWindow
                ) {

                    break
                }


                Start-Sleep -Seconds 1
            }


            if (
                -not $MainWindow
            ) {

                throw "No se encontro la ventana Configuracion del Sistema de Gestion."
            }


            $MainHandle =
                [int64]$MainWindow.Current.NativeWindowHandle


            $SoftlandProcessId =
                $MainWindow.Current.ProcessId


            [NativeWindows]::ShowWindowAsync(
                [IntPtr]$MainHandle,
                9
            ) | Out-Null


            [NativeWindows]::SetForegroundWindow(
                [IntPtr]$MainHandle
            ) | Out-Null


            Write-Host "[OK] Configuracion de Softland abierta."
            Write-Host "[INFO] PID    : $SoftlandProcessId"
            Write-Host "[INFO] Handle : $MainHandle"
            Write-Host ""


            # ========================================================
            # 4 - OPERACIONES -> EMPRESAS
            # ========================================================

            Write-Host "[3] Navegando a Operaciones -> Empresas..."


            $MainMenu =
                [NativeWindows]::GetMenu(
                    [IntPtr]$MainHandle
                )


            if (
                $MainMenu -eq
                [IntPtr]::Zero
            ) {

                throw "No se pudo obtener el menu nativo de cwConfig."
            }


            $PosOperaciones =
                Find-NativeMenuPosition `
                    -MenuHandle $MainMenu `
                    -WantedText "Operaciones"


            if (
                $PosOperaciones -lt 0
            ) {

                throw "No se encontro Operaciones."
            }


            $MenuOperaciones =
                [NativeWindows]::GetSubMenu(
                    $MainMenu,
                    $PosOperaciones
                )


            if (
                $MenuOperaciones -eq
                [IntPtr]::Zero
            ) {

                throw "No se pudo obtener el submenu Operaciones."
            }


            [void][NativeWindows]::SendMessage(
                [IntPtr]$MainHandle,
                [NativeWindows]::WM_INITMENUPOPUP,
                $MenuOperaciones,
                [IntPtr]$PosOperaciones
            )


            Start-Sleep -Milliseconds 500


            $PosEmpresas =
                Find-NativeMenuPosition `
                    -MenuHandle $MenuOperaciones `
                    -WantedText "Empresas"


            if (
                $PosEmpresas -lt 0
            ) {

                throw "No se encontro Empresas dentro de Operaciones."
            }


            $EmpresaCommandId =
                [NativeWindows]::GetMenuItemID(
                    $MenuOperaciones,
                    $PosEmpresas
                )


            if (
                $EmpresaCommandId -eq
                4294967295
            ) {

                throw "Empresas no devolvio un Command ID valido."
            }


            Write-Host "[INFO] Ejecutando Operaciones -> Empresas..."


            $Posted =
                [NativeWindows]::PostMessage(
                    [IntPtr]$MainHandle,
                    [NativeWindows]::WM_COMMAND,
                    [IntPtr]$EmpresaCommandId,
                    [IntPtr]::Zero
                )


            if (
                -not $Posted
            ) {

                throw "No fue posible abrir Empresas."
            }


            Start-Sleep -Seconds 4


            Write-Host "[OK] Empresas abierto."
            Write-Host ""


            # ========================================================
            # 5 - LISTVIEW
            # ========================================================

            Write-Host "[4] Buscando grilla ListView20WndClass..."


            $ListaEmpresas =
                $null


            $TimeoutLista =
                (Get-Date).AddSeconds(
                    20
                )


            while (
                (Get-Date) -lt $TimeoutLista -and
                -not $ListaEmpresas
            ) {

                $ListaEmpresas =
                    Get-ElementByClass `
                        -Root $MainWindow `
                        -ClassName "ListView20WndClass"


                if (
                    -not $ListaEmpresas
                ) {

                    Start-Sleep -Milliseconds 300
                }
            }


            if (
                -not $ListaEmpresas
            ) {

                throw "No se encontro la grilla ListView20WndClass."
            }


            $ListHandle =
                [IntPtr]$ListaEmpresas.Current.NativeWindowHandle


            Write-Host "[OK] Grilla detectada."
            Write-Host "[INFO] Handle: $ListHandle"


            # ========================================================
            # 6 - CANTIDAD
            # ========================================================

            $CantidadEmpresas =
                [NativeListView]::GetItemCount(
                    $ListHandle
                )


            if (
                $CantidadEmpresas -le 0
            ) {

                throw "La grilla no contiene empresas."
            }


            Write-Host "[INFO] Empresas detectadas: $CantidadEmpresas"
            Write-Host ""


            # ========================================================
            # 7 - MARCAR TODAS
            # ========================================================

            Write-Host "[5] Marcando todas las empresas..."


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -ne 2
                ) {

                    $Resultado =
                        [NativeListView]::SetChecked(
                            $ListHandle,
                            $i,
                            $true
                        )


                    if (
                        -not $Resultado
                    ) {

                        throw "No fue posible marcar la fila $($i + 1)."
                    }
                }


                Start-Sleep -Milliseconds 100
            }


            # ========================================================
            # 8 - VERIFICAR TODAS
            # ========================================================

            $Marcadas =
                0


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -eq 2
                ) {

                    $Marcadas++
                }
            }


            if (
                $Marcadas -ne
                $CantidadEmpresas
            ) {

                throw "No quedaron seleccionadas todas las empresas."
            }


            Write-Host "[OK] Todas las empresas quedaron seleccionadas."
            Write-Host "[INFO] Total: $Marcadas"
            Write-Host ""


            # ========================================================
            # 9 - BUSCAR BOTON CONVERTIR
            # ========================================================

            Write-Host "[6] Buscando boton Convertir..."


            $ConvertirButton =
                Get-ElementByName `
                    -Root $MainWindow `
                    -Names @(
                        "Convertir",
                        "&Convertir"
                    )


            if (
                -not $ConvertirButton
            ) {

                throw "No se encontro el boton Convertir."
            }


            Write-Host "[OK] Convertir detectado."
            Write-Host "[INFO] Presionando Convertir..."


            Click-Element `
                -Element $ConvertirButton


            Write-Host "[OK] Convertir presionado."
            Write-Host ""


            # ========================================================
            # 10 - PROCESAR EMPRESAS
            # ========================================================

            $ConvertedCount =
                0


            $ConvertedCompanies =
                @()


            for (
                $NumeroEmpresa = 1;
                $NumeroEmpresa -le $CantidadEmpresas;
                $NumeroEmpresa++
            ) {

                Write-Host ""
                Write-Host "=========================================================="
                Write-Host " EMPRESA $NumeroEmpresa DE $CantidadEmpresas"
                Write-Host "=========================================================="
                Write-Host ""


                # ====================================================
                # CONFIRMACION INICIAL
                # ====================================================

                Write-Host "[INFO] Esperando confirmacion de conversion..."


                $Confirm =
                    Wait-Dialog `
                        -ProcessId $SoftlandProcessId `
                        -MainHandle $MainHandle `
                        -TimeoutSeconds 120 `
                        -Condition {

                            param($Dialog)

                            $Text =
                                Normalize-Text (
                                    Get-WindowText `
                                        -Window $Dialog
                                )

                            return (
                                $Text -like "*convertir*" -and
                                $Text -like "*empresa*"
                            )
                        }


                if (
                    -not $Confirm
                ) {

                    throw "No aparecio la confirmacion de conversion para la empresa $NumeroEmpresa."
                }


                $ConfirmText =
                    Get-WindowText `
                        -Window $Confirm


                $CurrentCompany =
                    Get-CompanyFromText `
                        -Text $ConfirmText


                Write-Host "[OK] Empresa solicitada por Softland: $CurrentCompany"
                Write-Host "[INFO] Mensaje: $ConfirmText"


                $ConfirmHandle =
                    [int64]$Confirm.Current.NativeWindowHandle


                $Yes =
                    Get-YesButton `
                        -Window $Confirm


                if (
                    -not $Yes
                ) {

                    throw "No se encontro el boton Si en la confirmacion inicial."
                }


                Write-Host "[INFO] Seleccionando Si..."


                Click-Element `
                    -Element $Yes


                [void](
                    Wait-DialogClose `
                        -Handle $ConfirmHandle `
                        -TimeoutSeconds 30
                )


                # ====================================================
                # CONTRASEÑA
                # ====================================================

                Write-Host "[INFO] Esperando Ingrese contraseña..."


                $PasswordDialog =
                    Wait-Dialog `
                        -ProcessId $SoftlandProcessId `
                        -MainHandle $MainHandle `
                        -TimeoutSeconds 120 `
                        -Condition {

                            param($Dialog)

                            $Text =
                                Normalize-Text (
                                    Get-WindowText `
                                        -Window $Dialog
                                )

                            return (
                                $Text -like "*contrasena*" -or
                                $Text -like "*password*"
                            )
                        }


                if (
                    -not $PasswordDialog
                ) {

                    throw "No aparecio la ventana Ingrese contraseña."
                }


                Write-Host "[OK] Ventana de contraseña detectada."


                $PasswordSet =
                    Set-Password `
                        -Window $PasswordDialog `
                        -Value $Password


                if (
                    -not $PasswordSet
                ) {

                    throw "No fue posible ingresar la contraseña."
                }


                Write-Host "[OK] Contraseña ingresada."
                Write-Host "[INFO] El valor secreto no se muestra en el log."


                $PasswordHandle =
                    [int64]$PasswordDialog.Current.NativeWindowHandle


                $Aceptar =
                    Get-OkButton `
                        -Window $PasswordDialog


                if (
                    -not $Aceptar
                ) {

                    throw "No se encontro Aceptar en la ventana de contraseña."
                }


                Click-Element `
                    -Element $Aceptar


                [void](
                    Wait-DialogClose `
                        -Handle $PasswordHandle `
                        -TimeoutSeconds 30
                )


                Write-Host "[OK] Contraseña aceptada."


                # ====================================================
                # PRIMERA CONFIRMACION POSTERIOR
                # ====================================================

                Write-Host "[INFO] Esperando primera confirmacion posterior..."


                $Post1 =
                    Wait-Dialog `
                        -ProcessId $SoftlandProcessId `
                        -MainHandle $MainHandle `
                        -TimeoutSeconds 120 `
                        -Condition {

                            param($Dialog)

                            return (
                                $null -ne
                                (Get-YesButton -Window $Dialog)
                            )
                        }


                if (
                    -not $Post1
                ) {

                    throw "No aparecio la primera confirmacion posterior."
                }


                $Post1Text =
                    Get-WindowText `
                        -Window $Post1


                Write-Host "[INFO] Confirmacion 1:"
                Write-Host "       $Post1Text"


                $Post1Handle =
                    [int64]$Post1.Current.NativeWindowHandle


                $Yes1 =
                    Get-YesButton `
                        -Window $Post1


                if (
                    -not $Yes1
                ) {

                    throw "No se encontro Si en la primera confirmacion posterior."
                }


                Click-Element `
                    -Element $Yes1


                [void](
                    Wait-DialogClose `
                        -Handle $Post1Handle `
                        -TimeoutSeconds 30
                )


                Write-Host "[OK] Primera confirmacion aceptada."


                # ====================================================
                # SEGUNDA CONFIRMACION POSTERIOR
                # ====================================================

                Write-Host "[INFO] Esperando segunda confirmacion posterior..."


                $Post2 =
                    Wait-Dialog `
                        -ProcessId $SoftlandProcessId `
                        -MainHandle $MainHandle `
                        -TimeoutSeconds 120 `
                        -Condition {

                            param($Dialog)

                            return (
                                $null -ne
                                (Get-YesButton -Window $Dialog)
                            )
                        }


                if (
                    -not $Post2
                ) {

                    throw "No aparecio la segunda confirmacion posterior."
                }


                $Post2Text =
                    Get-WindowText `
                        -Window $Post2


                Write-Host "[INFO] Confirmacion 2:"
                Write-Host "       $Post2Text"


                $Post2Handle =
                    [int64]$Post2.Current.NativeWindowHandle


                $Yes2 =
                    Get-YesButton `
                        -Window $Post2


                if (
                    -not $Yes2
                ) {

                    throw "No se encontro Si en la segunda confirmacion posterior."
                }


                Click-Element `
                    -Element $Yes2


                [void](
                    Wait-DialogClose `
                        -Handle $Post2Handle `
                        -TimeoutSeconds 30
                )


                Write-Host "[OK] Segunda confirmacion aceptada."


                # ====================================================
                # CONVERSION
                # ====================================================

                Write-Host ""
                Write-Host "[INFO] Conversion de $CurrentCompany en curso..."
                Write-Host "[INFO] Esperando finalizacion..."


                $Finish =
                    Wait-FinishDialog `
                        -ProcessId $SoftlandProcessId `
                        -MainHandle $MainHandle `
                        -TimeoutSeconds 1800


                if (
                    -not $Finish
                ) {

                    throw "La conversion de $CurrentCompany no informo finalizacion."
                }


                $FinishText =
                    Get-WindowText `
                        -Window $Finish


                Write-Host ""
                Write-Host "[OK] Conversion finalizada."
                Write-Host "[INFO] Empresa: $CurrentCompany"
                Write-Host "[INFO] Mensaje:"
                Write-Host "       $FinishText"


                $FinishHandle =
                    [int64]$Finish.Current.NativeWindowHandle


                # ====================================================
                # OK DE FINALIZACION
                # ====================================================

                $Ok =
                    Get-OkButton `
                        -Window $Finish


                if (
                    -not $Ok
                ) {

                    throw "No se encontro OK en el mensaje de finalizacion."
                }


                Write-Host "[INFO] Presionando OK para continuar con la siguiente empresa..."


                Click-Element `
                    -Element $Ok


                [void](
                    Wait-DialogClose `
                        -Handle $FinishHandle `
                        -TimeoutSeconds 30
                )


                $ConvertedCount++


                $ConvertedCompanies +=
                    $CurrentCompany


                Write-Host ""
                Write-Host "[OK] Empresa completada: $CurrentCompany"
                Write-Host "[INFO] Convertidas: $ConvertedCount / $CantidadEmpresas"
                Write-Host ""


                if (
                    $NumeroEmpresa -lt
                    $CantidadEmpresas
                ) {

                    Write-Host "[INFO] Esperando que Softland pase a la siguiente empresa..."

                    Start-Sleep -Seconds 2
                }
            }


            # ========================================================
            # 11 - VALIDACION FINAL
            # ========================================================

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " CONVERSION MULTIEMPRESA FINALIZADA"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Servidor            : $env:COMPUTERNAME"
            Write-Host "Empresas detectadas : $CantidadEmpresas"
            Write-Host "Empresas convertidas: $ConvertedCount"
            Write-Host ""


            foreach ($Company in $ConvertedCompanies) {

                Write-Host "[OK] $Company"
            }


            if (
                $ConvertedCount -ne
                $CantidadEmpresas
            ) {

                throw "No se convirtieron todas las empresas detectadas."
            }


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " OK - TODAS LAS EMPRESAS FUERON CONVERTIDAS"
            Write-Host "=========================================================="
            Write-Host ""

            exit 0
        }


        # ============================================================
        # ERROR / DEBUG
        # ============================================================

        catch {

            $MensajeError =
                $_.Exception.Message


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ERROR DURANTE LA CONVERSION"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Error:"
            Write-Host $MensajeError
            Write-Host ""


            $ProcesosConfig =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if (
                $ProcesosConfig
            ) {

                Write-Host "[DEBUG] cwConfig.exe continua abierto."


                foreach ($Proceso in $ProcesosConfig) {

                    Write-Host "[DEBUG] PID cwConfig: $($Proceso.Id)"
                }
            }
            else {

                Write-Host "[WARN] cwConfig.exe no aparece como proceso activo."
            }


            Write-Host ""
            Write-Host "[DEBUG] El job permanecera activo durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Puede revisar manualmente donde quedo la conversion."
            Write-Host ""


            if (
                $DebugPauseMinutes -gt 0
            ) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            throw $MensajeError
        }
