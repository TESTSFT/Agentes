trigger: none

parameters:
- name: debugPauseMinutes
  displayName: "Minutos para dejar Config abierto si falla"
  type: number
  default: 20

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: ConvertirEmpresasSoftland
  displayName: "Convertir empresas Softland"
  timeoutInMinutes: 360

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Convertir empresas Softland"
    env:
      SOFTLAND_PASSWORD: $(SOFTLAND_PASSWORD)
      DEBUG_PAUSE_MINUTES: ${{ parameters.debugPauseMinutes }}

    inputs:
      targetType: inline
      pwsh: false
      script: |

        $ErrorActionPreference = "Stop"

        $Password = $env:SOFTLAND_PASSWORD
        $DebugPauseMinutes = [int]$env:DEBUG_PAUSE_MINUTES

        if ([string]::IsNullOrWhiteSpace($Password)) {
            throw "No se encontro la variable secreta SOFTLAND_PASSWORD."
        }

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - CONVERSION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # WIN32
        # ============================================================

        Add-Type @"
        using System;
        using System.Text;
        using System.Runtime.InteropServices;

        public static class NativeWindows
        {
            public const uint WM_COMMAND = 0x0111;
            public const uint WM_INITMENUPOPUP = 0x0117;
            public const uint MF_BYPOSITION = 0x00000400;

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(
                int X,
                int Y
            );

            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetMenu(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern int GetMenuItemCount(
                IntPtr hMenu
            );

            [DllImport("user32.dll")]
            public static extern IntPtr GetSubMenu(
                IntPtr hMenu,
                int nPos
            );

            [DllImport("user32.dll")]
            public static extern uint GetMenuItemID(
                IntPtr hMenu,
                int nPos
            );

            [DllImport(
                "user32.dll",
                CharSet = CharSet.Auto
            )]
            public static extern int GetMenuString(
                IntPtr hMenu,
                uint uIDItem,
                StringBuilder lpString,
                int cchMax,
                uint flags
            );

            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            public static extern bool PostMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );
        }
        "@


        # ============================================================
        # LISTVIEW NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;
            const uint LVM_GETITEMCOUNT = LVM_FIRST + 4;
            const uint LVM_SETITEMSTATE = LVM_FIRST + 43;
            const uint LVM_GETITEMSTATE = LVM_FIRST + 44;

            const uint LVIS_STATEIMAGEMASK = 0xF000;

            const uint PROCESS_VM_OPERATION = 0x0008;
            const uint PROCESS_VM_READ = 0x0010;
            const uint PROCESS_VM_WRITE = 0x0020;
            const uint PROCESS_QUERY_INFORMATION = 0x0400;

            const uint MEM_COMMIT = 0x1000;
            const uint MEM_RESERVE = 0x2000;
            const uint MEM_RELEASE = 0x8000;
            const uint PAGE_READWRITE = 0x04;

            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );

            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );

            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }

            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state = SendMessage(
                    handle,
                    LVM_GETITEMSTATE,
                    new IntPtr(index),
                    new IntPtr(LVIS_STATEIMAGEMASK)
                ).ToInt32();

                return (state & 0xF000) >> 12;
            }

            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;

                GetWindowThreadProcessId(
                    handle,
                    out processId
                );

                IntPtr process = OpenProcess(
                    PROCESS_VM_OPERATION |
                    PROCESS_VM_READ |
                    PROCESS_VM_WRITE |
                    PROCESS_QUERY_INFORMATION,
                    false,
                    processId
                );

                if (process == IntPtr.Zero)
                {
                    return false;
                }

                byte[] lvItem = new byte[20];

                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;

                Buffer.BlockCopy(
                    BitConverter.GetBytes(stateValue),
                    0,
                    lvItem,
                    12,
                    4
                );

                Buffer.BlockCopy(
                    BitConverter.GetBytes(LVIS_STATEIMAGEMASK),
                    0,
                    lvItem,
                    16,
                    4
                );

                IntPtr remoteMemory = VirtualAllocEx(
                    process,
                    IntPtr.Zero,
                    (UIntPtr)lvItem.Length,
                    MEM_COMMIT | MEM_RESERVE,
                    PAGE_READWRITE
                );

                if (remoteMemory == IntPtr.Zero)
                {
                    CloseHandle(process);
                    return false;
                }

                UIntPtr written;

                bool ok = WriteProcessMemory(
                    process,
                    remoteMemory,
                    lvItem,
                    (UIntPtr)lvItem.Length,
                    out written
                );

                if (ok)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remoteMemory
                    );
                }

                VirtualFreeEx(
                    process,
                    remoteMemory,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );

                CloseHandle(process);

                return ok;
            }
        }
        "@


        # ============================================================
        # FUNCIONES
        # ============================================================

        function Normalize-Text {

            param([string]$Text)

            if ($null -eq $Text) {
                return ""
            }

            $Text = $Text.Replace("&","").Trim().ToLowerInvariant()

            if ($Text.Contains("`t")) {
                $Text = $Text.Split("`t")[0]
            }

            $Normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )

            $Builder =
                New-Object Text.StringBuilder

            foreach ($Char in $Normalized.ToCharArray()) {

                $Category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $Char
                    )

                if (
                    $Category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$Builder.Append($Char)
                }
            }

            return $Builder.ToString()
        }


        function Get-Descendants {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            return $Root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
            )
        }


        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$ClassName
            )

            $Condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )

            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }


        function Get-ElementByName {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string[]]$Names
            )

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    $Current =
                        Normalize-Text `
                            $Element.Current.Name

                    foreach ($Wanted in $Names) {

                        if (
                            $Current -eq
                            (Normalize-Text $Wanted)
                        ) {

                            return $Element
                        }
                    }
                }
                catch {
                }
            }

            return $null
        }


        function Get-ElementText {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            $Texts = @()

            try {

                if (
                    -not [string]::IsNullOrWhiteSpace(
                        $Root.Current.Name
                    )
                ) {

                    $Texts +=
                        $Root.Current.Name
                }
            }
            catch {
            }

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    $Name =
                        $Element.Current.Name

                    if (
                        -not [string]::IsNullOrWhiteSpace($Name)
                    ) {

                        $Texts +=
                            $Name
                    }
                }
                catch {
                }
            }

            return (
                $Texts -join " "
            )
        }


        function Click-Element {

            param(
                [System.Windows.Automation.AutomationElement]$Element
            )

            if ($null -eq $Element) {
                throw "Elemento inexistente."
            }

            try {

                $Invoke =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.InvokePattern]::Pattern
                    )

                $Invoke.Invoke()

                return
            }
            catch {
            }

            try {

                $Legacy =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                    )

                $Legacy.DoDefaultAction()

                return
            }
            catch {
            }

            $Rect =
                $Element.Current.BoundingRectangle

            $X =
                [int](
                    $Rect.Left +
                    ($Rect.Width / 2)
                )

            $Y =
                [int](
                    $Rect.Top +
                    ($Rect.Height / 2)
                )

            [NativeWindows]::SetCursorPos(
                $X,
                $Y
            ) | Out-Null

            Start-Sleep -Milliseconds 250

            [NativeWindows]::mouse_event(
                0x0002,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )

            [NativeWindows]::mouse_event(
                0x0004,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )
        }


        function Get-MenuText {

            param(
                [IntPtr]$MenuHandle,
                [int]$Position
            )

            $Builder =
                New-Object System.Text.StringBuilder 512

            [void][NativeWindows]::GetMenuString(
                $MenuHandle,
                [uint32]$Position,
                $Builder,
                512,
                [NativeWindows]::MF_BYPOSITION
            )

            return $Builder.ToString()
        }


        function Find-NativeMenuPosition {

            param(
                [IntPtr]$MenuHandle,
                [string]$WantedText
            )

            $Wanted =
                Normalize-Text $WantedText

            $Count =
                [NativeWindows]::GetMenuItemCount(
                    $MenuHandle
                )

            for (
                $i = 0;
                $i -lt $Count;
                $i++
            ) {

                $Current =
                    Get-MenuText `
                        -MenuHandle $MenuHandle `
                        -Position $i

                if (
                    (Normalize-Text $Current) -eq
                    $Wanted
                ) {

                    return $i
                }
            }

            return -1
        }


        # ============================================================
        # BUSCAR BOTON VISIBLE DENTRO DEL PROCESO
        #
        # Esta funcion es la correccion principal.
        #
        # Ya no dependemos de que el dialogo sea una ventana de
        # primer nivel.
        # ============================================================

        function Find-ProcessButton {

            param(
                [int]$ProcessId,
                [string[]]$Names
            )

            $Desktop =
                [System.Windows.Automation.AutomationElement]::RootElement

            $Elements =
                $Desktop.FindAll(
                    [System.Windows.Automation.TreeScope]::Descendants,
                    [System.Windows.Automation.Condition]::TrueCondition
                )

            foreach ($Element in $Elements) {

                try {

                    if (
                        $Element.Current.ProcessId -ne $ProcessId
                    ) {
                        continue
                    }

                    if (
                        $Element.Current.IsOffscreen
                    ) {
                        continue
                    }

                    if (
                        $Element.Current.ControlType -ne
                        [System.Windows.Automation.ControlType]::Button
                    ) {
                        continue
                    }

                    $ActualName =
                        Normalize-Text `
                            $Element.Current.Name

                    foreach ($Wanted in $Names) {

                        if (
                            $ActualName -eq
                            (Normalize-Text $Wanted)
                        ) {

                            return $Element
                        }
                    }
                }
                catch {
                }
            }

            return $null
        }


        # ============================================================
        # OBTENER CONTENEDOR DEL BOTON
        # ============================================================

        function Get-DialogContainer {

            param(
                [System.Windows.Automation.AutomationElement]$Element,
                [string[]]$RequiredTexts = @()
            )

            $Walker =
                [System.Windows.Automation.TreeWalker]::ControlViewWalker

            $Current =
                $Element

            for (
                $Level = 0;
                $Level -lt 12;
                $Level++
            ) {

                if (
                    $null -eq $Current
                ) {

                    break
                }

                try {

                    $Text =
                        Normalize-Text (
                            Get-ElementText `
                                -Root $Current
                        )

                    $Matches =
                        $true

                    foreach ($Required in $RequiredTexts) {

                        if (
                            $Text -notlike
                            "*$(Normalize-Text $Required)*"
                        ) {

                            $Matches =
                                $false

                            break
                        }
                    }

                    if ($Matches) {

                        return $Current
                    }
                }
                catch {
                }

                try {

                    $Current =
                        $Walker.GetParent(
                            $Current
                        )
                }
                catch {

                    break
                }
            }

            return $null
        }


        # ============================================================
        # ESPERAR BOTON EN UN DIALOGO
        # ============================================================

        function Wait-ProcessButtonDialog {

            param(
                [int]$ProcessId,
                [string[]]$ButtonNames,
                [string[]]$RequiredTexts = @(),
                [int]$TimeoutSeconds = 60
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            while (
                (Get-Date) -lt $End
            ) {

                $Button =
                    Find-ProcessButton `
                        -ProcessId $ProcessId `
                        -Names $ButtonNames

                if ($Button) {

                    if (
                        $RequiredTexts.Count -eq 0
                    ) {

                        $Container =
                            Get-DialogContainer `
                                -Element $Button

                        return [PSCustomObject]@{
                            Button    = $Button
                            Container = $Container
                        }
                    }

                    $Container =
                        Get-DialogContainer `
                            -Element $Button `
                            -RequiredTexts $RequiredTexts

                    if ($Container) {

                        return [PSCustomObject]@{
                            Button    = $Button
                            Container = $Container
                        }
                    }
                }

                Start-Sleep -Milliseconds 400
            }

            return $null
        }


        # ============================================================
        # ESPERAR CAMPO PASSWORD
        # ============================================================

        function Wait-PasswordControl {

            param(
                [int]$ProcessId,
                [int]$TimeoutSeconds = 120
            )

            $End =
                (Get-Date).AddSeconds(
                    $TimeoutSeconds
                )

            $Walker =
                [System.Windows.Automation.TreeWalker]::ControlViewWalker

            while (
                (Get-Date) -lt $End
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement

                $Elements =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Descendants,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )

                foreach ($Element in $Elements) {

                    try {

                        if (
                            $Element.Current.ProcessId -ne
                            $ProcessId
                        ) {
                            continue
                        }

                        if (
                            $Element.Current.IsOffscreen
                        ) {
                            continue
                        }

                        if (
                            $Element.Current.ControlType -ne
                            [System.Windows.Automation.ControlType]::Edit
                        ) {
                            continue
                        }

                        $Current =
                            $Element

                        for (
                            $Level = 0;
                            $Level -lt 10;
                            $Level++
                        ) {

                            if (
                                $null -eq $Current
                            ) {
                                break
                            }

                            $Text =
                                Normalize-Text (
                                    Get-ElementText `
                                        -Root $Current
                                )

                            if (
                                $Text -like "*contrasena*" -or
                                $Text -like "*password*"
                            ) {

                                return [PSCustomObject]@{
                                    Edit      = $Element
                                    Container = $Current
                                }
                            }

                            $Current =
                                $Walker.GetParent(
                                    $Current
                                )
                        }
                    }
                    catch {
                    }
                }

                Start-Sleep -Milliseconds 400
            }

            return $null
        }


        function Set-EditValue {

            param(
                [System.Windows.Automation.AutomationElement]$Element,
                [string]$Value
            )

            try {

                $ValuePattern =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.ValuePattern]::Pattern
                    )

                $ValuePattern.SetValue(
                    $Value
                )

                return $true
            }
            catch {
            }

            try {

                $Legacy =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                    )

                $Legacy.SetValue(
                    $Value
                )

                return $true
            }
            catch {
            }

            return $false
        }


        # ============================================================
        # PROCESO PRINCIPAL
        # ============================================================

        try {


            # ========================================================
            # 1 - CWCONFIG
            # ========================================================

            Write-Host "[1] Buscando cwConfig.exe..."

            $PossiblePaths = @(
                "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",
                "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
            )

            $ConfigExe = $null

            foreach ($Path in $PossiblePaths) {

                Write-Host "[INFO] Probando: $Path"

                if (Test-Path $Path) {

                    $ConfigExe = $Path
                    break
                }
            }

            if (-not $ConfigExe) {

                $SearchRoots = @(
                    "C:\Program Files (x86)\Softland",
                    "C:\Program Files\Softland"
                )

                foreach ($RootPath in $SearchRoots) {

                    if (Test-Path $RootPath) {

                        $Found =
                            Get-ChildItem `
                                -Path $RootPath `
                                -Filter "cwConfig.exe" `
                                -File `
                                -Recurse `
                                -ErrorAction SilentlyContinue |
                            Select-Object -First 1

                        if ($Found) {

                            $ConfigExe =
                                $Found.FullName

                            break
                        }
                    }
                }
            }

            if (-not $ConfigExe) {
                throw "No se encontro cwConfig.exe."
            }

            Write-Host "[OK] Ejecutable: $ConfigExe"


            # ========================================================
            # 2 - ABRIR
            # ========================================================

            $Existing =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue

            if (-not $Existing) {

                Start-Process `
                    -FilePath $ConfigExe |
                    Out-Null

                Write-Host "[OK] cwConfig iniciado."
            }
            else {

                Write-Host "[INFO] cwConfig ya estaba abierto."
            }


            # ========================================================
            # VENTANA PRINCIPAL
            # ========================================================

            $MainWindow = $null

            $Timeout =
                (Get-Date).AddSeconds(60)

            while (
                (Get-Date) -lt $Timeout
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement

                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )

                foreach ($Window in $Windows) {

                    try {

                        $Title =
                            Normalize-Text `
                                $Window.Current.Name

                        if (
                            $Title -like "*configuracion del sistema de gestion*" -or
                            $Title -like "*configuracion de softland*"
                        ) {

                            $MainWindow =
                                $Window

                            break
                        }
                    }
                    catch {
                    }
                }

                if ($MainWindow) {
                    break
                }

                Start-Sleep -Seconds 1
            }

            if (-not $MainWindow) {
                throw "No se encontro la ventana principal."
            }


            $MainHandle =
                [int64]$MainWindow.Current.NativeWindowHandle

            $SoftlandProcessId =
                $MainWindow.Current.ProcessId


            [NativeWindows]::ShowWindowAsync(
                [IntPtr]$MainHandle,
                9
            ) | Out-Null

            [NativeWindows]::SetForegroundWindow(
                [IntPtr]$MainHandle
            ) | Out-Null


            Write-Host "[OK] Configuracion abierta."
            Write-Host "[INFO] PID: $SoftlandProcessId"


            # ========================================================
            # 3 - OPERACIONES -> EMPRESAS
            # ========================================================

            Write-Host "[3] Abriendo Operaciones -> Empresas..."


            $MainMenu =
                [NativeWindows]::GetMenu(
                    [IntPtr]$MainHandle
                )

            if (
                $MainMenu -eq
                [IntPtr]::Zero
            ) {

                throw "No se obtuvo el menu principal."
            }


            $PosOperaciones =
                Find-NativeMenuPosition `
                    -MenuHandle $MainMenu `
                    -WantedText "Operaciones"


            if (
                $PosOperaciones -lt 0
            ) {

                throw "No se encontro Operaciones."
            }


            $MenuOperaciones =
                [NativeWindows]::GetSubMenu(
                    $MainMenu,
                    $PosOperaciones
                )


            [void][NativeWindows]::SendMessage(
                [IntPtr]$MainHandle,
                [NativeWindows]::WM_INITMENUPOPUP,
                $MenuOperaciones,
                [IntPtr]$PosOperaciones
            )


            $PosEmpresas =
                Find-NativeMenuPosition `
                    -MenuHandle $MenuOperaciones `
                    -WantedText "Empresas"


            if (
                $PosEmpresas -lt 0
            ) {

                throw "No se encontro Empresas."
            }


            $CommandEmpresas =
                [NativeWindows]::GetMenuItemID(
                    $MenuOperaciones,
                    $PosEmpresas
                )


            [void][NativeWindows]::PostMessage(
                [IntPtr]$MainHandle,
                [NativeWindows]::WM_COMMAND,
                [IntPtr]$CommandEmpresas,
                [IntPtr]::Zero
            )


            Start-Sleep -Seconds 4


            Write-Host "[OK] Empresas abierto."


            # ========================================================
            # 4 - LISTVIEW
            # ========================================================

            $ListaEmpresas =
                Get-ElementByClass `
                    -Root $MainWindow `
                    -ClassName "ListView20WndClass"


            if (-not $ListaEmpresas) {
                throw "No se encontro ListView20WndClass."
            }


            $ListHandle =
                [IntPtr]$ListaEmpresas.Current.NativeWindowHandle


            $CantidadEmpresas =
                [NativeListView]::GetItemCount(
                    $ListHandle
                )


            if (
                $CantidadEmpresas -le 0
            ) {

                throw "No se detectaron empresas."
            }


            Write-Host "[INFO] Empresas detectadas: $CantidadEmpresas"


            # ========================================================
            # 5 - MARCAR TODAS
            # ========================================================

            Write-Host "[5] Marcando empresas..."


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if (
                    $Estado -ne 2
                ) {

                    $Resultado =
                        [NativeListView]::SetChecked(
                            $ListHandle,
                            $i,
                            $true
                        )


                    if (-not $Resultado) {

                        throw "No se pudo marcar fila $($i + 1)."
                    }
                }
            }


            Write-Host "[OK] Empresas seleccionadas: $CantidadEmpresas"


            # ========================================================
            # 6 - CONVERTIR
            # ========================================================

            $Convertir =
                Get-ElementByName `
                    -Root $MainWindow `
                    -Names @(
                        "Convertir",
                        "&Convertir"
                    )


            if (-not $Convertir) {
                throw "No se encontro Convertir."
            }


            Write-Host "[6] Presionando Convertir..."


            Click-Element `
                -Element $Convertir


            Start-Sleep -Seconds 1


            # ========================================================
            # 7 - CONFIRMACION GENERAL
            #
            # FOTO REAL:
            #
            # ¿Esta seguro que desea convertir las empresas
            # APDESC, HELICO, IDCRBT000?
            # ========================================================

            Write-Host "[7] Esperando confirmacion general..."


            $ConfirmacionGeneral =
                Wait-ProcessButtonDialog `
                    -ProcessId $SoftlandProcessId `
                    -ButtonNames @(
                        "Si",
                        "Sí"
                    ) `
                    -RequiredTexts @(
                        "convertir",
                        "empresa"
                    ) `
                    -TimeoutSeconds 120


            if (
                -not $ConfirmacionGeneral
            ) {

                throw "No se detecto la confirmacion general de conversion."
            }


            $TextoConfirmacion =
                Get-ElementText `
                    -Root $ConfirmacionGeneral.Container


            Write-Host "[OK] Confirmacion detectada:"
            Write-Host "     $TextoConfirmacion"

            Write-Host "[INFO] Presionando Si..."


            Click-Element `
                -Element $ConfirmacionGeneral.Button


            Start-Sleep -Seconds 1


            # ========================================================
            # PROCESAR CADA EMPRESA
            # ========================================================

            $Convertidas = 0


            for (
                $Numero = 1;
                $Numero -le $CantidadEmpresas;
                $Numero++
            ) {

                Write-Host ""
                Write-Host "=========================================================="
                Write-Host " EMPRESA $Numero DE $CantidadEmpresas"
                Write-Host "=========================================================="
                Write-Host ""


                # ====================================================
                # PASSWORD
                # ====================================================

                Write-Host "[INFO] Esperando Ingrese contraseña..."


                $PasswordInfo =
                    Wait-PasswordControl `
                        -ProcessId $SoftlandProcessId `
                        -TimeoutSeconds 120


                if (-not $PasswordInfo) {

                    throw "No aparecio Ingrese contraseña para empresa $Numero."
                }


                Write-Host "[OK] Campo contraseña detectado."


                if (
                    -not (
                        Set-EditValue `
                            -Element $PasswordInfo.Edit `
                            -Value $Password
                    )
                ) {

                    throw "No se pudo completar la contraseña."
                }


                Write-Host "[OK] Contraseña ingresada."
                Write-Host "[INFO] El secreto no se muestra en el log."


                $Aceptar =
                    Get-ElementByName `
                        -Root $PasswordInfo.Container `
                        -Names @(
                            "Aceptar",
                            "&Aceptar",
                            "OK"
                        )


                if (-not $Aceptar) {

                    throw "No se encontro Aceptar en Ingrese contraseña."
                }


                Click-Element `
                    -Element $Aceptar


                Start-Sleep -Seconds 1


                # ====================================================
                # PRIMER SI
                # ====================================================

                Write-Host "[INFO] Esperando confirmacion posterior 1..."


                $Confirm1 =
                    Wait-ProcessButtonDialog `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "Si",
                            "Sí"
                        ) `
                        -TimeoutSeconds 120


                if (-not $Confirm1) {

                    throw "No aparecio la primera confirmacion posterior."
                }


                $Texto1 =
                    Get-ElementText `
                        -Root $Confirm1.Container


                Write-Host "[INFO] Confirmacion 1:"
                Write-Host "       $Texto1"


                Click-Element `
                    -Element $Confirm1.Button


                Start-Sleep -Seconds 1


                # ====================================================
                # SEGUNDO SI
                # ====================================================

                Write-Host "[INFO] Esperando confirmacion posterior 2..."


                $Confirm2 =
                    Wait-ProcessButtonDialog `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "Si",
                            "Sí"
                        ) `
                        -TimeoutSeconds 120


                if (-not $Confirm2) {

                    throw "No aparecio la segunda confirmacion posterior."
                }


                $Texto2 =
                    Get-ElementText `
                        -Root $Confirm2.Container


                Write-Host "[INFO] Confirmacion 2:"
                Write-Host "       $Texto2"


                Click-Element `
                    -Element $Confirm2.Button


                Start-Sleep -Seconds 2


                # ====================================================
                # FINALIZACION
                # ====================================================

                Write-Host "[INFO] Conversion en curso..."
                Write-Host "[INFO] Esperando cartel de finalizacion..."


                $Finalizado =
                    Wait-ProcessButtonDialog `
                        -ProcessId $SoftlandProcessId `
                        -ButtonNames @(
                            "OK",
                            "Aceptar"
                        ) `
                        -RequiredTexts @(
                            "finaliz"
                        ) `
                        -TimeoutSeconds 1800


                if (-not $Finalizado) {

                    throw "No se detecto el cartel de finalizacion."
                }


                $TextoFinal =
                    Get-ElementText `
                        -Root $Finalizado.Container


                Write-Host ""
                Write-Host "[OK] Conversion finalizada."
                Write-Host "[INFO] Mensaje:"
                Write-Host "       $TextoFinal"


                Click-Element `
                    -Element $Finalizado.Button


                $Convertidas++


                Write-Host "[OK] Convertidas: $Convertidas / $CantidadEmpresas"


                # ====================================================
                # SI QUEDAN EMPRESAS:
                #
                # Softland pregunta si desea convertir la siguiente.
                # ====================================================

                if (
                    $Numero -lt
                    $CantidadEmpresas
                ) {

                    Start-Sleep -Seconds 1

                    Write-Host ""
                    Write-Host "[INFO] Esperando confirmacion de la siguiente empresa..."


                    $Siguiente =
                        Wait-ProcessButtonDialog `
                            -ProcessId $SoftlandProcessId `
                            -ButtonNames @(
                                "Si",
                                "Sí"
                            ) `
                            -RequiredTexts @(
                                "convertir",
                                "empresa"
                            ) `
                            -TimeoutSeconds 120


                    if (-not $Siguiente) {

                        throw "No aparecio la confirmacion para continuar con la siguiente empresa."
                    }


                    $TextoSiguiente =
                        Get-ElementText `
                            -Root $Siguiente.Container


                    Write-Host "[INFO] Softland solicita continuar:"
                    Write-Host "       $TextoSiguiente"


                    Click-Element `
                        -Element $Siguiente.Button


                    Start-Sleep -Seconds 1
                }
            }


            # ========================================================
            # FINAL
            # ========================================================

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " CONVERSION FINALIZADA"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Servidor            : $env:COMPUTERNAME"
            Write-Host "Empresas detectadas : $CantidadEmpresas"
            Write-Host "Empresas convertidas: $Convertidas"
            Write-Host ""


            if (
                $Convertidas -ne
                $CantidadEmpresas
            ) {

                throw "No se convirtieron todas las empresas."
            }


            Write-Host "=========================================================="
            Write-Host " OK - TODAS LAS EMPRESAS FUERON CONVERTIDAS"
            Write-Host "=========================================================="
            Write-Host ""

            exit 0
        }


        # ============================================================
        # ERROR
        # ============================================================

        catch {

            $MensajeError =
                $_.Exception.Message


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ERROR DURANTE LA CONVERSION"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host $MensajeError
            Write-Host ""


            $Procesos =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if ($Procesos) {

                Write-Host "[DEBUG] cwConfig.exe continua abierto."

                foreach ($Proceso in $Procesos) {

                    Write-Host "[DEBUG] PID cwConfig: $($Proceso.Id)"
                }
            }


            Write-Host ""
            Write-Host "[DEBUG] El job quedara activo durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Revise visualmente donde quedo Softland."
            Write-Host ""


            if (
                $DebugPauseMinutes -gt 0
            ) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            throw $MensajeError
        }
