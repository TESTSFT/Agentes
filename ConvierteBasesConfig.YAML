trigger: none

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: ConvertirEmpresasSoftland
  displayName: "Convertir empresas Softland"
  timeoutInMinutes: 180

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Detectar y convertir empresas"
    env:
      SOFTLAND_PASSWORD: $(SOFTLAND_PASSWORD)

    inputs:
      targetType: inline
      pwsh: false
      script: |

        $ErrorActionPreference = "Stop"

        # ============================================================
        # CONFIGURACION
        # ============================================================

        $Password = $env:SOFTLAND_PASSWORD

        if ([string]::IsNullOrWhiteSpace($Password)) {
            throw "No se encontro la variable secreta SOFTLAND_PASSWORD."
        }

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - CONVERSION AUTOMATICA SOFTLAND"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # CARGAR UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public class Win32
        {
            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(IntPtr hWnd);

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(int X, int Y);

            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );
        }
        "@


        # ============================================================
        # FUNCIONES
        # ============================================================

        function Normalize-Text {

            param([string]$Text)

            if ($null -eq $Text) {
                return ""
            }

            $Text = $Text.Replace("&","").Trim().ToLowerInvariant()

            $normalized = $Text.Normalize(
                [Text.NormalizationForm]::FormD
            )

            $builder = New-Object Text.StringBuilder

            foreach ($char in $normalized.ToCharArray()) {

                $category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory($char)

                if (
                    $category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {
                    [void]$builder.Append($char)
                }
            }

            return $builder.ToString()
        }


        function Get-Descendants {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            return $Root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
            )
        }


        function Get-Element {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string[]]$Names
            )

            foreach ($element in (Get-Descendants -Root $Root)) {

                try {

                    $actualName = Normalize-Text $element.Current.Name

                    foreach ($wanted in $Names) {

                        if (
                            $actualName -eq
                            (Normalize-Text $wanted)
                        ) {
                            return $element
                        }
                    }
                }
                catch {
                }
            }

            return $null
        }


        function Click-Element {

            param(
                [System.Windows.Automation.AutomationElement]$Element
            )

            if ($null -eq $Element) {
                throw "Se intento hacer clic sobre un elemento inexistente."
            }

            # InvokePattern
            try {

                $invoke = $Element.GetCurrentPattern(
                    [System.Windows.Automation.InvokePattern]::Pattern
                )

                $invoke.Invoke()
                return
            }
            catch {
            }

            # LegacyIAccessible
            try {

                $legacy = $Element.GetCurrentPattern(
                    [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                )

                $legacy.DoDefaultAction()
                return
            }
            catch {
            }

            # Clic fisico
            try {

                $rect = $Element.Current.BoundingRectangle

                $x = [int]($rect.Left + ($rect.Width / 2))
                $y = [int]($rect.Top + ($rect.Height / 2))

                [Win32]::SetCursorPos($x,$y) | Out-Null

                Start-Sleep -Milliseconds 250

                [Win32]::mouse_event(
                    0x0002,
                    0,
                    0,
                    0,
                    [UIntPtr]::Zero
                )

                [Win32]::mouse_event(
                    0x0004,
                    0,
                    0,
                    0,
                    [UIntPtr]::Zero
                )

                return
            }
            catch {

                throw "No fue posible hacer clic sobre el elemento."
            }
        }


        function Get-WindowText {

            param(
                [System.Windows.Automation.AutomationElement]$Window
            )

            $texts = @()

            try {
                $texts += $Window.Current.Name
            }
            catch {
            }

            foreach ($element in (Get-Descendants -Root $Window)) {

                try {

                    $name = $element.Current.Name

                    if (-not [string]::IsNullOrWhiteSpace($name)) {
                        $texts += $name
                    }
                }
                catch {
                }
            }

            return ($texts -join " ")
        }


        function Get-Dialogs {

            param(
                [int]$ProcessId,
                [int64]$MainHandle
            )

            $root =
                [System.Windows.Automation.AutomationElement]::RootElement

            $windows = $root.FindAll(
                [System.Windows.Automation.TreeScope]::Children,
                [System.Windows.Automation.Condition]::TrueCondition
            )

            $result = @()

            foreach ($window in $windows) {

                try {

                    if (
                        $window.Current.ProcessId -eq $ProcessId -and
                        $window.Current.NativeWindowHandle -ne $MainHandle -and
                        -not $window.Current.IsOffscreen
                    ) {
                        $result += $window
                    }
                }
                catch {
                }
            }

            return @($result)
        }


        function Wait-Dialog {

            param(
                [int]$ProcessId,
                [int64]$MainHandle,
                [scriptblock]$Condition,
                [int]$TimeoutSeconds = 60
            )

            $end = (Get-Date).AddSeconds($TimeoutSeconds)

            while ((Get-Date) -lt $end) {

                $dialogs = @(
                    Get-Dialogs `
                        -ProcessId $ProcessId `
                        -MainHandle $MainHandle
                )

                foreach ($dialog in $dialogs) {

                    try {

                        if (& $Condition $dialog) {
                            return $dialog
                        }
                    }
                    catch {
                    }
                }

                Start-Sleep -Milliseconds 500
            }

            return $null
        }


        function Wait-DialogClose {

            param(
                [int64]$Handle,
                [int]$TimeoutSeconds = 30
            )

            $end = (Get-Date).AddSeconds($TimeoutSeconds)

            while ((Get-Date) -lt $end) {

                $root =
                    [System.Windows.Automation.AutomationElement]::RootElement

                $windows = $root.FindAll(
                    [System.Windows.Automation.TreeScope]::Children,
                    [System.Windows.Automation.Condition]::TrueCondition
                )

                $found = $false

                foreach ($window in $windows) {

                    try {

                        if (
                            [int64]$window.Current.NativeWindowHandle -eq $Handle
                        ) {
                            $found = $true
                            break
                        }
                    }
                    catch {
                    }
                }

                if (-not $found) {
                    return $true
                }

                Start-Sleep -Milliseconds 300
            }

            return $false
        }


        function Get-YesButton {

            param(
                [System.Windows.Automation.AutomationElement]$Window
            )

            return Get-Element `
                -Root $Window `
                -Names @(
                    "Si",
                    "Sí",
                    "&Si",
                    "&Sí"
                )
        }


        function Get-OkButton {

            param(
                [System.Windows.Automation.AutomationElement]$Window
            )

            return Get-Element `
                -Root $Window `
                -Names @(
                    "OK",
                    "Aceptar",
                    "&Aceptar"
                )
        }


        function Set-Password {

            param(
                [System.Windows.Automation.AutomationElement]$Window,
                [string]$Value
            )

            foreach ($element in (Get-Descendants -Root $Window)) {

                try {

                    if (
                        $element.Current.ControlType -eq
                        [System.Windows.Automation.ControlType]::Edit
                    ) {

                        # ValuePattern
                        try {

                            $valuePattern =
                                $element.GetCurrentPattern(
                                    [System.Windows.Automation.ValuePattern]::Pattern
                                )

                            $valuePattern.SetValue($Value)

                            return $true
                        }
                        catch {
                        }

                        # Legacy
                        try {

                            $legacy =
                                $element.GetCurrentPattern(
                                    [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                                )

                            $legacy.SetValue($Value)

                            return $true
                        }
                        catch {
                        }
                    }
                }
                catch {
                }
            }

            return $false
        }


        function Get-CompanyFromText {

            param([string]$Text)

            $clean =
                $Text `
                -replace "`r"," " `
                -replace "`n"," "

            $patterns = @(
                '(?i)convertir\s+la\s+empresa\s+([A-Za-z0-9_\.-]+)',
                '(?i)convertir\s+empresa\s+([A-Za-z0-9_\.-]+)'
            )

            foreach ($pattern in $patterns) {

                $match = [regex]::Match(
                    $clean,
                    $pattern
                )

                if ($match.Success) {

                    return $match.Groups[1].Value
                }
            }

            return "DESCONOCIDA"
        }


        # ============================================================
        # 1 - BUSCAR CWCONFIG.EXE
        # ============================================================

        Write-Host "[1] Buscando cwConfig.exe..."

        $PossiblePaths = @(
            "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",
            "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
        )

        $ConfigExe = $null


        foreach ($Path in $PossiblePaths) {

            Write-Host "[INFO] Probando: $Path"

            if (Test-Path $Path) {

                $ConfigExe = $Path
                break
            }
        }


        # ============================================================
        # BUSQUEDA DINAMICA
        #
        # Si en otro servidor esta instalado en otra subcarpeta,
        # busca cwConfig.exe dentro de Softland.
        # ============================================================

        if (-not $ConfigExe) {

            Write-Host "[INFO] No se encontro en las rutas estandar."
            Write-Host "[INFO] Iniciando busqueda dentro de Softland..."


            $SearchRoots = @(
                "C:\Program Files (x86)\Softland",
                "C:\Program Files\Softland"
            )


            foreach ($Root in $SearchRoots) {

                if (Test-Path $Root) {

                    Write-Host "[INFO] Buscando dentro de: $Root"


                    $Found = Get-ChildItem `
                        -Path $Root `
                        -Filter "cwConfig.exe" `
                        -File `
                        -Recurse `
                        -ErrorAction SilentlyContinue |
                        Select-Object -First 1


                    if ($Found) {

                        $ConfigExe = $Found.FullName
                        break
                    }
                }
            }
        }


        if (-not $ConfigExe) {

            throw "No se encontro cwConfig.exe en el servidor $env:COMPUTERNAME."
        }


        Write-Host ""
        Write-Host "[OK] Ejecutable encontrado:"
        Write-Host "     $ConfigExe"
        Write-Host ""


        # ============================================================
        # 2 - ABRIR CONFIGURACION
        # ============================================================

        Write-Host "[2] Abriendo Configuracion del Sistema de Gestion..."


        Start-Process `
            -FilePath $ConfigExe |
            Out-Null


        # ============================================================
        # 3 - ESPERAR VENTANA PRINCIPAL
        # ============================================================

        Write-Host "[INFO] Esperando ventana principal..."


        $MainWindow = $null

        $timeout =
            (Get-Date).AddSeconds(60)


        while ((Get-Date) -lt $timeout) {

            $root =
                [System.Windows.Automation.AutomationElement]::RootElement


            $windows = $root.FindAll(
                [System.Windows.Automation.TreeScope]::Children,
                [System.Windows.Automation.Condition]::TrueCondition
            )


            foreach ($window in $windows) {

                try {

                    $title =
                        Normalize-Text $window.Current.Name


                    if (
                        $title -like "*configuracion del sistema de gestion*" -or
                        $title -like "*configuracion de softland*"
                    ) {

                        $MainWindow = $window
                        break
                    }
                }
                catch {
                }
            }


            if ($MainWindow) {
                break
            }


            Start-Sleep -Seconds 1
        }


        if (-not $MainWindow) {

            throw "No se encontro la ventana Configuracion del Sistema de Gestion."
        }


        $MainHandle =
            [int64]$MainWindow.Current.NativeWindowHandle


        $SoftlandProcessId =
            $MainWindow.Current.ProcessId


        [Win32]::ShowWindowAsync(
            [IntPtr]$MainHandle,
            9
        ) | Out-Null


        [Win32]::SetForegroundWindow(
            [IntPtr]$MainHandle
        ) | Out-Null


        Write-Host "[OK] Configuracion de Softland abierta."
        Write-Host "[INFO] PID: $SoftlandProcessId"
        Write-Host ""


        # ============================================================
        # 4 - ABRIR EMPRESAS
        # ============================================================

        Write-Host "[3] Abriendo Empresas..."


        $EmpresasButton =
            Get-Element `
                -Root $MainWindow `
                -Names @("Empresas")


        if (-not $EmpresasButton) {

            Write-Host "[INFO] Empresas no se detecto directamente."
            Write-Host "[INFO] Intentando mediante Operaciones..."


            $Operaciones =
                Get-Element `
                    -Root $MainWindow `
                    -Names @("Operaciones")


            if ($Operaciones) {

                Click-Element -Element $Operaciones

                Start-Sleep -Seconds 1


                $root =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $EmpresasButton =
                    Get-Element `
                        -Root $root `
                        -Names @("Empresas")
            }
        }


        if (-not $EmpresasButton) {

            throw "No se encontro la opcion Empresas."
        }


        Click-Element -Element $EmpresasButton

        Start-Sleep -Seconds 2


        Write-Host "[OK] Seccion Empresas abierta."
        Write-Host ""


        # ============================================================
        # 5 - DETECTAR GRILLA
        # ============================================================

        Write-Host "[4] Detectando grilla de empresas..."


        $CodigoHeader =
            Get-Element `
                -Root $MainWindow `
                -Names @(
                    "Codigo",
                    "Código"
                )


        $ConvertirButton =
            Get-Element `
                -Root $MainWindow `
                -Names @(
                    "Convertir",
                    "&Convertir"
                )


        if (-not $ConvertirButton) {

            throw "No se encontro el boton Convertir."
        }


        if (-not $CodigoHeader) {

            throw "No se encontro la columna Codigo de la grilla de empresas."
        }


        $CodigoRect =
            $CodigoHeader.Current.BoundingRectangle


        $ConvertirRect =
            $ConvertirButton.Current.BoundingRectangle


        Write-Host "[OK] Grilla detectada."
        Write-Host ""


        # ============================================================
        # 6 - DETECTAR CHECKBOX DE EMPRESAS
        #
        # Se filtra la zona para no modificar:
        #
        # Modo Avanzado
        # Actualizar los objetos de la capa regional
        # ============================================================

        Write-Host "[5] Detectando empresas disponibles..."


        $GridCheckboxes = @()


        foreach ($element in (Get-Descendants -Root $MainWindow)) {

            try {

                if (
                    $element.Current.ControlType -eq
                    [System.Windows.Automation.ControlType]::CheckBox
                ) {

                    $rect =
                        $element.Current.BoundingRectangle


                    if (
                        $rect.Width -gt 0 -and
                        $rect.Height -gt 0 -and
                        $rect.Top -ge ($CodigoRect.Top - 10) -and
                        $rect.Bottom -lt $ConvertirRect.Top -and
                        $rect.Left -lt ($CodigoRect.Left + 20)
                    ) {

                        $GridCheckboxes += $element
                    }
                }
            }
            catch {
            }
        }


        if ($GridCheckboxes.Count -eq 0) {

            throw "No se detectaron checkbox dentro de la grilla de empresas."
        }


        Write-Host "[INFO] Checkbox detectados en la grilla: $($GridCheckboxes.Count)"
        Write-Host ""


        # ============================================================
        # 7 - SELECCIONAR EMPRESAS
        # ============================================================

        Write-Host "[6] Seleccionando empresas..."


        $SelectedCount = 0


        foreach ($CheckBox in $GridCheckboxes) {

            try {

                $toggle =
                    $CheckBox.GetCurrentPattern(
                        [System.Windows.Automation.TogglePattern]::Pattern
                    )


                if (
                    $toggle.Current.ToggleState -ne
                    [System.Windows.Automation.ToggleState]::On
                ) {

                    $toggle.Toggle()

                    Start-Sleep -Milliseconds 150
                }


                if (
                    $toggle.Current.ToggleState -eq
                    [System.Windows.Automation.ToggleState]::On
                ) {

                    $SelectedCount++
                }
            }
            catch {

                try {

                    Click-Element -Element $CheckBox

                    $SelectedCount++
                }
                catch {
                }
            }
        }


        if ($SelectedCount -eq 0) {

            throw "No fue posible seleccionar ninguna empresa."
        }


        Write-Host "[OK] Empresas seleccionadas: $SelectedCount"
        Write-Host ""


        # ============================================================
        # 8 - CONVERTIR
        # ============================================================

        Write-Host "[7] Presionando Convertir..."


        Click-Element -Element $ConvertirButton


        Write-Host "[OK] Convertir presionado."
        Write-Host ""


        # ============================================================
        # 9 - PROCESAR EMPRESAS
        # ============================================================

        $ConvertedCount = 0

        $ConvertedCompanies = @()


        while ($true) {

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ESPERANDO SIGUIENTE EMPRESA"
            Write-Host "=========================================================="
            Write-Host ""


            # ========================================================
            # CONFIRMACION DE EMPRESA
            # ========================================================

            $Confirm = Wait-Dialog `
                -ProcessId $SoftlandProcessId `
                -MainHandle $MainHandle `
                -TimeoutSeconds 15 `
                -Condition {

                    param($dialog)


                    $text =
                        Normalize-Text (
                            Get-WindowText -Window $dialog
                        )


                    return (
                        $text -like "*convertir*" -and
                        $text -like "*empresa*"
                    )
                }


            # ========================================================
            # SI NO APARECE OTRA EMPRESA, TERMINA LA COLA
            # ========================================================

            if (-not $Confirm) {

                Write-Host "[INFO] No aparecieron nuevas empresas para convertir."
                Write-Host "[INFO] Fin de la cola."

                break
            }


            $ConfirmText =
                Get-WindowText -Window $Confirm


            $CurrentCompany =
                Get-CompanyFromText `
                    -Text $ConfirmText


            Write-Host "[INFO] Softland solicita convertir empresa:"
            Write-Host "       $CurrentCompany"


            $ConfirmHandle =
                [int64]$Confirm.Current.NativeWindowHandle


            $Yes =
                Get-YesButton `
                    -Window $Confirm


            if (-not $Yes) {

                throw "No se encontro el boton Si en la confirmacion de conversion."
            }


            Write-Host "[INFO] Seleccionando Si..."


            Click-Element -Element $Yes


            Wait-DialogClose `
                -Handle $ConfirmHandle `
                -TimeoutSeconds 30 |
                Out-Null


            # ========================================================
            # 10 - CONTRASEÑA
            # ========================================================

            Write-Host "[INFO] Esperando ventana de contraseña..."


            $PasswordDialog = Wait-Dialog `
                -ProcessId $SoftlandProcessId `
                -MainHandle $MainHandle `
                -TimeoutSeconds 60 `
                -Condition {

                    param($dialog)


                    $text =
                        Normalize-Text (
                            Get-WindowText -Window $dialog
                        )


                    return (
                        $text -like "*contrasena*" -or
                        $text -like "*password*"
                    )
                }


            if (-not $PasswordDialog) {

                throw "No aparecio la ventana Ingrese contraseña."
            }


            Write-Host "[OK] Ventana de contraseña detectada."


            if (
                -not (
                    Set-Password `
                        -Window $PasswordDialog `
                        -Value $Password
                )
            ) {

                throw "No fue posible ingresar la contraseña."
            }


            Write-Host "[OK] Contraseña ingresada."
            Write-Host "[INFO] La contraseña no se muestra en el log."


            $PasswordHandle =
                [int64]$PasswordDialog.Current.NativeWindowHandle


            $Aceptar =
                Get-OkButton `
                    -Window $PasswordDialog


            if (-not $Aceptar) {

                throw "No se encontro Aceptar en la ventana de contraseña."
            }


            Click-Element -Element $Aceptar


            Wait-DialogClose `
                -Handle $PasswordHandle `
                -TimeoutSeconds 30 |
                Out-Null


            Write-Host "[OK] Contraseña aceptada."


            # ========================================================
            # 11 - PRIMER SI POSTERIOR
            # ========================================================

            Write-Host "[INFO] Esperando primera confirmacion posterior..."


            $Post1 = Wait-Dialog `
                -ProcessId $SoftlandProcessId `
                -MainHandle $MainHandle `
                -TimeoutSeconds 120 `
                -Condition {

                    param($dialog)


                    return (
                        $null -ne
                        (Get-YesButton -Window $dialog)
                    )
                }


            if (-not $Post1) {

                throw "No aparecio la primera confirmacion posterior."
            }


            $Post1Text =
                Get-WindowText -Window $Post1


            Write-Host "[INFO] Primera confirmacion:"
            Write-Host "       $Post1Text"


            $Post1Handle =
                [int64]$Post1.Current.NativeWindowHandle


            $Yes1 =
                Get-YesButton `
                    -Window $Post1


            if (-not $Yes1) {

                throw "No se encontro Si en la primera confirmacion."
            }


            Click-Element -Element $Yes1


            Wait-DialogClose `
                -Handle $Post1Handle `
                -TimeoutSeconds 30 |
                Out-Null


            Write-Host "[OK] Primera confirmacion aceptada."


            # ========================================================
            # 12 - SEGUNDO SI POSTERIOR
            # ========================================================

            Write-Host "[INFO] Esperando segunda confirmacion posterior..."


            $Post2 = Wait-Dialog `
                -ProcessId $SoftlandProcessId `
                -MainHandle $MainHandle `
                -TimeoutSeconds 120 `
                -Condition {

                    param($dialog)


                    return (
                        $null -ne
                        (Get-YesButton -Window $dialog)
                    )
                }


            if (-not $Post2) {

                throw "No aparecio la segunda confirmacion posterior."
            }


            $Post2Text =
                Get-WindowText -Window $Post2


            Write-Host "[INFO] Segunda confirmacion:"
            Write-Host "       $Post2Text"


            $Post2Handle =
                [int64]$Post2.Current.NativeWindowHandle


            $Yes2 =
                Get-YesButton `
                    -Window $Post2


            if (-not $Yes2) {

                throw "No se encontro Si en la segunda confirmacion."
            }


            Click-Element -Element $Yes2


            Wait-DialogClose `
                -Handle $Post2Handle `
                -TimeoutSeconds 30 |
                Out-Null


            Write-Host "[OK] Segunda confirmacion aceptada."


            # ========================================================
            # 13 - CONVERSION
            # ========================================================

            Write-Host ""
            Write-Host "[INFO] Conversion de $CurrentCompany en curso..."
            Write-Host "[INFO] Esperando mensaje de finalizacion..."


            $Finish = Wait-Dialog `
                -ProcessId $SoftlandProcessId `
                -MainHandle $MainHandle `
                -TimeoutSeconds 1800 `
                -Condition {

                    param($dialog)


                    $text =
                        Normalize-Text (
                            Get-WindowText -Window $dialog
                        )


                    return (
                        $text -like "*finaliz*" -and
                        (
                            $text -like "*convers*" -or
                            $text -like "*convert*"
                        )
                    )
                }


            if (-not $Finish) {

                throw "La conversion de $CurrentCompany no informo finalizacion dentro del tiempo esperado."
            }


            $FinishText =
                Get-WindowText `
                    -Window $Finish


            Write-Host ""
            Write-Host "[OK] Conversion finalizada."
            Write-Host "[INFO] Empresa: $CurrentCompany"
            Write-Host "[INFO] Mensaje:"
            Write-Host "       $FinishText"


            $FinishHandle =
                [int64]$Finish.Current.NativeWindowHandle


            $OK =
                Get-OkButton `
                    -Window $Finish


            if (-not $OK) {

                throw "No se encontro OK en el mensaje de finalizacion."
            }


            # ========================================================
            # ESTE OK HACE QUE SOFTLAND PASE A LA SIGUIENTE EMPRESA
            # ========================================================

            Write-Host "[INFO] Presionando OK para continuar..."


            Click-Element -Element $OK


            Wait-DialogClose `
                -Handle $FinishHandle `
                -TimeoutSeconds 30 |
                Out-Null


            $ConvertedCount++

            $ConvertedCompanies += $CurrentCompany


            Write-Host ""
            Write-Host "[OK] Empresa completada: $CurrentCompany"
            Write-Host "[INFO] Total procesadas: $ConvertedCount"


            Start-Sleep -Seconds 2
        }


        # ============================================================
        # 14 - RESULTADO FINAL
        # ============================================================

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " CONVERSION DE EMPRESAS FINALIZADA"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor           : $env:COMPUTERNAME"
        Write-Host "Agente             : $env:AGENT_NAME"
        Write-Host "Empresas procesadas: $ConvertedCount"
        Write-Host ""


        if ($ConvertedCompanies.Count -gt 0) {

            Write-Host "Empresas convertidas:"


            foreach ($Company in $ConvertedCompanies) {

                Write-Host " - $Company"
            }
        }


        if ($ConvertedCount -eq 0) {

            throw "El proceso finalizo sin convertir ninguna empresa."
        }


        Write-Host ""
        Write-Host "[OK] Pipeline finalizado correctamente."
        Write-Host ""

        exit 0
