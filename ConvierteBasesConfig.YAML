trigger: none

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: SeleccionarEmpresasSoftland
  displayName: "Seleccionar empresas Softland"
  timeoutInMinutes: 30

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Abrir Configuración y seleccionar empresas"

    inputs:
      targetType: inline
      pwsh: false

      script: |

        $ErrorActionPreference = "Stop"

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - SELECCION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # FUNCIONES WIN32 GENERALES
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public class Win32
        {
            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(IntPtr hWnd);

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(
                int X,
                int Y
            );

            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );
        }
        "@


        # ============================================================
        # MANEJO NATIVO DE LISTVIEW
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;

            const uint LVM_GETITEMCOUNT =
                LVM_FIRST + 4;

            const uint LVM_SETITEMSTATE =
                LVM_FIRST + 43;

            const uint LVM_GETITEMSTATE =
                LVM_FIRST + 44;


            const uint LVIS_STATEIMAGEMASK =
                0xF000;


            const uint PROCESS_VM_OPERATION =
                0x0008;

            const uint PROCESS_VM_READ =
                0x0010;

            const uint PROCESS_VM_WRITE =
                0x0020;

            const uint PROCESS_QUERY_INFORMATION =
                0x0400;


            const uint MEM_COMMIT =
                0x1000;

            const uint MEM_RESERVE =
                0x2000;

            const uint MEM_RELEASE =
                0x8000;

            const uint PAGE_READWRITE =
                0x04;


            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );


            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );


            [DllImport(
                "kernel32.dll",
                SetLastError = true
            )]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );


            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );


            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }


            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state =
                    SendMessage(
                        handle,
                        LVM_GETITEMSTATE,
                        new IntPtr(index),
                        new IntPtr(
                            LVIS_STATEIMAGEMASK
                        )
                    ).ToInt32();


                return (
                    state & 0xF000
                ) >> 12;
            }


            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;


                GetWindowThreadProcessId(
                    handle,
                    out processId
                );


                IntPtr process =
                    OpenProcess(
                        PROCESS_VM_OPERATION |
                        PROCESS_VM_READ |
                        PROCESS_VM_WRITE |
                        PROCESS_QUERY_INFORMATION,
                        false,
                        processId
                    );


                if (process == IntPtr.Zero)
                    return false;


                /*
                    Campos iniciales LVITEM:

                    mask       offset 0
                    iItem      offset 4
                    iSubItem   offset 8
                    state      offset 12
                    stateMask  offset 16
                */


                byte[] lvItem =
                    new byte[20];


                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;


                Buffer.BlockCopy(
                    BitConverter.GetBytes(
                        stateValue
                    ),
                    0,
                    lvItem,
                    12,
                    4
                );


                Buffer.BlockCopy(
                    BitConverter.GetBytes(
                        LVIS_STATEIMAGEMASK
                    ),
                    0,
                    lvItem,
                    16,
                    4
                );


                IntPtr remoteMemory =
                    VirtualAllocEx(
                        process,
                        IntPtr.Zero,
                        (UIntPtr)lvItem.Length,
                        MEM_COMMIT |
                        MEM_RESERVE,
                        PAGE_READWRITE
                    );


                if (
                    remoteMemory ==
                    IntPtr.Zero
                )
                {
                    CloseHandle(
                        process
                    );

                    return false;
                }


                UIntPtr written;


                bool ok =
                    WriteProcessMemory(
                        process,
                        remoteMemory,
                        lvItem,
                        (UIntPtr)lvItem.Length,
                        out written
                    );


                if (ok)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remoteMemory
                    );
                }


                VirtualFreeEx(
                    process,
                    remoteMemory,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );


                CloseHandle(
                    process
                );


                return ok;
            }
        }
        "@


        # ============================================================
        # FUNCIONES POWERSHELL
        # ============================================================

        function Normalize-Text {

            param(
                [string]$Text
            )

            if (
                $null -eq $Text
            ) {
                return ""
            }


            $Text =
                $Text.Replace(
                    "&",
                    ""
                ).Trim().ToLowerInvariant()


            $normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )


            $builder =
                New-Object Text.StringBuilder


            foreach (
                $char in
                $normalized.ToCharArray()
            ) {

                $category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $char
                    )


                if (
                    $category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$builder.Append(
                        $char
                    )
                }
            }


            return $builder.ToString()
        }



        function Get-Descendants {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )


            return $Root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
            )
        }



        function Get-ElementByIdAndName {

            param(
                [System.Windows.Automation.AutomationElement]$Root,

                [string]$AutomationId,

                [string]$Name
            )


            $IdCondition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::AutomationIdProperty,
                    $AutomationId
                )


            $NameCondition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::NameProperty,
                    $Name
                )


            $TypeCondition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::MenuItem
                )


            $Condition =
                New-Object System.Windows.Automation.AndCondition(
                    $IdCondition,
                    $NameCondition,
                    $TypeCondition
                )


            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }



        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,

                [string]$ClassName
            )


            $condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )


            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $condition
            )
        }



        function Click-Element {

            param(
                [System.Windows.Automation.AutomationElement]$Element
            )


            if (
                $null -eq $Element
            ) {

                throw "Se intento hacer clic sobre un elemento inexistente."
            }


            # --------------------------------------------------------
            # INVOKE PATTERN
            # --------------------------------------------------------

            try {

                $invoke =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.InvokePattern]::Pattern
                    )


                $invoke.Invoke()

                return
            }
            catch {
            }


            # --------------------------------------------------------
            # LEGACY
            # --------------------------------------------------------

            try {

                $legacy =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                    )


                $legacy.DoDefaultAction()

                return
            }
            catch {
            }


            # --------------------------------------------------------
            # CLICK FISICO
            # --------------------------------------------------------

            $rect =
                $Element.Current.BoundingRectangle


            $x =
                [int](
                    $rect.Left +
                    ($rect.Width / 2)
                )


            $y =
                [int](
                    $rect.Top +
                    ($rect.Height / 2)
                )


            [Win32]::SetCursorPos(
                $x,
                $y
            ) | Out-Null


            Start-Sleep `
                -Milliseconds 250


            [Win32]::mouse_event(
                0x0002,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )


            [Win32]::mouse_event(
                0x0004,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )
        }


        # ============================================================
        # 1 - BUSCAR CWCONFIG.EXE
        # ============================================================

        Write-Host "[1] Buscando cwConfig.exe..."


        $PossiblePaths = @(

            "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",

            "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
        )


        $ConfigExe =
            $null


        foreach (
            $Path in
            $PossiblePaths
        ) {

            Write-Host "[INFO] Probando: $Path"


            if (
                Test-Path $Path
            ) {

                $ConfigExe =
                    $Path

                break
            }
        }


        # ============================================================
        # BUSQUEDA ALTERNATIVA
        # ============================================================

        if (
            -not $ConfigExe
        ) {

            Write-Host "[INFO] No se encontro en las rutas estandar."
            Write-Host "[INFO] Buscando dentro de Softland..."


            $SearchRoots = @(

                "C:\Program Files (x86)\Softland",

                "C:\Program Files\Softland"
            )


            foreach (
                $RootPath in
                $SearchRoots
            ) {

                if (
                    Test-Path $RootPath
                ) {

                    $Found =
                        Get-ChildItem `
                            -Path $RootPath `
                            -Filter "cwConfig.exe" `
                            -File `
                            -Recurse `
                            -ErrorAction SilentlyContinue |
                        Select-Object `
                            -First 1


                    if (
                        $Found
                    ) {

                        $ConfigExe =
                            $Found.FullName

                        break
                    }
                }
            }
        }


        if (
            -not $ConfigExe
        ) {

            throw "No se encontro cwConfig.exe en el servidor $env:COMPUTERNAME."
        }


        Write-Host ""
        Write-Host "[OK] Ejecutable encontrado:"
        Write-Host "     $ConfigExe"
        Write-Host ""


        # ============================================================
        # 2 - ABRIR CONFIGURACION
        # ============================================================

        Write-Host "[2] Abriendo Configuracion del Sistema de Gestion..."


        Start-Process `
            -FilePath $ConfigExe |
            Out-Null


        Write-Host "[INFO] Esperando ventana principal..."


        # ============================================================
        # 3 - BUSCAR VENTANA PRINCIPAL
        # ============================================================

        $MainWindow =
            $null


        $Timeout =
            (Get-Date).AddSeconds(
                60
            )


        while (
            (Get-Date) -lt $Timeout
        ) {

            $Desktop =
                [System.Windows.Automation.AutomationElement]::RootElement


            $Windows =
                $Desktop.FindAll(
                    [System.Windows.Automation.TreeScope]::Children,
                    [System.Windows.Automation.Condition]::TrueCondition
                )


            foreach (
                $Window in
                $Windows
            ) {

                try {

                    $Title =
                        Normalize-Text `
                            $Window.Current.Name


                    if (
                        $Title -like
                        "*configuracion del sistema de gestion*" -or

                        $Title -like
                        "*configuracion de softland*"
                    ) {

                        $MainWindow =
                            $Window

                        break
                    }
                }
                catch {
                }
            }


            if (
                $MainWindow
            ) {
                break
            }


            Start-Sleep `
                -Seconds 1
        }


        if (
            -not $MainWindow
        ) {

            throw "No se encontro la ventana Configuracion del Sistema de Gestion."
        }


        $MainHandle =
            [IntPtr]$MainWindow.Current.NativeWindowHandle


        [Win32]::ShowWindowAsync(
            $MainHandle,
            9
        ) | Out-Null


        [Win32]::SetForegroundWindow(
            $MainHandle
        ) | Out-Null


        Write-Host "[OK] Configuracion de Softland abierta."
        Write-Host "[INFO] PID: $($MainWindow.Current.ProcessId)"
        Write-Host ""


        # ============================================================
        # 4 - OPERACIONES
        #
        # AutomationId = Item 2
        # Name         = Operaciones
        # ============================================================

        Write-Host "[3] Navegando a Operaciones -> Empresas..."
        Write-Host ""


        Write-Host "[INFO] Buscando Operaciones..."


        $Operaciones =
            Get-ElementByIdAndName `
                -Root $MainWindow `
                -AutomationId "Item 2" `
                -Name "Operaciones"


        if (
            -not $Operaciones
        ) {

            throw "No se encontro Operaciones (AutomationId=Item 2)."
        }


        Write-Host "[OK] Operaciones detectado."
        Write-Host "[INFO] Nombre       : $($Operaciones.Current.Name)"
        Write-Host "[INFO] AutomationId : $($Operaciones.Current.AutomationId)"


        # ============================================================
        # ABRIR OPERACIONES
        # ============================================================

        Write-Host "[INFO] Abriendo Operaciones..."


        try {

            $Expand =
                $Operaciones.GetCurrentPattern(
                    [System.Windows.Automation.ExpandCollapsePattern]::Pattern
                )


            $Expand.Expand()
        }
        catch {

            Click-Element `
                -Element $Operaciones
        }


        Start-Sleep `
            -Seconds 2


        Write-Host "[OK] Operaciones abierto."


        # ============================================================
        # 5 - EMPRESAS
        #
        # AutomationId = Item 9
        # Name         = Empresas
        # ============================================================

        Write-Host ""
        Write-Host "[INFO] Buscando Empresas..."


        $Desktop =
            [System.Windows.Automation.AutomationElement]::RootElement


        $Empresas =
            $null


        $TimeoutEmpresas =
            (Get-Date).AddSeconds(
                15
            )


        while (
            (Get-Date) -lt $TimeoutEmpresas -and
            -not $Empresas
        ) {

            $Empresas =
                Get-ElementByIdAndName `
                    -Root $Desktop `
                    -AutomationId "Item 9" `
                    -Name "Empresas"


            if (
                -not $Empresas
            ) {

                Start-Sleep `
                    -Milliseconds 300
            }
        }


        if (
            -not $Empresas
        ) {

            throw "Se abrio Operaciones pero no se encontro Empresas (AutomationId=Item 9)."
        }


        Write-Host "[OK] Empresas detectado."
        Write-Host "[INFO] Nombre       : $($Empresas.Current.Name)"
        Write-Host "[INFO] AutomationId : $($Empresas.Current.AutomationId)"


        # ============================================================
        # ABRIR EMPRESAS
        # ============================================================

        Write-Host "[INFO] Abriendo Empresas..."


        Click-Element `
            -Element $Empresas


        Start-Sleep `
            -Seconds 3


        Write-Host "[OK] Se ejecuto la apertura de Empresas."
        Write-Host ""


        # ============================================================
        # 6 - DETECTAR LISTVIEW20WNDCLASS
        # ============================================================

        Write-Host "[4] Buscando grilla ListView20WndClass..."


        $ListaEmpresas =
            $null


        $TimeoutLista =
            (Get-Date).AddSeconds(
                15
            )


        while (
            (Get-Date) -lt $TimeoutLista -and
            -not $ListaEmpresas
        ) {

            $ListaEmpresas =
                Get-ElementByClass `
                    -Root $MainWindow `
                    -ClassName "ListView20WndClass"


            if (
                -not $ListaEmpresas
            ) {

                Start-Sleep `
                    -Milliseconds 300
            }
        }


        if (
            -not $ListaEmpresas
        ) {

            throw "No se encontro la grilla ListView20WndClass."
        }


        $ListHandle =
            [IntPtr]$ListaEmpresas.Current.NativeWindowHandle


        Write-Host "[OK] Grilla detectada."
        Write-Host "[INFO] Clase  : $($ListaEmpresas.Current.ClassName)"
        Write-Host "[INFO] Handle : $ListHandle"
        Write-Host ""


        # ============================================================
        # 7 - OBTENER CANTIDAD DE EMPRESAS
        # ============================================================

        $CantidadEmpresas =
            [NativeListView]::GetItemCount(
                $ListHandle
            )


        Write-Host "[INFO] Empresas encontradas en la grilla: $CantidadEmpresas"


        if (
            $CantidadEmpresas -le 0
        ) {

            throw "La grilla fue encontrada pero no contiene empresas."
        }


        # ============================================================
        # 8 - MOSTRAR ESTADO INICIAL
        # ============================================================

        Write-Host ""
        Write-Host "[5] Estado inicial de las empresas..."
        Write-Host ""


        for (
            $i = 0;
            $i -lt $CantidadEmpresas;
            $i++
        ) {

            $Estado =
                [NativeListView]::GetCheckState(
                    $ListHandle,
                    $i
                )


            Write-Host "[INFO] Fila $($i + 1) - Estado: $Estado"
        }


        # ============================================================
        # 9 - MARCAR TODAS LAS EMPRESAS
        # ============================================================

        Write-Host ""
        Write-Host "[6] Marcando todas las empresas..."
        Write-Host ""


        for (
            $i = 0;
            $i -lt $CantidadEmpresas;
            $i++
        ) {

            $Estado =
                [NativeListView]::GetCheckState(
                    $ListHandle,
                    $i
                )


            # --------------------------------------------------------
            # Estado 1 = no marcado
            # Estado 2 = marcado
            # --------------------------------------------------------

            if (
                $Estado -eq 2
            ) {

                Write-Host "[OK] Fila $($i + 1) ya estaba marcada."

                continue
            }


            Write-Host "[INFO] Marcando fila $($i + 1)..."


            $Resultado =
                [NativeListView]::SetChecked(
                    $ListHandle,
                    $i,
                    $true
                )


            if (
                -not $Resultado
            ) {

                throw "No fue posible marcar la fila $($i + 1)."
            }


            Start-Sleep `
                -Milliseconds 150
        }


        # ============================================================
        # 10 - VERIFICAR RESULTADO
        # ============================================================

        Write-Host ""
        Write-Host "[7] Verificando empresas seleccionadas..."
        Write-Host ""


        $Marcadas =
            0


        $NoMarcadas =
            0


        for (
            $i = 0;
            $i -lt $CantidadEmpresas;
            $i++
        ) {

            $Estado =
                [NativeListView]::GetCheckState(
                    $ListHandle,
                    $i
                )


            if (
                $Estado -eq 2
            ) {

                $Marcadas++


                Write-Host "[OK] Fila $($i + 1) marcada."
            }
            else {

                $NoMarcadas++


                Write-Host "[ERROR] Fila $($i + 1) NO marcada. Estado=$Estado"
            }
        }


        # ============================================================
        # RESULTADO
        # ============================================================

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " RESULTADO DE LA PRUEBA"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor            : $env:COMPUTERNAME"
        Write-Host "Empresas detectadas : $CantidadEmpresas"
        Write-Host "Empresas marcadas   : $Marcadas"
        Write-Host "No marcadas         : $NoMarcadas"
        Write-Host ""


        if (
            $Marcadas -ne
            $CantidadEmpresas
        ) {

            throw "No quedaron seleccionadas todas las empresas."
        }


        Write-Host "=========================================================="
        Write-Host " OK - TODAS LAS EMPRESAS QUEDARON SELECCIONADAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "[TEST] El pipeline se detiene en este punto."
        Write-Host "[TEST] NO se presiona Convertir."
        Write-Host ""


        exit 0
