trigger: none

parameters:
- name: debugPauseMinutes
  displayName: "Minutos para dejar Config abierto"
  type: number
  default: 20

pool:
  name: Softland-QA
  demands:
    - Agent.OS -equals Windows_NT

jobs:

- job: SeleccionarEmpresasSoftland
  displayName: "Seleccionar empresas Softland"
  timeoutInMinutes: 60

  steps:

  - checkout: self

  - task: PowerShell@2
    displayName: "Abrir Config y seleccionar empresas"
    env:
      DEBUG_PAUSE_MINUTES: ${{ parameters.debugPauseMinutes }}

    inputs:
      targetType: inline
      pwsh: false
      script: |

        $ErrorActionPreference = "Stop"

        $DebugPauseMinutes = [int]$env:DEBUG_PAUSE_MINUTES

        Write-Host ""
        Write-Host "=========================================================="
        Write-Host " AGENTES QA - SELECCION AUTOMATICA DE EMPRESAS"
        Write-Host "=========================================================="
        Write-Host ""
        Write-Host "Servidor : $env:COMPUTERNAME"
        Write-Host "Usuario  : $env:USERNAME"
        Write-Host "Agente   : $env:AGENT_NAME"
        Write-Host ""


        # ============================================================
        # UI AUTOMATION
        # ============================================================

        Add-Type -AssemblyName UIAutomationClient
        Add-Type -AssemblyName UIAutomationTypes


        # ============================================================
        # WIN32
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public class Win32
        {
            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(
                IntPtr hWnd
            );

            [DllImport("user32.dll")]
            public static extern bool ShowWindowAsync(
                IntPtr hWnd,
                int nCmdShow
            );

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(
                int X,
                int Y
            );

            [DllImport("user32.dll")]
            public static extern void mouse_event(
                uint dwFlags,
                uint dx,
                uint dy,
                uint dwData,
                UIntPtr dwExtraInfo
            );
        }
        "@


        # ============================================================
        # LISTVIEW NATIVO
        # ============================================================

        Add-Type @"
        using System;
        using System.Runtime.InteropServices;

        public static class NativeListView
        {
            const uint LVM_FIRST = 0x1000;
            const uint LVM_GETITEMCOUNT = LVM_FIRST + 4;
            const uint LVM_SETITEMSTATE = LVM_FIRST + 43;
            const uint LVM_GETITEMSTATE = LVM_FIRST + 44;

            const uint LVIS_STATEIMAGEMASK = 0xF000;

            const uint PROCESS_VM_OPERATION = 0x0008;
            const uint PROCESS_VM_READ = 0x0010;
            const uint PROCESS_VM_WRITE = 0x0020;
            const uint PROCESS_QUERY_INFORMATION = 0x0400;

            const uint MEM_COMMIT = 0x1000;
            const uint MEM_RESERVE = 0x2000;
            const uint MEM_RELEASE = 0x8000;

            const uint PAGE_READWRITE = 0x04;

            [DllImport("user32.dll")]
            static extern IntPtr SendMessage(
                IntPtr hWnd,
                uint Msg,
                IntPtr wParam,
                IntPtr lParam
            );

            [DllImport("user32.dll")]
            static extern uint GetWindowThreadProcessId(
                IntPtr hWnd,
                out uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr OpenProcess(
                uint processAccess,
                bool inheritHandle,
                uint processId
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr VirtualAllocEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr dwSize,
                uint allocationType,
                uint protect
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool WriteProcessMemory(
                IntPtr hProcess,
                IntPtr lpBaseAddress,
                byte[] buffer,
                UIntPtr size,
                out UIntPtr numberOfBytesWritten
            );

            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool VirtualFreeEx(
                IntPtr hProcess,
                IntPtr lpAddress,
                UIntPtr size,
                uint freeType
            );

            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(
                IntPtr handle
            );

            public static int GetItemCount(
                IntPtr handle
            )
            {
                return SendMessage(
                    handle,
                    LVM_GETITEMCOUNT,
                    IntPtr.Zero,
                    IntPtr.Zero
                ).ToInt32();
            }

            public static int GetCheckState(
                IntPtr handle,
                int index
            )
            {
                int state = SendMessage(
                    handle,
                    LVM_GETITEMSTATE,
                    new IntPtr(index),
                    new IntPtr(LVIS_STATEIMAGEMASK)
                ).ToInt32();

                return (state & 0xF000) >> 12;
            }

            public static bool SetChecked(
                IntPtr handle,
                int index,
                bool check
            )
            {
                uint processId;

                GetWindowThreadProcessId(
                    handle,
                    out processId
                );

                IntPtr process = OpenProcess(
                    PROCESS_VM_OPERATION |
                    PROCESS_VM_READ |
                    PROCESS_VM_WRITE |
                    PROCESS_QUERY_INFORMATION,
                    false,
                    processId
                );

                if (process == IntPtr.Zero)
                {
                    return false;
                }

                byte[] lvItem = new byte[20];

                uint stateValue =
                    check
                    ? 0x2000u
                    : 0x1000u;

                Buffer.BlockCopy(
                    BitConverter.GetBytes(stateValue),
                    0,
                    lvItem,
                    12,
                    4
                );

                Buffer.BlockCopy(
                    BitConverter.GetBytes(LVIS_STATEIMAGEMASK),
                    0,
                    lvItem,
                    16,
                    4
                );

                IntPtr remoteMemory = VirtualAllocEx(
                    process,
                    IntPtr.Zero,
                    (UIntPtr)lvItem.Length,
                    MEM_COMMIT | MEM_RESERVE,
                    PAGE_READWRITE
                );

                if (remoteMemory == IntPtr.Zero)
                {
                    CloseHandle(process);
                    return false;
                }

                UIntPtr written;

                bool ok = WriteProcessMemory(
                    process,
                    remoteMemory,
                    lvItem,
                    (UIntPtr)lvItem.Length,
                    out written
                );

                if (ok)
                {
                    SendMessage(
                        handle,
                        LVM_SETITEMSTATE,
                        new IntPtr(index),
                        remoteMemory
                    );
                }

                VirtualFreeEx(
                    process,
                    remoteMemory,
                    UIntPtr.Zero,
                    MEM_RELEASE
                );

                CloseHandle(process);

                return ok;
            }
        }
        "@


        # ============================================================
        # FUNCIONES POWERSHELL
        # ============================================================

        function Normalize-Text {

            param(
                [string]$Text
            )

            if ($null -eq $Text) {
                return ""
            }

            $Text =
                $Text.Replace("&","").Trim().ToLowerInvariant()

            $Normalized =
                $Text.Normalize(
                    [Text.NormalizationForm]::FormD
                )

            $Builder =
                New-Object Text.StringBuilder

            foreach ($Char in $Normalized.ToCharArray()) {

                $Category =
                    [Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                        $Char
                    )

                if (
                    $Category -ne
                    [Globalization.UnicodeCategory]::NonSpacingMark
                ) {

                    [void]$Builder.Append(
                        $Char
                    )
                }
            }

            return $Builder.ToString()
        }


        function Get-Descendants {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            return $Root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
            )
        }


        function Get-ElementByClass {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$ClassName
            )

            $Condition =
                New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty,
                    $ClassName
                )

            return $Root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $Condition
            )
        }


        function Find-MenuItem {

            param(
                [System.Windows.Automation.AutomationElement]$Root,
                [string]$AutomationId,
                [string]$Name
            )

            # ========================================================
            # 1 - ID + NOMBRE
            # ========================================================

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    if (
                        $Element.Current.AutomationId -eq $AutomationId -and
                        (Normalize-Text $Element.Current.Name) -eq
                        (Normalize-Text $Name)
                    ) {

                        return $Element
                    }
                }
                catch {
                }
            }


            # ========================================================
            # 2 - SOLO AUTOMATION ID
            # ========================================================

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    if (
                        $Element.Current.AutomationId -eq $AutomationId
                    ) {

                        return $Element
                    }
                }
                catch {
                }
            }


            # ========================================================
            # 3 - SOLO NOMBRE
            # ========================================================

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    if (
                        (Normalize-Text $Element.Current.Name) -eq
                        (Normalize-Text $Name)
                    ) {

                        return $Element
                    }
                }
                catch {
                }
            }

            return $null
        }


        function Dump-MenuItems {

            param(
                [System.Windows.Automation.AutomationElement]$Root
            )

            Write-Host ""
            Write-Host "----------------------------------------------------------"
            Write-Host " CONTROLES DE MENU DETECTADOS"
            Write-Host "----------------------------------------------------------"

            $Count = 0

            foreach ($Element in (Get-Descendants -Root $Root)) {

                try {

                    $Name =
                        $Element.Current.Name

                    $AutomationId =
                        $Element.Current.AutomationId

                    $ClassName =
                        $Element.Current.ClassName

                    $Type =
                        $Element.Current.ControlType.ProgrammaticName


                    if (
                        -not [string]::IsNullOrWhiteSpace($Name) -or
                        -not [string]::IsNullOrWhiteSpace($AutomationId)
                    ) {

                        if (
                            $Type -like "*Menu*" -or
                            $AutomationId -like "Item*"
                        ) {

                            $Count++

                            Write-Host (
                                "Elemento #{0} | Name=[{1}] | AutomationId=[{2}] | Type=[{3}] | Class=[{4}]" -f
                                $Count,
                                $Name,
                                $AutomationId,
                                $Type,
                                $ClassName
                            )
                        }
                    }
                }
                catch {
                }
            }

            Write-Host "----------------------------------------------------------"
            Write-Host "[INFO] Total controles encontrados: $Count"
            Write-Host ""
        }


        function Click-Element {

            param(
                [System.Windows.Automation.AutomationElement]$Element
            )

            if ($null -eq $Element) {

                throw "Se intento hacer clic sobre un elemento inexistente."
            }


            # ========================================================
            # INVOKE
            # ========================================================

            try {

                $Invoke =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.InvokePattern]::Pattern
                    )

                $Invoke.Invoke()

                return
            }
            catch {
            }


            # ========================================================
            # EXPAND
            # ========================================================

            try {

                $Expand =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.ExpandCollapsePattern]::Pattern
                    )

                $Expand.Expand()

                return
            }
            catch {
            }


            # ========================================================
            # LEGACY
            # ========================================================

            try {

                $Legacy =
                    $Element.GetCurrentPattern(
                        [System.Windows.Automation.LegacyIAccessiblePattern]::Pattern
                    )

                $Legacy.DoDefaultAction()

                return
            }
            catch {
            }


            # ========================================================
            # CLICK FISICO
            # ========================================================

            $Rect =
                $Element.Current.BoundingRectangle

            $X =
                [int](
                    $Rect.Left +
                    ($Rect.Width / 2)
                )

            $Y =
                [int](
                    $Rect.Top +
                    ($Rect.Height / 2)
                )


            [Win32]::SetCursorPos(
                $X,
                $Y
            ) | Out-Null


            Start-Sleep -Milliseconds 250


            [Win32]::mouse_event(
                0x0002,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )


            [Win32]::mouse_event(
                0x0004,
                0,
                0,
                0,
                [UIntPtr]::Zero
            )
        }


        # ============================================================
        # INICIO DEL PROCESO
        # ============================================================

        try {

            # ========================================================
            # 1 - BUSCAR CWCONFIG
            # ========================================================

            Write-Host "[1] Buscando cwConfig.exe..."


            $PossiblePaths = @(

                "C:\Program Files (x86)\Softland\Cliente\Config\cwConfig.exe",

                "C:\Program Files\Softland\Cliente\Config\cwConfig.exe"
            )


            $ConfigExe =
                $null


            foreach ($Path in $PossiblePaths) {

                Write-Host "[INFO] Probando: $Path"

                if (Test-Path $Path) {

                    $ConfigExe =
                        $Path

                    break
                }
            }


            # ========================================================
            # BUSQUEDA DINAMICA
            # ========================================================

            if (-not $ConfigExe) {

                Write-Host "[INFO] No se encontro en las rutas estandar."
                Write-Host "[INFO] Buscando cwConfig.exe dentro de Softland..."


                $SearchRoots = @(

                    "C:\Program Files (x86)\Softland",

                    "C:\Program Files\Softland"
                )


                foreach ($RootPath in $SearchRoots) {

                    if (Test-Path $RootPath) {

                        $Found =
                            Get-ChildItem `
                                -Path $RootPath `
                                -Filter "cwConfig.exe" `
                                -File `
                                -Recurse `
                                -ErrorAction SilentlyContinue |
                            Select-Object -First 1


                        if ($Found) {

                            $ConfigExe =
                                $Found.FullName

                            break
                        }
                    }
                }
            }


            if (-not $ConfigExe) {

                throw "No se encontro cwConfig.exe en este servidor."
            }


            Write-Host ""
            Write-Host "[OK] Ejecutable encontrado:"
            Write-Host "     $ConfigExe"
            Write-Host ""


            # ========================================================
            # 2 - ABRIR CONFIG
            # ========================================================

            Write-Host "[2] Abriendo Configuracion del Sistema de Gestion..."


            $ConfigProcess =
                Start-Process `
                    -FilePath $ConfigExe `
                    -PassThru


            Write-Host "[INFO] PID inicial: $($ConfigProcess.Id)"
            Write-Host "[INFO] Esperando ventana principal..."


            # ========================================================
            # BUSCAR VENTANA PRINCIPAL
            # ========================================================

            $MainWindow =
                $null


            $Timeout =
                (Get-Date).AddSeconds(
                    60
                )


            while (
                (Get-Date) -lt $Timeout
            ) {

                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $Windows =
                    $Desktop.FindAll(
                        [System.Windows.Automation.TreeScope]::Children,
                        [System.Windows.Automation.Condition]::TrueCondition
                    )


                foreach ($Window in $Windows) {

                    try {

                        $Title =
                            Normalize-Text `
                                $Window.Current.Name


                        if (
                            $Title -like "*configuracion del sistema de gestion*" -or
                            $Title -like "*configuracion de softland*"
                        ) {

                            $MainWindow =
                                $Window

                            break
                        }
                    }
                    catch {
                    }
                }


                if ($MainWindow) {
                    break
                }


                Start-Sleep -Seconds 1
            }


            if (-not $MainWindow) {

                throw "No se encontro la ventana Configuracion del Sistema de Gestion."
            }


            $MainHandle =
                [IntPtr]$MainWindow.Current.NativeWindowHandle


            [Win32]::ShowWindowAsync(
                $MainHandle,
                9
            ) | Out-Null


            [Win32]::SetForegroundWindow(
                $MainHandle
            ) | Out-Null


            Write-Host "[OK] Configuracion de Softland abierta."
            Write-Host "[INFO] PID real: $($MainWindow.Current.ProcessId)"
            Write-Host ""


            # ========================================================
            # 3 - OPERACIONES
            # ========================================================

            Write-Host "[3] Navegando a Operaciones -> Empresas..."
            Write-Host ""

            Write-Host "[INFO] Buscando Operaciones..."


            $Operaciones =
                Find-MenuItem `
                    -Root $MainWindow `
                    -AutomationId "Item 2" `
                    -Name "Operaciones"


            # ========================================================
            # FALLBACK DESDE TODO EL ESCRITORIO
            # ========================================================

            if (-not $Operaciones) {

                Write-Host "[WARN] Operaciones no se encontro dentro de MainWindow."
                Write-Host "[INFO] Buscando desde RootElement..."


                $Desktop =
                    [System.Windows.Automation.AutomationElement]::RootElement


                $Operaciones =
                    Find-MenuItem `
                        -Root $Desktop `
                        -AutomationId "Item 2" `
                        -Name "Operaciones"
            }


            if (-not $Operaciones) {

                Dump-MenuItems `
                    -Root $MainWindow


                Write-Host "[INFO] Realizando tambien diagnostico desde el escritorio completo..."


                Dump-MenuItems `
                    -Root ([System.Windows.Automation.AutomationElement]::RootElement)


                throw "No se encontro Operaciones. Revise los controles mostrados en el log."
            }


            Write-Host "[OK] Operaciones detectado."
            Write-Host "[INFO] Nombre       : $($Operaciones.Current.Name)"
            Write-Host "[INFO] AutomationId : $($Operaciones.Current.AutomationId)"
            Write-Host "[INFO] Clase        : $($Operaciones.Current.ClassName)"
            Write-Host "[INFO] Tipo         : $($Operaciones.Current.ControlType.ProgrammaticName)"
            Write-Host ""


            Write-Host "[INFO] Abriendo Operaciones..."


            Click-Element `
                -Element $Operaciones


            Start-Sleep -Seconds 2


            Write-Host "[OK] Operaciones abierto."


            # ========================================================
            # 4 - EMPRESAS
            # ========================================================

            Write-Host ""
            Write-Host "[INFO] Buscando Empresas..."


            $Desktop =
                [System.Windows.Automation.AutomationElement]::RootElement


            $Empresas =
                $null


            $TimeoutEmpresas =
                (Get-Date).AddSeconds(
                    15
                )


            while (
                (Get-Date) -lt $TimeoutEmpresas -and
                -not $Empresas
            ) {

                $Empresas =
                    Find-MenuItem `
                        -Root $Desktop `
                        -AutomationId "Item 9" `
                        -Name "Empresas"


                if (-not $Empresas) {

                    Start-Sleep -Milliseconds 300
                }
            }


            if (-not $Empresas) {

                Dump-MenuItems `
                    -Root $Desktop


                throw "Operaciones fue abierto pero no se encontro Empresas."
            }


            Write-Host "[OK] Empresas detectado."
            Write-Host "[INFO] Nombre       : $($Empresas.Current.Name)"
            Write-Host "[INFO] AutomationId : $($Empresas.Current.AutomationId)"
            Write-Host "[INFO] Clase        : $($Empresas.Current.ClassName)"
            Write-Host "[INFO] Tipo         : $($Empresas.Current.ControlType.ProgrammaticName)"
            Write-Host ""


            # ========================================================
            # ABRIR EMPRESAS
            # ========================================================

            Write-Host "[INFO] Abriendo Empresas..."


            Click-Element `
                -Element $Empresas


            Start-Sleep -Seconds 3


            Write-Host "[OK] Click realizado sobre Empresas."
            Write-Host ""


            # ========================================================
            # 5 - BUSCAR LISTVIEW
            # ========================================================

            Write-Host "[4] Buscando grilla ListView20WndClass..."


            $ListaEmpresas =
                $null


            $TimeoutLista =
                (Get-Date).AddSeconds(
                    15
                )


            while (
                (Get-Date) -lt $TimeoutLista -and
                -not $ListaEmpresas
            ) {

                $ListaEmpresas =
                    Get-ElementByClass `
                        -Root $MainWindow `
                        -ClassName "ListView20WndClass"


                if (-not $ListaEmpresas) {

                    Start-Sleep -Milliseconds 300
                }
            }


            if (-not $ListaEmpresas) {

                # Probar también desde escritorio completo

                $ListaEmpresas =
                    Get-ElementByClass `
                        -Root ([System.Windows.Automation.AutomationElement]::RootElement) `
                        -ClassName "ListView20WndClass"
            }


            if (-not $ListaEmpresas) {

                throw "No se encontro la grilla ListView20WndClass."
            }


            $ListHandle =
                [IntPtr]$ListaEmpresas.Current.NativeWindowHandle


            Write-Host "[OK] Grilla detectada."
            Write-Host "[INFO] Clase  : $($ListaEmpresas.Current.ClassName)"
            Write-Host "[INFO] Handle : $ListHandle"
            Write-Host ""


            # ========================================================
            # 6 - CANTIDAD DE FILAS
            # ========================================================

            $CantidadEmpresas =
                [NativeListView]::GetItemCount(
                    $ListHandle
                )


            Write-Host "[INFO] Empresas detectadas en la grilla: $CantidadEmpresas"


            if ($CantidadEmpresas -le 0) {

                throw "La grilla fue detectada pero no contiene empresas."
            }


            # ========================================================
            # 7 - ESTADO INICIAL
            # ========================================================

            Write-Host ""
            Write-Host "[5] Estado inicial..."
            Write-Host ""


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                Write-Host "[INFO] Fila $($i + 1) - Estado inicial: $Estado"
            }


            # ========================================================
            # 8 - MARCAR TODAS
            # ========================================================

            Write-Host ""
            Write-Host "[6] Marcando todas las empresas..."
            Write-Host ""


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if ($Estado -eq 2) {

                    Write-Host "[OK] Fila $($i + 1) ya estaba marcada."

                    continue
                }


                Write-Host "[INFO] Marcando fila $($i + 1)..."


                $Resultado =
                    [NativeListView]::SetChecked(
                        $ListHandle,
                        $i,
                        $true
                    )


                if (-not $Resultado) {

                    throw "No fue posible marcar la fila $($i + 1)."
                }


                Start-Sleep -Milliseconds 150
            }


            # ========================================================
            # 9 - VERIFICACION
            # ========================================================

            Write-Host ""
            Write-Host "[7] Verificando seleccion..."
            Write-Host ""


            $Marcadas =
                0


            $NoMarcadas =
                0


            for (
                $i = 0;
                $i -lt $CantidadEmpresas;
                $i++
            ) {

                $Estado =
                    [NativeListView]::GetCheckState(
                        $ListHandle,
                        $i
                    )


                if ($Estado -eq 2) {

                    $Marcadas++

                    Write-Host "[OK] Fila $($i + 1) marcada."
                }
                else {

                    $NoMarcadas++

                    Write-Host "[ERROR] Fila $($i + 1) NO marcada. Estado=$Estado"
                }
            }


            # ========================================================
            # RESULTADO
            # ========================================================

            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " RESULTADO DE LA PRUEBA"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Servidor            : $env:COMPUTERNAME"
            Write-Host "Empresas detectadas : $CantidadEmpresas"
            Write-Host "Empresas marcadas   : $Marcadas"
            Write-Host "No marcadas         : $NoMarcadas"
            Write-Host ""


            if ($Marcadas -ne $CantidadEmpresas) {

                throw "No quedaron seleccionadas todas las empresas."
            }


            Write-Host "=========================================================="
            Write-Host " OK - TODAS LAS EMPRESAS QUEDARON MARCADAS"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "[TEST] NO se ejecuta Convertir."
            Write-Host ""
            Write-Host "[DEBUG] Config quedara abierto durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Revise visualmente los checks."
            Write-Host ""


            # ========================================================
            # MANTENER CONFIG ABIERTO
            # ========================================================

            if ($DebugPauseMinutes -gt 0) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            Write-Host ""
            Write-Host "[OK] Prueba finalizada correctamente."
            Write-Host ""

            exit 0
        }


        # ============================================================
        # ERROR / DEBUG
        # ============================================================

        catch {

            $MensajeError =
                $_.Exception.Message


            Write-Host ""
            Write-Host "=========================================================="
            Write-Host " ERROR DURANTE LA AUTOMATIZACION"
            Write-Host "=========================================================="
            Write-Host ""
            Write-Host "Error:"
            Write-Host $MensajeError
            Write-Host ""


            $ProcesosConfig =
                Get-Process `
                    -Name "cwConfig" `
                    -ErrorAction SilentlyContinue


            if ($ProcesosConfig) {

                Write-Host "[DEBUG] cwConfig.exe continua abierto."

                foreach ($Proceso in $ProcesosConfig) {

                    Write-Host "[DEBUG] PID cwConfig: $($Proceso.Id)"
                }
            }
            else {

                Write-Host "[WARN] cwConfig.exe no aparece como proceso activo."
            }


            Write-Host ""
            Write-Host "[DEBUG] El job permanecera activo durante $DebugPauseMinutes minutos."
            Write-Host "[DEBUG] Puede revisar manualmente la ventana de Configuracion."
            Write-Host ""


            if ($DebugPauseMinutes -gt 0) {

                Start-Sleep `
                    -Seconds ($DebugPauseMinutes * 60)
            }


            throw $MensajeError
        }
