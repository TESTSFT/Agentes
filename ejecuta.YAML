trigger: none

pool:
  name: 'Softland-QA'

steps:
- powershell: |
    # ============================================================
    # LIBRERÍAS
    # ============================================================

    Add-Type -AssemblyName System.Windows.Forms
    Add-Type -AssemblyName UIAutomationClient
    Add-Type -AssemblyName UIAutomationTypes


    # ============================================================
    # VALIDAR QUE EL AGENTE ESTÉ ELEVADO COMO ADMINISTRADOR
    # ============================================================

    Write-Host "=============================================="
    Write-Host "VALIDANDO AGENTE SELF-HOSTED"
    Write-Host "=============================================="
    Write-Host "Equipo: $env:COMPUTERNAME"
    Write-Host "Usuario: $env:USERNAME"
    Write-Host "Session ID: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"

    $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
    $principal = New-Object Security.Principal.WindowsPrincipal($identity)

    $esAdmin = $principal.IsInRole(
        [Security.Principal.WindowsBuiltInRole]::Administrator
    )

    Write-Host "Ejecutando elevado como Administrador: $esAdmin"

    if (-not $esAdmin) {
        throw "El Azure DevOps Agent no está ejecutando el pipeline como Administrador. Inicie run.cmd desde una consola elevada."
    }


    # ============================================================
    # FUNCIONES NATIVAS DE WINDOWS
    # ============================================================

    Add-Type @"
    using System;
    using System.Text;
    using System.Runtime.InteropServices;

    public static class Win32 {
        public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

        [DllImport("user32.dll")]
        public static extern bool EnumWindows(
            EnumWindowsProc lpEnumFunc,
            IntPtr lParam
        );

        [DllImport("user32.dll")]
        public static extern bool IsWindowVisible(IntPtr hWnd);

        [DllImport("user32.dll")]
        public static extern bool IsWindow(IntPtr hWnd);

        [DllImport("user32.dll")]
        public static extern int GetWindowTextLength(IntPtr hWnd);

        [DllImport("user32.dll", CharSet = CharSet.Unicode)]
        public static extern int GetWindowText(
            IntPtr hWnd,
            StringBuilder lpString,
            int nMaxCount
        );

        [DllImport("user32.dll")]
        public static extern uint GetWindowThreadProcessId(
            IntPtr hWnd,
            out uint lpdwProcessId
        );

        [DllImport("user32.dll")]
        public static extern bool SetForegroundWindow(IntPtr hWnd);

        [DllImport("user32.dll")]
        public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);
    }
    "@


    # ============================================================
    # OBTENER PROCESOS HIJOS DEL INSTALADOR
    # ============================================================

    function Get-ProcessTreeIds {
        param(
            [Parameter(Mandatory = $true)]
            [int]$RootProcessId
        )

        $ids = New-Object System.Collections.Generic.HashSet[int]
        [void]$ids.Add($RootProcessId)

        try {
            $procesos = Get-CimInstance Win32_Process
        }
        catch {
            Write-Host "No se pudo consultar Win32_Process: $_"
            return @($RootProcessId)
        }

        $encontro = $true

        while ($encontro) {
            $encontro = $false

            foreach ($proceso in $procesos) {
                if (
                    $ids.Contains([int]$proceso.ParentProcessId) -and
                    -not $ids.Contains([int]$proceso.ProcessId)
                ) {
                    [void]$ids.Add([int]$proceso.ProcessId)
                    $encontro = $true
                }
            }
        }

        return @($ids)
    }


    # ============================================================
    # OBTENER VENTANAS VISIBLES DE LOS PROCESOS
    # ============================================================

    function Get-VisibleWindows {
        param(
            [int[]]$ProcessIds
        )

        $pidSet = New-Object System.Collections.Generic.HashSet[int]

        foreach ($id in $ProcessIds) {
            [void]$pidSet.Add($id)
        }

        $resultado = New-Object System.Collections.Generic.List[object]

        $callback = [Win32+EnumWindowsProc]{
            param(
                [IntPtr]$hWnd,
                [IntPtr]$lParam
            )

            if ([Win32]::IsWindowVisible($hWnd)) {
                [uint32]$windowPid = 0

                [void][Win32]::GetWindowThreadProcessId(
                    $hWnd,
                    [ref]$windowPid
                )

                if ($pidSet.Contains([int]$windowPid)) {
                    $length = [Win32]::GetWindowTextLength($hWnd)
                    $titulo = ""

                    if ($length -gt 0) {
                        $sb = New-Object System.Text.StringBuilder ($length + 1)

                        [void][Win32]::GetWindowText(
                            $hWnd,
                            $sb,
                            $sb.Capacity
                        )

                        $titulo = $sb.ToString()
                    }

                    $resultado.Add(
                        [PSCustomObject]@{
                            Handle    = $hWnd
                            ProcessId = [int]$windowPid
                            Title     = $titulo
                        }
                    )
                }
            }

            return $true
        }

        [void][Win32]::EnumWindows(
            $callback,
            [IntPtr]::Zero
        )

        return $resultado
    }


    # ============================================================
    # ESPERAR PRIMERA VENTANA DEL INSTALADOR
    # ============================================================

    function Wait-InstallerWindow {
        param(
            [int]$RootProcessId,
            [int]$TimeoutSeconds = 120
        )

        Write-Host "Esperando ventana inicial del instalador..."

        $limite = (Get-Date).AddSeconds($TimeoutSeconds)

        while ((Get-Date) -lt $limite) {
            $pids = Get-ProcessTreeIds -RootProcessId $RootProcessId
            $ventanas = Get-VisibleWindows -ProcessIds $pids

            if ($ventanas.Count -gt 0) {
                $ventana = $ventanas | Select-Object -First 1

                Write-Host "Ventana encontrada: $($ventana.Title)"
                Write-Host "PID de ventana: $($ventana.ProcessId)"

                return $ventana
            }

            Start-Sleep -Seconds 1
        }

        throw "No se encontró la ventana inicial del instalador."
    }


    # ============================================================
    # BUSCAR VENTANA GLOBALMENTE POR TÍTULO
    # No depende del PID inicial del Setup.
    # ============================================================

    function Get-WindowByTitle {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Title,

            [long]$ExcludeHandle = 0
        )

        $resultado = New-Object System.Collections.Generic.List[object]

        $callback = [Win32+EnumWindowsProc]{
            param(
                [IntPtr]$hWnd,
                [IntPtr]$lParam
            )

            if ([Win32]::IsWindowVisible($hWnd)) {
                $length = [Win32]::GetWindowTextLength($hWnd)

                if ($length -gt 0) {
                    $sb = New-Object System.Text.StringBuilder ($length + 1)

                    [void][Win32]::GetWindowText(
                        $hWnd,
                        $sb,
                        $sb.Capacity
                    )

                    $titulo = $sb.ToString()

                    if (
                        $titulo -eq $Title -and
                        $hWnd.ToInt64() -ne $ExcludeHandle
                    ) {
                        [uint32]$windowPid = 0

                        [void][Win32]::GetWindowThreadProcessId(
                            $hWnd,
                            [ref]$windowPid
                        )

                        $resultado.Add(
                            [PSCustomObject]@{
                                Handle    = $hWnd
                                ProcessId = [int]$windowPid
                                Title     = $titulo
                            }
                        )
                    }
                }
            }

            return $true
        }

        [void][Win32]::EnumWindows(
            $callback,
            [IntPtr]::Zero
        )

        return $resultado | Select-Object -First 1
    }


    # ============================================================
    # ESPERAR VENTANA GLOBAL POR TÍTULO
    # ============================================================

    function Wait-WindowGlobal {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Title,

            [int]$TimeoutSeconds = 2700,

            [long]$ExcludeHandle = 0
        )

        Write-Host ""
        Write-Host "Esperando ventana:"
        Write-Host $Title

        $limite = (Get-Date).AddSeconds($TimeoutSeconds)

        while ((Get-Date) -lt $limite) {
            $ventana = Get-WindowByTitle `
                -Title $Title `
                -ExcludeHandle $ExcludeHandle

            if ($ventana) {
                Write-Host ""
                Write-Host "VENTANA DETECTADA"
                Write-Host "Título: $($ventana.Title)"
                Write-Host "PID: $($ventana.ProcessId)"
                Write-Host "Handle: $($ventana.Handle)"

                return $ventana
            }

            Write-Host "$(Get-Date -Format 'HH:mm:ss') - Esperando '$Title'..."

            Start-Sleep -Seconds 2
        }

        throw "No apareció la ventana '$Title'."
    }


    # ============================================================
    # ACTIVAR UNA VENTANA
    # ============================================================

    function Activate-Window {
        param(
            [Parameter(Mandatory = $true)]
            $Window
        )

        [void][Win32]::ShowWindowAsync(
            $Window.Handle,
            9
        )

        Start-Sleep -Milliseconds 500

        $activada = [Win32]::SetForegroundWindow(
            $Window.Handle
        )

        if (-not $activada) {
            try {
                $wshell = New-Object -ComObject WScript.Shell

                $activada = $wshell.AppActivate(
                    [int]$Window.ProcessId
                )
            }
            catch {
                $activada = $false
            }
        }

        Write-Host "Resultado activación: $activada"

        Start-Sleep -Milliseconds 700
    }


    # ============================================================
    # ACTIVAR VENTANA Y ENVIAR ENTER
    # ============================================================

    function Activate-And-Enter {
        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [string]$Description = "ventana"
        )

        Write-Host "Activando $Description..."

        Activate-Window -Window $Window

        try {
            [System.Windows.Forms.SendKeys]::SendWait(
                "{ENTER}"
            )

            Write-Host "ENTER enviado a $Description."
        }
        catch {
            throw "No se pudo enviar ENTER a '$Description'. Windows devolvió: $($_.Exception.Message)"
        }
    }


    # ============================================================
    # ENVIAR TECLA CON DIAGNÓSTICO
    # ============================================================

    function Send-KeySafe {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Keys,

            [string]$Description = $Keys
        )

        try {
            Write-Host "Enviando: $Description"

            [System.Windows.Forms.SendKeys]::SendWait(
                $Keys
            )
        }
        catch {
            throw "No se pudo enviar '$Description'. Windows devolvió: $($_.Exception.Message). Verifique que Agent.Listener.exe y Agent.Worker.exe estén elevados."
        }
    }


    # ============================================================
    # VALIDAR CONTRASEÑA Y RUTA
    # ============================================================

    if ([string]::IsNullOrWhiteSpace($env:SETUP_PASSWORD)) {
        throw "No se encuentra definida la variable secreta SETUP_PASSWORD / SetupPassword."
    }

    if (-not (Test-Path "C:\Release")) {
        throw "La carpeta C:\Release no existe en el equipo $env:COMPUTERNAME."
    }


    # ============================================================
    # BUSCAR EL SETUP
    # ============================================================

    $archivoExe = Get-ChildItem `
        -Path "C:\Release" `
        -Filter "*.exe" `
        -File |
        Select-Object -First 1

    if (-not $archivoExe) {
        throw "No se encontró ningún archivo .exe en C:\Release."
    }

    Write-Host ""
    Write-Host "Instalador encontrado: $($archivoExe.FullName)"


    # ============================================================
    # EJECUTAR INSTALADOR
    # ============================================================

    $instalador = Start-Process `
        -FilePath $archivoExe.FullName `
        -PassThru

    Write-Host "Instalador iniciado: $($archivoExe.FullName)"
    Write-Host "PID inicial: $($instalador.Id)"


    # ============================================================
    # ESPERAR VENTANA INICIAL
    # ============================================================

    $ventanaInicial = Wait-InstallerWindow `
        -RootProcessId $instalador.Id `
        -TimeoutSeconds 120

    Activate-Window `
        -Window $ventanaInicial


    # ============================================================
    # PASOS INICIALES DEL INSTALADOR
    # ============================================================

    Write-Host "Avanzando pantalla inicial..."

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER inicial"

    Start-Sleep -Seconds 5


    # Primer checkbox
    Write-Host "Seleccionando primera opción..."

    Activate-Window `
        -Window $ventanaInicial

    Send-KeySafe `
        -Keys "{TAB}" `
        -Description "TAB primer checkbox"

    Send-KeySafe `
        -Keys " " `
        -Description "ESPACIO primer checkbox"

    Start-Sleep -Seconds 1

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER confirmar primer checkbox"


    # Segundo checkbox
    Start-Sleep -Seconds 5

    Write-Host "Seleccionando segunda opción..."

    Activate-Window `
        -Window $ventanaInicial

    Send-KeySafe `
        -Keys "{TAB}" `
        -Description "TAB segundo checkbox"

    Send-KeySafe `
        -Keys " " `
        -Description "ESPACIO segundo checkbox"

    Start-Sleep -Seconds 1

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER confirmar segundo checkbox"


    # Comenzar instalación
    Start-Sleep -Seconds 1

    Write-Host "Iniciando instalación..."

    Activate-Window `
        -Window $ventanaInicial

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER iniciar instalación"


    # ============================================================
    # ESPERA CORTA INICIAL
    # ============================================================

    Write-Host ""
    Write-Host "Instalación trabajando..."

    Start-Sleep -Seconds 20


    # ============================================================
    # 1 - ESPERAR "Actualización de bases de datos"
    # Busca en TODO Windows y no sólo en el PID inicial.
    # ============================================================

    $ventanaBD = Wait-WindowGlobal `
        -Title "Actualización de bases de datos" `
        -TimeoutSeconds 2700


    # ============================================================
    # 2 - ACEPTAR ACTUALIZACIÓN DE BASES
    # ============================================================

    Activate-And-Enter `
        -Window $ventanaBD `
        -Description "Actualización de bases de datos"


    # ============================================================
    # 3 - ESPERAR "Ingrese la contraseña"
    # ============================================================

    $ventanaPassword = Wait-WindowGlobal `
        -Title "Ingrese la contraseña" `
        -TimeoutSeconds 120

    Write-Host ""
    Write-Host "Ventana de contraseña detectada."


    # ============================================================
    # ACTIVAR VENTANA DE CONTRASEÑA
    # ============================================================

    Activate-Window `
        -Window $ventanaPassword


    # ============================================================
    # BUSCAR CAMPO DE CONTRASEÑA
    # ============================================================

    $elementoPassword =
        [System.Windows.Automation.AutomationElement]::FromHandle(
            $ventanaPassword.Handle
        )

    $editCondition = New-Object `
        System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
            [System.Windows.Automation.ControlType]::Edit
        )

    $campos = $elementoPassword.FindAll(
        [System.Windows.Automation.TreeScope]::Descendants,
        $editCondition
    )

    $campoPassword = $null

    foreach ($campo in $campos) {
        try {
            if ($campo.Current.IsPassword) {
                $campoPassword = $campo
                break
            }
        }
        catch {
        }
    }


    # ============================================================
    # FALLBACK PARA CONTROLES ANTIGUOS
    # Campo 1 = Usuario
    # Campo 2 = Contraseña
    # ============================================================

    if (
        $null -eq $campoPassword -and
        $campos.Count -ge 2
    ) {
        Write-Host "El control no expone IsPassword."
        Write-Host "Utilizando el último campo Edit."

        $campoPassword =
            $campos.Item(
                $campos.Count - 1
            )
    }

    if ($null -eq $campoPassword) {
        throw "No se encontró el campo de contraseña."
    }


    # ============================================================
    # INGRESAR CONTRASEÑA
    # ============================================================

    Write-Host "Ingresando contraseña..."

    $passwordOK = $false

    try {
        $valuePattern =
            $campoPassword.GetCurrentPattern(
                [System.Windows.Automation.ValuePattern]::Pattern
            )

        $valuePattern.SetValue(
            $env:SETUP_PASSWORD
        )

        $passwordOK = $true

        Write-Host "Contraseña ingresada mediante UI Automation."
    }
    catch {
        Write-Host "ValuePattern no disponible. Usando portapapeles."
    }

    if (-not $passwordOK) {
        $campoPassword.SetFocus()

        Start-Sleep -Milliseconds 500

        Set-Clipboard `
            -Value $env:SETUP_PASSWORD

        try {
            Send-KeySafe `
                -Keys "^v" `
                -Description "pegar contraseña"
        }
        finally {
            Start-Sleep -Milliseconds 500
            Set-Clipboard -Value ""
        }
    }

    Start-Sleep -Seconds 1


    # ============================================================
    # 4 - ACEPTAR CONTRASEÑA
    # ============================================================

    Activate-And-Enter `
        -Window $ventanaPassword `
        -Description "Ingrese la contraseña"


    # ============================================================
    # 5 - PRIMERA CONFIRMACIÓN
    # "Configuración del Sistema de Gestión" -> SÍ
    # ============================================================

    $confirmacion1 = Wait-WindowGlobal `
        -Title "Configuración del Sistema de Gestión" `
        -TimeoutSeconds 120

    $handlePrimera =
        $confirmacion1.Handle.ToInt64()

    Activate-And-Enter `
        -Window $confirmacion1 `
        -Description "Primera confirmación - Sí"


    # ============================================================
    # ESPERAR QUE LA PRIMERA CONFIRMACIÓN DESAPAREZCA
    # ============================================================

    Write-Host "Esperando cierre de la primera confirmación..."

    $limiteCierre =
        (Get-Date).AddSeconds(30)

    while (
        (Get-Date) -lt $limiteCierre -and
        [Win32]::IsWindow(
            [IntPtr]$handlePrimera
        )
    ) {
        Start-Sleep -Milliseconds 500
    }


    # ============================================================
    # 6 - SEGUNDA CONFIRMACIÓN
    # "Configuración del Sistema de Gestión" -> SÍ
    # ============================================================

    $confirmacion2 = Wait-WindowGlobal `
        -Title "Configuración del Sistema de Gestión" `
        -TimeoutSeconds 120 `
        -ExcludeHandle $handlePrimera

    Activate-And-Enter `
        -Window $confirmacion2 `
        -Description "Segunda confirmación - Sí"


    # ============================================================
    # FINAL
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "AUTOMATIZACIÓN COMPLETADA"
    Write-Host "=============================================="

  env:
    SETUP_PASSWORD: $(SetupPassword)

  displayName: 'Ejecutar Setup Softland en equipo QA'
