steps:

- powershell: |

    Write-Host "=============================================="
    Write-Host "EJECUTA SETUP - VERSION PASSWORD THUNDERRT6 V6"
    Write-Host "=============================================="


    # ============================================================
    # LIBRERIAS
    # ============================================================

    Add-Type -AssemblyName System.Windows.Forms
    Add-Type -AssemblyName UIAutomationClient
    Add-Type -AssemblyName UIAutomationTypes


    # ============================================================
    # VALIDAR AGENTE COMO ADMINISTRADOR
    # ============================================================

    Write-Host "=============================================="
    Write-Host "VALIDANDO AGENTE SELF-HOSTED"
    Write-Host "=============================================="
    Write-Host "Equipo: $env:COMPUTERNAME"
    Write-Host "Usuario: $env:USERNAME"
    Write-Host "Session ID: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"


    $identity =
        [Security.Principal.WindowsIdentity]::GetCurrent()


    $principal =
        New-Object Security.Principal.WindowsPrincipal(
            $identity
        )


    $esAdmin =
        $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
        )


    Write-Host "Ejecutando elevado como Administrador: $esAdmin"


    if (-not $esAdmin) {

        throw "El Azure DevOps Agent no esta ejecutando el pipeline como Administrador."
    }


    # ============================================================
    # API WIN32
    #
    # Incluye ahora la misma tecnica que funciono en cwConfig:
    #
    # - deteccion del ThunderRT6TextBox correcto
    # - click fisico
    # - WM_CHAR
    # - fallback SendInput
    # ============================================================

    Add-Type @"
    using System;
    using System.Text;
    using System.Runtime.InteropServices;
    using System.Threading;

    public static class Win32
    {
        public const uint WM_CHAR = 0x0102;
        public const uint WM_CLEAR = 0x0303;
        public const uint EM_SETSEL = 0x00B1;

        public const int GWL_STYLE = -16;
        public const long ES_PASSWORD = 0x0020;

        public const uint INPUT_KEYBOARD = 1;

        public const uint KEYEVENTF_KEYUP = 0x0002;
        public const uint KEYEVENTF_UNICODE = 0x0004;

        public const ushort VK_CONTROL = 0x11;
        public const ushort VK_A = 0x41;
        public const ushort VK_BACK = 0x08;

        public const uint MOUSEEVENTF_LEFTDOWN = 0x0002;
        public const uint MOUSEEVENTF_LEFTUP = 0x0004;


        public delegate bool EnumWindowsProc(
            IntPtr hWnd,
            IntPtr lParam
        );


        public delegate bool EnumChildWindowsProc(
            IntPtr hWnd,
            IntPtr lParam
        );


        [StructLayout(LayoutKind.Sequential)]
        public struct RECT
        {
            public int Left;
            public int Top;
            public int Right;
            public int Bottom;
        }


        [StructLayout(LayoutKind.Sequential)]
        public struct INPUT
        {
            public uint type;
            public InputUnion U;
        }


        [StructLayout(LayoutKind.Explicit)]
        public struct InputUnion
        {
            [FieldOffset(0)]
            public KEYBDINPUT ki;
        }


        [StructLayout(LayoutKind.Sequential)]
        public struct KEYBDINPUT
        {
            public ushort wVk;
            public ushort wScan;
            public uint dwFlags;
            public uint time;
            public UIntPtr dwExtraInfo;
        }


        [DllImport("user32.dll")]
        public static extern bool EnumWindows(
            EnumWindowsProc lpEnumFunc,
            IntPtr lParam
        );


        [DllImport("user32.dll")]
        public static extern bool IsWindowVisible(
            IntPtr hWnd
        );


        [DllImport("user32.dll")]
        public static extern bool IsWindow(
            IntPtr hWnd
        );


        [DllImport("user32.dll")]
        public static extern int GetWindowTextLength(
            IntPtr hWnd
        );


        [DllImport(
            "user32.dll",
            CharSet = CharSet.Unicode
        )]
        public static extern int GetWindowText(
            IntPtr hWnd,
            StringBuilder lpString,
            int nMaxCount
        );


        [DllImport("user32.dll")]
        public static extern uint GetWindowThreadProcessId(
            IntPtr hWnd,
            out uint lpdwProcessId
        );


        [DllImport("user32.dll")]
        public static extern bool SetForegroundWindow(
            IntPtr hWnd
        );


        [DllImport("user32.dll")]
        public static extern bool ShowWindowAsync(
            IntPtr hWnd,
            int nCmdShow
        );


        [DllImport("user32.dll")]
        public static extern IntPtr SetFocus(
            IntPtr hWnd
        );


        [DllImport("user32.dll")]
        public static extern bool EnumChildWindows(
            IntPtr hWndParent,
            EnumChildWindowsProc lpEnumFunc,
            IntPtr lParam
        );


        [DllImport("user32.dll")]
        public static extern bool IsWindowEnabled(
            IntPtr hWnd
        );


        [DllImport(
            "user32.dll",
            CharSet = CharSet.Unicode
        )]
        public static extern int GetClassName(
            IntPtr hWnd,
            StringBuilder lpClassName,
            int nMaxCount
        );


        [DllImport("user32.dll")]
        public static extern IntPtr SendMessage(
            IntPtr hWnd,
            uint Msg,
            IntPtr wParam,
            IntPtr lParam
        );


        [DllImport(
            "user32.dll",
            CharSet = CharSet.Unicode,
            EntryPoint = "SendMessage"
        )]
        public static extern IntPtr SendMessageText(
            IntPtr hWnd,
            uint Msg,
            IntPtr wParam,
            string lParam
        );


        [DllImport("user32.dll")]
        public static extern int GetWindowLong(
            IntPtr hWnd,
            int nIndex
        );


        [DllImport("user32.dll")]
        public static extern bool GetWindowRect(
            IntPtr hWnd,
            out RECT lpRect
        );


        [DllImport("user32.dll")]
        public static extern bool SetCursorPos(
            int X,
            int Y
        );


        [DllImport("user32.dll")]
        public static extern void mouse_event(
            uint dwFlags,
            uint dx,
            uint dy,
            uint dwData,
            UIntPtr dwExtraInfo
        );


        [DllImport(
            "user32.dll",
            SetLastError = true
        )]
        static extern uint SendInput(
            uint nInputs,
            INPUT[] pInputs,
            int cbSize
        );


        // ========================================================
        // CLICK FISICO
        // ========================================================

        public static bool PhysicalClick(
            IntPtr hWnd
        )
        {
            if (
                hWnd == IntPtr.Zero ||
                !IsWindow(hWnd)
            )
            {
                return false;
            }


            RECT rect;


            if (
                !GetWindowRect(
                    hWnd,
                    out rect
                )
            )
            {
                return false;
            }


            int x =
                rect.Left +
                (
                    (
                        rect.Right -
                        rect.Left
                    ) / 2
                );


            int y =
                rect.Top +
                (
                    (
                        rect.Bottom -
                        rect.Top
                    ) / 2
                );


            SetCursorPos(
                x,
                y
            );


            Thread.Sleep(150);


            mouse_event(
                MOUSEEVENTF_LEFTDOWN,
                0,
                0,
                0,
                UIntPtr.Zero
            );


            mouse_event(
                MOUSEEVENTF_LEFTUP,
                0,
                0,
                0,
                UIntPtr.Zero
            );


            Thread.Sleep(250);


            return true;
        }


        // ========================================================
        // METODO PRINCIPAL
        //
        // WM_CHAR
        //
        // Este es el metodo que funciono en cwConfig.
        // ========================================================

        public static bool TypeTextByMessages(
            IntPtr dialog,
            IntPtr edit,
            string value
        )
        {
            if (
                dialog == IntPtr.Zero ||
                edit == IntPtr.Zero ||
                !IsWindow(edit)
            )
            {
                return false;
            }


            SetForegroundWindow(
                dialog
            );


            Thread.Sleep(250);


            PhysicalClick(
                edit
            );


            Thread.Sleep(250);


            SetFocus(
                edit
            );


            Thread.Sleep(150);


            // Seleccionar todo

            SendMessage(
                edit,
                EM_SETSEL,
                IntPtr.Zero,
                new IntPtr(-1)
            );


            Thread.Sleep(100);


            // Limpiar

            SendMessage(
                edit,
                WM_CLEAR,
                IntPtr.Zero,
                IntPtr.Zero
            );


            Thread.Sleep(100);


            // Escribir caracter por caracter

            foreach (
                char character in
                value.ToCharArray()
            )
            {
                SendMessage(
                    edit,
                    WM_CHAR,
                    new IntPtr(
                        (int)character
                    ),
                    IntPtr.Zero
                );


                Thread.Sleep(40);
            }


            Thread.Sleep(700);


            return true;
        }


        static void SendVirtualKey(
            ushort key,
            bool keyUp
        )
        {
            INPUT input =
                new INPUT();


            input.type =
                INPUT_KEYBOARD;


            input.U.ki.wVk =
                key;


            input.U.ki.wScan =
                0;


            input.U.ki.dwFlags =
                keyUp
                ? KEYEVENTF_KEYUP
                : 0;


            input.U.ki.time =
                0;


            input.U.ki.dwExtraInfo =
                UIntPtr.Zero;


            SendInput(
                1,
                new INPUT[] { input },
                Marshal.SizeOf(
                    typeof(INPUT)
                )
            );
        }


        static void SendUnicodeCharacter(
            char character,
            bool keyUp
        )
        {
            INPUT input =
                new INPUT();


            input.type =
                INPUT_KEYBOARD;


            input.U.ki.wVk =
                0;


            input.U.ki.wScan =
                character;


            input.U.ki.dwFlags =
                KEYEVENTF_UNICODE |
                (
                    keyUp
                    ? KEYEVENTF_KEYUP
                    : 0
                );


            input.U.ki.time =
                0;


            input.U.ki.dwExtraInfo =
                UIntPtr.Zero;


            SendInput(
                1,
                new INPUT[] { input },
                Marshal.SizeOf(
                    typeof(INPUT)
                )
            );
        }


        // ========================================================
        // FALLBACK
        //
        // CLICK FISICO + SENDINPUT
        // ========================================================

        public static bool TypeTextBySendInput(
            IntPtr dialog,
            IntPtr edit,
            string value
        )
        {
            if (
                dialog == IntPtr.Zero ||
                edit == IntPtr.Zero ||
                !IsWindow(edit)
            )
            {
                return false;
            }


            SetForegroundWindow(
                dialog
            );


            Thread.Sleep(250);


            PhysicalClick(
                edit
            );


            Thread.Sleep(300);


            SetFocus(
                edit
            );


            Thread.Sleep(150);


            // CTRL + A

            SendVirtualKey(
                VK_CONTROL,
                false
            );


            SendVirtualKey(
                VK_A,
                false
            );


            SendVirtualKey(
                VK_A,
                true
            );


            SendVirtualKey(
                VK_CONTROL,
                true
            );


            Thread.Sleep(100);


            // BACKSPACE

            SendVirtualKey(
                VK_BACK,
                false
            );


            SendVirtualKey(
                VK_BACK,
                true
            );


            Thread.Sleep(100);


            foreach (
                char character in
                value.ToCharArray()
            )
            {
                SendUnicodeCharacter(
                    character,
                    false
                );


                SendUnicodeCharacter(
                    character,
                    true
                );


                Thread.Sleep(40);
            }


            Thread.Sleep(700);


            return true;
        }
    }
    "@


    # ============================================================
    # NORMALIZAR TEXTO
    # ============================================================

    function Normalize-UiText {

        param(
            [string]$Text
        )


        if (
            $null -eq $Text
        ) {

            return ""
        }


        $formD =
            $Text.Normalize(
                [System.Text.NormalizationForm]::FormD
            )


        $builder =
            New-Object System.Text.StringBuilder


        foreach (
            $char in
            $formD.ToCharArray()
        ) {

            $category =
                [System.Globalization.CharUnicodeInfo]::GetUnicodeCategory(
                    $char
                )


            if (
                $category -ne
                [System.Globalization.UnicodeCategory]::NonSpacingMark
            ) {

                [void]$builder.Append(
                    $char
                )
            }
        }


        return $builder.ToString().Normalize(
            [System.Text.NormalizationForm]::FormC
        ).Trim().ToLowerInvariant()
    }


    # ============================================================
    # BUSCAR VENTANA GLOBALMENTE POR TITULO
    # ============================================================

    function Get-WindowByTitle {

        param(
            [Parameter(Mandatory = $true)]
            [string]$Title,

            [long]$ExcludeHandle = 0
        )


        $resultado =
            New-Object System.Collections.Generic.List[object]


        $tituloBuscado =
            Normalize-UiText $Title


        $callback =
            [Win32+EnumWindowsProc]{

                param(
                    [IntPtr]$hWnd,
                    [IntPtr]$lParam
                )


                if (
                    [Win32]::IsWindowVisible(
                        $hWnd
                    )
                ) {

                    $length =
                        [Win32]::GetWindowTextLength(
                            $hWnd
                        )


                    if (
                        $length -gt 0
                    ) {

                        $sb =
                            New-Object System.Text.StringBuilder (
                                $length + 1
                            )


                        [void][Win32]::GetWindowText(
                            $hWnd,
                            $sb,
                            $sb.Capacity
                        )


                        $titulo =
                            $sb.ToString()


                        if (
                            (Normalize-UiText $titulo) -eq
                            $tituloBuscado -and

                            $hWnd.ToInt64() -ne
                            $ExcludeHandle
                        ) {

                            [uint32]$windowPid =
                                0


                            [void][Win32]::GetWindowThreadProcessId(
                                $hWnd,
                                [ref]$windowPid
                            )


                            $resultado.Add(
                                [PSCustomObject]@{
                                    Handle    = $hWnd
                                    ProcessId = [int]$windowPid
                                    Title     = $titulo
                                }
                            )
                        }
                    }
                }


                return $true
            }


        [void][Win32]::EnumWindows(
            $callback,
            [IntPtr]::Zero
        )


        return $resultado |
            Select-Object -First 1
    }


    # ============================================================
    # ESPERAR VENTANA GLOBAL
    # ============================================================

    function Wait-WindowGlobal {

        param(
            [Parameter(Mandatory = $true)]
            [string]$Title,

            [int]$TimeoutSeconds = 2700,

            [long]$ExcludeHandle = 0
        )


        Write-Host ""
        Write-Host "Esperando ventana: '$Title'"


        $limite =
            (Get-Date).AddSeconds(
                $TimeoutSeconds
            )


        while (
            (Get-Date) -lt
            $limite
        ) {

            $ventana =
                Get-WindowByTitle `
                    -Title $Title `
                    -ExcludeHandle $ExcludeHandle


            if (
                $ventana
            ) {

                Write-Host ""
                Write-Host "VENTANA DETECTADA"
                Write-Host "Titulo: $($ventana.Title)"
                Write-Host "PID: $($ventana.ProcessId)"
                Write-Host "Handle: $($ventana.Handle)"


                return $ventana
            }


            Write-Host "$(Get-Date -Format 'HH:mm:ss') - Esperando '$Title'..."


            Start-Sleep -Seconds 2
        }


        throw "No aparecio la ventana '$Title'."
    }


    # ============================================================
    # ACTIVAR VENTANA
    # ============================================================

    function Activate-Window {

        param(
            [Parameter(Mandatory = $true)]
            $Window
        )


        [void][Win32]::ShowWindowAsync(
            $Window.Handle,
            9
        )


        Start-Sleep -Milliseconds 500


        $activada =
            [Win32]::SetForegroundWindow(
                $Window.Handle
            )


        if (
            -not $activada
        ) {

            try {

                $wshell =
                    New-Object -ComObject WScript.Shell


                $activada =
                    $wshell.AppActivate(
                        [int]$Window.ProcessId
                    )
            }
            catch {

                $activada =
                    $false
            }
        }


        Write-Host "Resultado activacion: $activada"


        Start-Sleep -Milliseconds 700
    }


    # ============================================================
    # SENDKEYS
    # ============================================================

    function Send-KeySafe {

        param(
            [Parameter(Mandatory = $true)]
            [string]$Keys,

            [string]$Description = $Keys
        )


        try {

            Write-Host "Enviando: $Description"


            [System.Windows.Forms.SendKeys]::SendWait(
                $Keys
            )
        }
        catch {

            throw "No se pudo enviar '$Description'. Windows devolvio: $($_.Exception.Message)"
        }
    }


    # ============================================================
    # BOTON NATIVO
    # ============================================================

    function Get-NativeButtonByName {

        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [Parameter(Mandatory = $true)]
            [string]$ButtonName
        )


        $resultado =
            New-Object System.Collections.Generic.List[object]


        $nombreBuscado =
            Normalize-UiText $ButtonName


        $callback =
            [Win32+EnumChildWindowsProc]{

                param(
                    [IntPtr]$hWnd,
                    [IntPtr]$lParam
                )


                try {

                    $length =
                        [Win32]::GetWindowTextLength(
                            $hWnd
                        )


                    $texto = ""


                    if (
                        $length -gt 0
                    ) {

                        $sb =
                            New-Object System.Text.StringBuilder (
                                $length + 1
                            )


                        [void][Win32]::GetWindowText(
                            $hWnd,
                            $sb,
                            $sb.Capacity
                        )


                        $texto =
                            $sb.ToString()
                    }


                    $classSb =
                        New-Object System.Text.StringBuilder 256


                    [void][Win32]::GetClassName(
                        $hWnd,
                        $classSb,
                        $classSb.Capacity
                    )


                    $clase =
                        $classSb.ToString()


                    if (
                        $texto
                    ) {

                        Write-Host "Control Win32 encontrado: Clase=[$clase] Texto=[$texto]"
                    }


                    if (
                        (Normalize-UiText $texto) -eq
                        $nombreBuscado
                    ) {

                        $resultado.Add(
                            [PSCustomObject]@{
                                Handle  = $hWnd
                                Text    = $texto
                                Class   = $clase
                                Enabled = [Win32]::IsWindowEnabled($hWnd)
                            }
                        )
                    }
                }
                catch {
                }


                return $true
            }


        [void][Win32]::EnumChildWindows(
            $Window.Handle,
            $callback,
            [IntPtr]::Zero
        )


        return $resultado |
            Select-Object -First 1
    }


    # ============================================================
    # CLICK BOTON
    # ============================================================

    function Click-ButtonByName {

        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [Parameter(Mandatory = $true)]
            [string]$ButtonName,

            [int]$TimeoutSeconds = 30,

            [int]$PollSeconds = 2
        )


        $limite =
            (Get-Date).AddSeconds(
                $TimeoutSeconds
            )


        $nombreBuscado =
            Normalize-UiText $ButtonName


        $buttonCondition =
            New-Object `
                System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button
                )


        while (
            (Get-Date) -lt
            $limite
        ) {

            $botonEncontrado =
                $false


            # ----------------------------------------------------
            # METODO 1: UI AUTOMATION
            # ----------------------------------------------------

            try {

                $elementoVentana =
                    [System.Windows.Automation.AutomationElement]::FromHandle(
                        $Window.Handle
                    )


                if (
                    $null -ne
                    $elementoVentana
                ) {

                    $botones =
                        $elementoVentana.FindAll(
                            [System.Windows.Automation.TreeScope]::Descendants,
                            $buttonCondition
                        )


                    foreach (
                        $boton in
                        $botones
                    ) {

                        try {

                            $nombreBoton =
                                $boton.Current.Name


                            if (
                                (Normalize-UiText $nombreBoton) -eq
                                $nombreBuscado
                            ) {

                                $botonEncontrado =
                                    $true


                                if (
                                    -not
                                    $boton.Current.IsEnabled
                                ) {

                                    Write-Host "$(Get-Date -Format 'HH:mm:ss') - Boton '$ButtonName' visible pero deshabilitado. El instalador continua trabajando..."

                                    break
                                }


                                Write-Host "Boton '$ButtonName' habilitado mediante UI Automation."


                                try {

                                    $invokePattern =
                                        $boton.GetCurrentPattern(
                                            [System.Windows.Automation.InvokePattern]::Pattern
                                        )


                                    $invokePattern.Invoke()


                                    Write-Host "Click realizado sobre '$ButtonName' mediante UI Automation."


                                    return
                                }
                                catch {

                                    Write-Warning "InvokePattern fallo. Se intentara el control Win32."
                                }
                            }
                        }
                        catch {
                        }
                    }
                }
            }
            catch {

                Write-Host "UI Automation no pudo inspeccionar la ventana: $($_.Exception.Message)"
            }


            # ----------------------------------------------------
            # METODO 2: WIN32
            # ----------------------------------------------------

            $botonNativo =
                Get-NativeButtonByName `
                    -Window $Window `
                    -ButtonName $ButtonName


            if (
                $botonNativo
            ) {

                $botonEncontrado =
                    $true


                if (
                    -not
                    $botonNativo.Enabled
                ) {

                    Write-Host "$(Get-Date -Format 'HH:mm:ss') - Boton nativo '$ButtonName' visible pero deshabilitado. Esperando..."
                }
                else {

                    Write-Host ""
                    Write-Host "BOTON NATIVO HABILITADO"
                    Write-Host "Texto : $($botonNativo.Text)"
                    Write-Host "Clase : $($botonNativo.Class)"
                    Write-Host "Handle: $($botonNativo.Handle)"


                    [void][Win32]::SendMessage(
                        $botonNativo.Handle,
                        0x00F5,
                        [IntPtr]::Zero,
                        [IntPtr]::Zero
                    )


                    Write-Host "BM_CLICK enviado al boton '$ButtonName'."


                    Start-Sleep -Milliseconds 750


                    return
                }
            }


            if (
                -not
                $botonEncontrado
            ) {

                Write-Host "$(Get-Date -Format 'HH:mm:ss') - La ventana esta abierta pero todavia no se encontro el boton '$ButtonName'."
            }


            Start-Sleep -Seconds $PollSeconds
        }


        throw "El boton '$ButtonName' no quedo habilitado dentro de $TimeoutSeconds segundos."
    }


    # ============================================================
    # ESPERAR CIERRE
    # ============================================================

    function Wait-WindowClosed {

        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [int]$TimeoutSeconds = 30
        )


        $handle =
            [long]$Window.Handle.ToInt64()


        $limite =
            (Get-Date).AddSeconds(
                $TimeoutSeconds
            )


        while (
            (Get-Date) -lt
            $limite
        ) {

            if (
                -not (
                    [Win32]::IsWindow(
                        [IntPtr]$handle
                    )
                )
            ) {

                Write-Host "Ventana cerrada correctamente."

                return
            }


            Start-Sleep -Milliseconds 500
        }


        Write-Warning "La ventana no confirmo su cierre dentro del tiempo esperado."
    }


    # ============================================================
    # OBTENER TEXTBOX NATIVOS
    #
    # AHORA TAMBIEN OBTIENE LA POSICION EN PANTALLA.
    # ============================================================

    function Get-NativeTextBoxes {

        param(
            [Parameter(Mandatory = $true)]
            $Window
        )


        $resultado =
            New-Object System.Collections.Generic.List[object]


        $callback =
            [Win32+EnumChildWindowsProc]{

                param(
                    [IntPtr]$hWnd,
                    [IntPtr]$lParam
                )


                try {

                    $classSb =
                        New-Object System.Text.StringBuilder 256


                    [void][Win32]::GetClassName(
                        $hWnd,
                        $classSb,
                        $classSb.Capacity
                    )


                    $clase =
                        $classSb.ToString()


                    if (
                        $clase -match
                        "(?i)textbox|edit"
                    ) {

                        $length =
                            [Win32]::GetWindowTextLength(
                                $hWnd
                            )


                        $texto = ""


                        if (
                            $length -gt 0
                        ) {

                            $sb =
                                New-Object System.Text.StringBuilder (
                                    $length + 1
                                )


                            [void][Win32]::GetWindowText(
                                $hWnd,
                                $sb,
                                $sb.Capacity
                            )


                            $texto =
                                $sb.ToString()
                        }


                        $style =
                            [Win32]::GetWindowLong(
                                $hWnd,
                                -16
                            )


                        $esPassword =
                            (
                                (
                                    $style -band
                                    0x20
                                ) -ne 0
                            )


                        $rect =
                            New-Object Win32+RECT


                        $rectOk =
                            [Win32]::GetWindowRect(
                                $hWnd,
                                [ref]$rect
                            )


                        $top =
                            0


                        $left =
                            0


                        if (
                            $rectOk
                        ) {

                            $top =
                                $rect.Top


                            $left =
                                $rect.Left
                        }


                        # IMPORTANTE:
                        # No mostramos el contenido del control si
                        # tiene estilo password.

                        $textoLog =
                            if ($esPassword) {
                                "<PASSWORD>"
                            }
                            else {
                                $texto
                            }


                        Write-Host "TextBox nativo: Clase=[$clase] Texto=[$textoLog] PasswordStyle=[$esPassword] Top=[$top] Handle=[$hWnd]"


                        $resultado.Add(
                            [PSCustomObject]@{
                                Handle     = $hWnd
                                Class      = $clase
                                Text       = $texto
                                IsPassword = $esPassword
                                Enabled    = [Win32]::IsWindowEnabled($hWnd)
                                Top        = $top
                                Left       = $left
                            }
                        )
                    }
                }
                catch {
                }


                return $true
            }


        [void][Win32]::EnumChildWindows(
            $Window.Handle,
            $callback,
            [IntPtr]::Zero
        )


        return $resultado
    }


    # ============================================================
    # OBTENER ESPECIFICAMENTE EL CAMPO PASSWORD
    #
    # MISMA LOGICA VALIDADA EN CWCONFIG:
    #
    # 1) ES_PASSWORD
    # 2) Si VB6 no lo expone, el ThunderRT6TextBox mas abajo
    # ============================================================

    function Get-NativePasswordTextBox {

        param(
            [Parameter(Mandatory = $true)]
            $Window
        )


        $textBoxes =
            @(
                Get-NativeTextBoxes `
                    -Window $Window
            )


        if (
            $textBoxes.Count -eq 0
        ) {

            return $null
        }


        Write-Host ""
        Write-Host "TextBox detectados: $($textBoxes.Count)"


        # --------------------------------------------------------
        # METODO 1 - ESTILO PASSWORD
        # --------------------------------------------------------

        $passwordBox =
            $textBoxes |
            Where-Object {
                $_.IsPassword
            } |
            Select-Object -First 1


        if (
            $passwordBox
        ) {

            Write-Host "[OK] Campo contraseña identificado mediante ES_PASSWORD."

            return $passwordBox
        }


        # --------------------------------------------------------
        # METODO 2 - POSICION
        #
        # En este dialogo:
        #
        # Usuario
        # [........]
        #
        # Contraseña
        # [........]
        #
        # El password es el campo ubicado mas abajo.
        # --------------------------------------------------------

        Write-Host "[WARN] VB6 no informo ES_PASSWORD."
        Write-Host "[INFO] Se utilizara el ThunderRT6TextBox ubicado mas abajo."


        $passwordBox =
            $textBoxes |
            Sort-Object Top -Descending |
            Select-Object -First 1


        return $passwordBox
    }


    # ============================================================
    # COMPLETAR PASSWORD - MISMA CORRECCION DE CWCONFIG
    # ============================================================

    function Complete-PasswordDialogThunderRT6 {

        param(
            [Parameter(Mandatory = $true)]
            [string]$Password,

            [int]$TimeoutSeconds = 120
        )


        # --------------------------------------------------------
        # ESPERAR VENTANA
        # --------------------------------------------------------

        $ventanaPassword =
            Wait-WindowGlobal `
                -Title "Ingrese la contraseña" `
                -TimeoutSeconds $TimeoutSeconds


        Write-Host ""
        Write-Host "=============================================="
        Write-Host "VENTANA DE CONTRASEÑA DETECTADA"
        Write-Host "=============================================="
        Write-Host "Titulo : $($ventanaPassword.Title)"
        Write-Host "PID    : $($ventanaPassword.ProcessId)"
        Write-Host "Handle : $($ventanaPassword.Handle)"


        # --------------------------------------------------------
        # CLASE DE VENTANA
        # --------------------------------------------------------

        $classSb =
            New-Object System.Text.StringBuilder 256


        [void][Win32]::GetClassName(
            $ventanaPassword.Handle,
            $classSb,
            $classSb.Capacity
        )


        $claseVentana =
            $classSb.ToString()


        Write-Host "Clase ventana detectada: [$claseVentana]"


        if (
            $claseVentana -ne
            "ThunderRT6FormDC"
        ) {

            Write-Warning "Se esperaba la clase ThunderRT6FormDC."
        }


        # --------------------------------------------------------
        # ACTIVAR VENTANA
        # --------------------------------------------------------

        Activate-Window `
            -Window $ventanaPassword


        Start-Sleep -Milliseconds 700


        # --------------------------------------------------------
        # IDENTIFICAR CAMPO PASSWORD
        # --------------------------------------------------------

        Write-Host ""
        Write-Host "Buscando ThunderRT6TextBox de contraseña..."


        $passwordBox =
            Get-NativePasswordTextBox `
                -Window $ventanaPassword


        if (
            -not $passwordBox
        ) {

            throw "No se encontro el ThunderRT6TextBox correspondiente a la contraseña."
        }


        Write-Host ""
        Write-Host "[OK] TextBox de contraseña identificado."
        Write-Host "[INFO] Clase : $($passwordBox.Class)"
        Write-Host "[INFO] Handle: $($passwordBox.Handle)"
        Write-Host "[INFO] Top   : $($passwordBox.Top)"
        Write-Host "[INFO] La contraseña NO se mostrara en el log."


        # --------------------------------------------------------
        # INTENTO 1
        #
        # WM_CHAR
        #
        # ESTE ES EL METODO QUE FUNCIONO EN CWCONFIG.
        # --------------------------------------------------------

        Write-Host ""
        Write-Host "[INFO] Intento 1: escribiendo contraseña mediante WM_CHAR..."


        $resultado =
            [Win32]::TypeTextByMessages(
                $ventanaPassword.Handle,
                $passwordBox.Handle,
                $Password
            )


        if (
            -not $resultado
        ) {

            Write-Warning "No fue posible escribir mediante WM_CHAR."
        }


        Start-Sleep -Milliseconds 1000


        # --------------------------------------------------------
        # VERIFICAR ACEPTAR
        # --------------------------------------------------------

        $aceptar =
            Get-NativeButtonByName `
                -Window $ventanaPassword `
                -ButtonName "Aceptar"


        if (
            $aceptar -and
            $aceptar.Enabled
        ) {

            Write-Host ""
            Write-Host "[OK] Aceptar se habilito mediante WM_CHAR."
        }
        else {

            # ----------------------------------------------------
            # FALLBACK SENDINPUT
            # ----------------------------------------------------

            Write-Host ""
            Write-Host "[WARN] Aceptar continua deshabilitado."
            Write-Host "[INFO] Intento 2: click fisico + SendInput..."


            $resultadoFallback =
                [Win32]::TypeTextBySendInput(
                    $ventanaPassword.Handle,
                    $passwordBox.Handle,
                    $Password
                )


            if (
                -not $resultadoFallback
            ) {

                throw "No fue posible escribir la contraseña mediante WM_CHAR ni SendInput."
            }


            Start-Sleep -Milliseconds 1000
        }


        # --------------------------------------------------------
        # ACEPTAR
        # --------------------------------------------------------

        Write-Host ""
        Write-Host "Esperando que el boton Aceptar quede habilitado..."


        Click-ButtonByName `
            -Window $ventanaPassword `
            -ButtonName "Aceptar" `
            -TimeoutSeconds 60 `
            -PollSeconds 1


        Write-Host ""
        Write-Host "[OK] Contraseña confirmada correctamente."


        Wait-WindowClosed `
            -Window $ventanaPassword `
            -TimeoutSeconds 30
    }


    # ============================================================
    # VALIDACIONES PREVIAS
    # ============================================================

    if (
        [string]::IsNullOrWhiteSpace(
            $env:SETUP_PASSWORD
        )
    ) {

        throw "No se encuentra definida la variable SetupPassword."
    }


    if (
        -not (
            Test-Path "C:\Release"
        )
    ) {

        throw "La carpeta C:\Release no existe en el equipo $env:COMPUTERNAME."
    }


    # ============================================================
    # BUSCAR SETUP
    # ============================================================

    $archivoExe =
        Get-ChildItem `
            -Path "C:\Release" `
            -Filter "*.exe" `
            -File |
        Select-Object -First 1


    if (
        -not $archivoExe
    ) {

        throw "No se encontro ningun archivo .exe en C:\Release."
    }


    Write-Host ""
    Write-Host "Instalador encontrado: $($archivoExe.FullName)"


    # ============================================================
    # EJECUTAR SETUP
    # ============================================================

    $instalador =
        Start-Process `
            -FilePath $archivoExe.FullName `
            -PassThru


    Write-Host "Instalador iniciado: $($archivoExe.FullName)"
    Write-Host "PID inicial: $($instalador.Id)"


    # ============================================================
    # VENTANA INICIAL
    # ============================================================

    $ventanaInicial =
        Wait-WindowGlobal `
            -Title "Instalación de Softland" `
            -TimeoutSeconds 120


    Activate-Window `
        -Window $ventanaInicial


    # ============================================================
    # PASOS INICIALES
    # ============================================================

    Write-Host "Avanzando pantalla inicial..."


    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER inicial"


    Start-Sleep -Seconds 5


    Write-Host "Seleccionando primera opcion..."


    Activate-Window `
        -Window $ventanaInicial


    Send-KeySafe `
        -Keys "{TAB}" `
        -Description "TAB primer checkbox"


    Send-KeySafe `
        -Keys " " `
        -Description "ESPACIO primer checkbox"


    Start-Sleep -Seconds 1


    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER confirmar primer checkbox"


    Start-Sleep -Seconds 5


    Write-Host "Seleccionando segunda opcion..."


    Activate-Window `
        -Window $ventanaInicial


    Send-KeySafe `
        -Keys "{TAB}" `
        -Description "TAB segundo checkbox"


    Send-KeySafe `
        -Keys " " `
        -Description "ESPACIO segundo checkbox"


    Start-Sleep -Seconds 1


    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER confirmar segundo checkbox"


    Start-Sleep -Seconds 1


    Write-Host "Iniciando instalacion..."


    Activate-Window `
        -Window $ventanaInicial


    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER iniciar instalacion"


    Write-Host ""
    Write-Host "Instalacion trabajando..."


    Start-Sleep -Seconds 20


    # ============================================================
    # ACTUALIZACION DE BASES
    # ============================================================

    $ventanaBD =
        Wait-WindowGlobal `
            -Title "Actualización de bases de datos" `
            -TimeoutSeconds 2700


    Write-Host ""
    Write-Host "La ventana de actualizacion ya esta visible."
    Write-Host "Ahora se esperara hasta que termine la creacion/actualizacion de modelos"
    Write-Host "y el boton 'Aceptar' quede habilitado."


    Click-ButtonByName `
        -Window $ventanaBD `
        -ButtonName "Aceptar" `
        -TimeoutSeconds 2700 `
        -PollSeconds 3


    Write-Host "Boton Aceptar de actualizacion de bases habilitado y presionado."


    # ============================================================
    # CONTRASEÑA
    #
    # AHORA USA LA MISMA TECNICA VALIDADA EN CWCONFIG:
    #
    # ThunderRT6TextBox
    # -> campo password correcto
    # -> click fisico
    # -> WM_CHAR
    # -> SendInput fallback
    # ============================================================

    Complete-PasswordDialogThunderRT6 `
        -Password $env:SETUP_PASSWORD `
        -TimeoutSeconds 120


    # ============================================================
    # PRIMERA CONFIRMACION
    # ============================================================

    $confirmacion1 =
        Wait-WindowGlobal `
            -Title "Configuración del Sistema de Gestión" `
            -TimeoutSeconds 120


    $handlePrimera =
        $confirmacion1.Handle.ToInt64()


    Click-ButtonByName `
        -Window $confirmacion1 `
        -ButtonName "Sí" `
        -TimeoutSeconds 30


    Write-Host "Primera confirmacion aceptada."


    Wait-WindowClosed `
        -Window $confirmacion1 `
        -TimeoutSeconds 30


    Start-Sleep -Seconds 1


    # ============================================================
    # SEGUNDA CONFIRMACION
    # ============================================================

    $confirmacion2 =
        Wait-WindowGlobal `
            -Title "Configuración del Sistema de Gestión" `
            -TimeoutSeconds 120 `
            -ExcludeHandle $handlePrimera


    Click-ButtonByName `
        -Window $confirmacion2 `
        -ButtonName "Sí" `
        -TimeoutSeconds 30


    Write-Host "Segunda confirmacion aceptada."


    # ============================================================
    # FINAL
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "AUTOMATIZACION COMPLETADA"
    Write-Host "=============================================="


  env:
    SETUP_PASSWORD: $(SetupPassword)

  displayName: 'Ejecutar Setup Softland en equipo QA'
