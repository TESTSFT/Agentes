steps:
- powershell: |
    Write-Host "=============================================="
    Write-Host "EJECUTA SETUP - VERSION PASSWORD NATIVO V2"
    Write-Host "=============================================="

    # ============================================================
    # LIBRERÍAS
    # ============================================================

    Add-Type -AssemblyName System.Windows.Forms
    Add-Type -AssemblyName UIAutomationClient
    Add-Type -AssemblyName UIAutomationTypes

    # ============================================================
    # VALIDAR AGENTE COMO ADMINISTRADOR
    # ============================================================

    Write-Host "=============================================="
    Write-Host "VALIDANDO AGENTE SELF-HOSTED"
    Write-Host "=============================================="
    Write-Host "Equipo: $env:COMPUTERNAME"
    Write-Host "Usuario: $env:USERNAME"
    Write-Host "Session ID: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"

    $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
    $principal = New-Object Security.Principal.WindowsPrincipal($identity)
    $esAdmin = $principal.IsInRole(
        [Security.Principal.WindowsBuiltInRole]::Administrator
    )

    Write-Host "Ejecutando elevado como Administrador: $esAdmin"

    if (-not $esAdmin) {
        throw "El Azure DevOps Agent no está ejecutando el pipeline como Administrador."
    }

    # ============================================================
    # API WIN32
    # ============================================================

    Add-Type @"
    using System;
    using System.Text;
    using System.Runtime.InteropServices;

    public static class Win32 {
        public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

        [DllImport("user32.dll")]
        public static extern bool EnumWindows(
            EnumWindowsProc lpEnumFunc,
            IntPtr lParam
        );

        [DllImport("user32.dll")]
        public static extern bool IsWindowVisible(IntPtr hWnd);

        [DllImport("user32.dll")]
        public static extern bool IsWindow(IntPtr hWnd);

        [DllImport("user32.dll")]
        public static extern int GetWindowTextLength(IntPtr hWnd);

        [DllImport("user32.dll", CharSet = CharSet.Unicode)]
        public static extern int GetWindowText(
            IntPtr hWnd,
            StringBuilder lpString,
            int nMaxCount
        );

        [DllImport("user32.dll")]
        public static extern uint GetWindowThreadProcessId(
            IntPtr hWnd,
            out uint lpdwProcessId
        );

        [DllImport("user32.dll")]
        public static extern bool SetForegroundWindow(IntPtr hWnd);

        [DllImport("user32.dll")]
        public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);

        public delegate bool EnumChildWindowsProc(IntPtr hWnd, IntPtr lParam);

        [DllImport("user32.dll")]
        public static extern bool EnumChildWindows(
            IntPtr hWndParent,
            EnumChildWindowsProc lpEnumFunc,
            IntPtr lParam
        );

        [DllImport("user32.dll")]
        public static extern bool IsWindowEnabled(IntPtr hWnd);

        [DllImport("user32.dll", CharSet = CharSet.Unicode)]
        public static extern int GetClassName(
            IntPtr hWnd,
            StringBuilder lpClassName,
            int nMaxCount
        );

        [DllImport("user32.dll")]
        public static extern IntPtr SendMessage(
            IntPtr hWnd,
            uint Msg,
            IntPtr wParam,
            IntPtr lParam
        );

        [DllImport("user32.dll", CharSet = CharSet.Unicode)]
        public static extern IntPtr SendMessage(
            IntPtr hWnd,
            uint Msg,
            IntPtr wParam,
            string lParam
        );

        [DllImport("user32.dll")]
        public static extern int GetWindowLong(
            IntPtr hWnd,
            int nIndex
        );
    }
    "@

    # ============================================================
    # NORMALIZAR TEXTO
    # ============================================================

    function Normalize-UiText {
        param([string]$Text)

        if ($null -eq $Text) {
            return ""
        }

        $formD = $Text.Normalize(
            [System.Text.NormalizationForm]::FormD
        )

        $builder = New-Object System.Text.StringBuilder

        foreach ($char in $formD.ToCharArray()) {
            $category =
                [System.Globalization.CharUnicodeInfo]::GetUnicodeCategory($char)

            if (
                $category -ne
                [System.Globalization.UnicodeCategory]::NonSpacingMark
            ) {
                [void]$builder.Append($char)
            }
        }

        return $builder.ToString().Normalize(
            [System.Text.NormalizationForm]::FormC
        ).Trim().ToLowerInvariant()
    }

    # ============================================================
    # BUSCAR VENTANA GLOBALMENTE POR TÍTULO
    # ============================================================

    function Get-WindowByTitle {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Title,

            [long]$ExcludeHandle = 0
        )

        $resultado = New-Object System.Collections.Generic.List[object]
        $tituloBuscado = Normalize-UiText $Title

        $callback = [Win32+EnumWindowsProc]{
            param(
                [IntPtr]$hWnd,
                [IntPtr]$lParam
            )

            if ([Win32]::IsWindowVisible($hWnd)) {
                $length = [Win32]::GetWindowTextLength($hWnd)

                if ($length -gt 0) {
                    $sb = New-Object System.Text.StringBuilder ($length + 1)

                    [void][Win32]::GetWindowText(
                        $hWnd,
                        $sb,
                        $sb.Capacity
                    )

                    $titulo = $sb.ToString()

                    if (
                        (Normalize-UiText $titulo) -eq $tituloBuscado -and
                        $hWnd.ToInt64() -ne $ExcludeHandle
                    ) {
                        [uint32]$windowPid = 0

                        [void][Win32]::GetWindowThreadProcessId(
                            $hWnd,
                            [ref]$windowPid
                        )

                        $resultado.Add(
                            [PSCustomObject]@{
                                Handle    = $hWnd
                                ProcessId = [int]$windowPid
                                Title     = $titulo
                            }
                        )
                    }
                }
            }

            return $true
        }

        [void][Win32]::EnumWindows(
            $callback,
            [IntPtr]::Zero
        )

        return $resultado | Select-Object -First 1
    }

    # ============================================================
    # ESPERAR VENTANA GLOBAL
    # ============================================================

    function Wait-WindowGlobal {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Title,

            [int]$TimeoutSeconds = 2700,

            [long]$ExcludeHandle = 0
        )

        Write-Host ""
        Write-Host "Esperando ventana: '$Title'"

        $limite = (Get-Date).AddSeconds($TimeoutSeconds)

        while ((Get-Date) -lt $limite) {
            $ventana = Get-WindowByTitle `
                -Title $Title `
                -ExcludeHandle $ExcludeHandle

            if ($ventana) {
                Write-Host ""
                Write-Host "VENTANA DETECTADA"
                Write-Host "Título: $($ventana.Title)"
                Write-Host "PID: $($ventana.ProcessId)"
                Write-Host "Handle: $($ventana.Handle)"

                return $ventana
            }

            Write-Host "$(Get-Date -Format 'HH:mm:ss') - Esperando '$Title'..."
            Start-Sleep -Seconds 2
        }

        throw "No apareció la ventana '$Title'."
    }

    # ============================================================
    # ACTIVAR VENTANA
    # ============================================================

    function Activate-Window {
        param(
            [Parameter(Mandatory = $true)]
            $Window
        )

        [void][Win32]::ShowWindowAsync(
            $Window.Handle,
            9
        )

        Start-Sleep -Milliseconds 500

        $activada = [Win32]::SetForegroundWindow(
            $Window.Handle
        )

        if (-not $activada) {
            try {
                $wshell = New-Object -ComObject WScript.Shell
                $activada = $wshell.AppActivate(
                    [int]$Window.ProcessId
                )
            }
            catch {
                $activada = $false
            }
        }

        Write-Host "Resultado activación: $activada"
        Start-Sleep -Milliseconds 700
    }

    # ============================================================
    # SENDKEYS CON DIAGNÓSTICO
    # ============================================================

    function Send-KeySafe {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Keys,

            [string]$Description = $Keys
        )

        try {
            Write-Host "Enviando: $Description"

            [System.Windows.Forms.SendKeys]::SendWait(
                $Keys
            )
        }
        catch {
            throw "No se pudo enviar '$Description'. Windows devolvió: $($_.Exception.Message)"
        }
    }

    # ============================================================
    # BUSCAR BOTÓN NATIVO/LEGACY POR TEXTO
    #
    # Algunos instaladores antiguos no exponen sus botones como
    # ControlType.Button a UI Automation. En ese caso enumeramos
    # los controles hijos Win32 y buscamos el texto del botón.
    # ============================================================

    function Get-NativeButtonByName {
        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [Parameter(Mandatory = $true)]
            [string]$ButtonName
        )

        $resultado = New-Object System.Collections.Generic.List[object]
        $nombreBuscado = Normalize-UiText $ButtonName

        $callback = [Win32+EnumChildWindowsProc]{
            param(
                [IntPtr]$hWnd,
                [IntPtr]$lParam
            )

            try {
                $length = [Win32]::GetWindowTextLength($hWnd)
                $texto = ""

                if ($length -gt 0) {
                    $sb = New-Object System.Text.StringBuilder ($length + 1)

                    [void][Win32]::GetWindowText(
                        $hWnd,
                        $sb,
                        $sb.Capacity
                    )

                    $texto = $sb.ToString()
                }

                $classSb = New-Object System.Text.StringBuilder 256

                [void][Win32]::GetClassName(
                    $hWnd,
                    $classSb,
                    $classSb.Capacity
                )

                $clase = $classSb.ToString()

                if ($texto) {
                    Write-Host "Control Win32 encontrado: Clase=[$clase] Texto=[$texto]"
                }

                if (
                    (Normalize-UiText $texto) -eq $nombreBuscado
                ) {
                    $resultado.Add(
                        [PSCustomObject]@{
                            Handle  = $hWnd
                            Text    = $texto
                            Class   = $clase
                            Enabled = [Win32]::IsWindowEnabled($hWnd)
                        }
                    )
                }
            }
            catch {
            }

            return $true
        }

        [void][Win32]::EnumChildWindows(
            $Window.Handle,
            $callback,
            [IntPtr]::Zero
        )

        return $resultado | Select-Object -First 1
    }


    # ============================================================
    # CLICK SOBRE BOTÓN POR NOMBRE
    #
    # IMPORTANTE:
    # La ventana "Actualización de bases de datos" aparece primero
    # mientras crea/actualiza modelos. Durante ese tiempo el botón
    # Aceptar existe pero está DESHABILITADO.
    #
    # Esta función NO presiona ENTER ni cierra la ventana mientras
    # el botón esté deshabilitado. Espera hasta que quede habilitado.
    # ============================================================

    function Click-ButtonByName {
        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [Parameter(Mandatory = $true)]
            [string]$ButtonName,

            [int]$TimeoutSeconds = 30,

            [int]$PollSeconds = 2
        )

        $limite = (Get-Date).AddSeconds($TimeoutSeconds)
        $nombreBuscado = Normalize-UiText $ButtonName

        $buttonCondition = New-Object `
            System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Button
            )

        while ((Get-Date) -lt $limite) {

            $botonEncontrado = $false


            # ----------------------------------------------------
            # MÉTODO 1: UI AUTOMATION
            # ----------------------------------------------------

            try {
                $elementoVentana =
                    [System.Windows.Automation.AutomationElement]::FromHandle(
                        $Window.Handle
                    )

                if ($null -ne $elementoVentana) {

                    $botones = $elementoVentana.FindAll(
                        [System.Windows.Automation.TreeScope]::Descendants,
                        $buttonCondition
                    )

                    foreach ($boton in $botones) {

                        try {
                            $nombreBoton = $boton.Current.Name

                            if (
                                (Normalize-UiText $nombreBoton) -eq $nombreBuscado
                            ) {
                                $botonEncontrado = $true

                                if (-not $boton.Current.IsEnabled) {

                                    Write-Host "$(Get-Date -Format 'HH:mm:ss') - Botón '$ButtonName' visible pero deshabilitado. El instalador continúa trabajando..."

                                    break
                                }

                                Write-Host "Botón '$ButtonName' habilitado mediante UI Automation."

                                try {
                                    $invokePattern =
                                        $boton.GetCurrentPattern(
                                            [System.Windows.Automation.InvokePattern]::Pattern
                                        )

                                    $invokePattern.Invoke()

                                    Write-Host "Click realizado sobre '$ButtonName' mediante UI Automation."

                                    return
                                }
                                catch {
                                    Write-Warning "InvokePattern falló. Se intentará el control Win32."
                                }
                            }
                        }
                        catch {
                        }
                    }
                }
            }
            catch {
                Write-Host "UI Automation no pudo inspeccionar la ventana: $($_.Exception.Message)"
            }


            # ----------------------------------------------------
            # MÉTODO 2: CONTROL NATIVO WIN32
            # ----------------------------------------------------

            $botonNativo = Get-NativeButtonByName `
                -Window $Window `
                -ButtonName $ButtonName

            if ($botonNativo) {

                $botonEncontrado = $true

                if (-not $botonNativo.Enabled) {

                    Write-Host "$(Get-Date -Format 'HH:mm:ss') - Botón nativo '$ButtonName' visible pero deshabilitado. Esperando..."

                }
                else {

                    Write-Host ""
                    Write-Host "BOTÓN NATIVO HABILITADO"
                    Write-Host "Texto : $($botonNativo.Text)"
                    Write-Host "Clase : $($botonNativo.Class)"
                    Write-Host "Handle: $($botonNativo.Handle)"

                    # BM_CLICK = 0x00F5
                    [void][Win32]::SendMessage(
                        $botonNativo.Handle,
                        0x00F5,
                        [IntPtr]::Zero,
                        [IntPtr]::Zero
                    )

                    Write-Host "BM_CLICK enviado al botón '$ButtonName'."

                    Start-Sleep -Milliseconds 750

                    return
                }
            }


            if (-not $botonEncontrado) {
                Write-Host "$(Get-Date -Format 'HH:mm:ss') - La ventana está abierta pero todavía no se encontró el botón '$ButtonName'."
            }

            Start-Sleep -Seconds $PollSeconds
        }

        throw "El botón '$ButtonName' no quedó habilitado dentro de $TimeoutSeconds segundos."
    }


    # ============================================================
    # ESPERAR CIERRE DE VENTANA
    # ============================================================

    function Wait-WindowClosed {
        param(
            [Parameter(Mandatory = $true)]
            $Window,

            [int]$TimeoutSeconds = 30
        )

        $handle = [long]$Window.Handle.ToInt64()
        $limite = (Get-Date).AddSeconds($TimeoutSeconds)

        while ((Get-Date) -lt $limite) {
            if (-not [Win32]::IsWindow([IntPtr]$handle)) {
                Write-Host "Ventana cerrada correctamente."
                return
            }

            Start-Sleep -Milliseconds 500
        }

        Write-Warning "La ventana no confirmó su cierre dentro del tiempo esperado."
    }

    # ============================================================
    # OBTENER TEXTBOX NATIVOS DE UNA VENTANA
    #
    # El instalador utiliza controles VB6/ThunderRT6.
    # Estos controles pueden no aparecer correctamente en UI Automation.
    # ============================================================

    function Get-NativeTextBoxes {
        param(
            [Parameter(Mandatory = $true)]
            $Window
        )

        $resultado = New-Object System.Collections.Generic.List[object]

        $callback = [Win32+EnumChildWindowsProc]{
            param(
                [IntPtr]$hWnd,
                [IntPtr]$lParam
            )

            try {
                $classSb = New-Object System.Text.StringBuilder 256

                [void][Win32]::GetClassName(
                    $hWnd,
                    $classSb,
                    $classSb.Capacity
                )

                $clase = $classSb.ToString()

                if (
                    $clase -match "(?i)textbox|edit"
                ) {
                    $length = [Win32]::GetWindowTextLength($hWnd)
                    $texto = ""

                    if ($length -gt 0) {
                        $sb = New-Object System.Text.StringBuilder ($length + 1)

                        [void][Win32]::GetWindowText(
                            $hWnd,
                            $sb,
                            $sb.Capacity
                        )

                        $texto = $sb.ToString()
                    }

                    # GWL_STYLE = -16
                    # ES_PASSWORD = 0x20
                    $style = [Win32]::GetWindowLong(
                        $hWnd,
                        -16
                    )

                    $esPassword = (($style -band 0x20) -ne 0)

                    Write-Host "TextBox nativo: Clase=[$clase] Texto=[$texto] PasswordStyle=[$esPassword] Handle=[$hWnd]"

                    $resultado.Add(
                        [PSCustomObject]@{
                            Handle     = $hWnd
                            Class      = $clase
                            Text       = $texto
                            IsPassword = $esPassword
                            Enabled    = [Win32]::IsWindowEnabled($hWnd)
                        }
                    )
                }
            }
            catch {
            }

            return $true
        }

        [void][Win32]::EnumChildWindows(
            $Window.Handle,
            $callback,
            [IntPtr]::Zero
        )

        return $resultado
    }


    # ============================================================
    # ESPERAR Y COMPLETAR "Ingrese la contraseña"
    #
    # Flujo:
    # 1) espera la ventana por título usando Win32
    # 2) enumera TextBox VB6/ThunderRT6
    # 3) identifica el Password por ES_PASSWORD
    # 4) fallback: usa el TextBox vacío / último TextBox
    # 5) escribe mediante WM_SETTEXT
    # 6) espera que Aceptar quede habilitado y hace click
    # ============================================================

    function Complete-PasswordDialogNative {
        param(
            [Parameter(Mandatory = $true)]
            [string]$Password,

            [int]$TimeoutSeconds = 120
        )

        $ventanaPassword = Wait-WindowGlobal `
            -Title "Ingrese la contraseña" `
            -TimeoutSeconds $TimeoutSeconds

        Write-Host ""
        Write-Host "VENTANA DE CONTRASEÑA DETECTADA"
        Write-Host "Título: $($ventanaPassword.Title)"
        Write-Host "PID: $($ventanaPassword.ProcessId)"
        Write-Host "Handle: $($ventanaPassword.Handle)"

        $limite = (Get-Date).AddSeconds(30)
        $campoPassword = $null

        while (
            (Get-Date) -lt $limite -and
            $null -eq $campoPassword
        ) {
            $textboxes = @(
                Get-NativeTextBoxes `
                    -Window $ventanaPassword
            )

            # Primer criterio: estilo ES_PASSWORD
            $campoPassword =
                $textboxes |
                Where-Object {
                    $_.IsPassword -and $_.Enabled
                } |
                Select-Object -First 1

            # Segundo criterio: TextBox vacío.
            # En la pantalla observada el usuario contiene "sa"
            # y el campo Contraseña está vacío.
            if ($null -eq $campoPassword) {
                $campoPassword =
                    $textboxes |
                    Where-Object {
                        $_.Enabled -and
                        [string]::IsNullOrEmpty($_.Text)
                    } |
                    Select-Object -Last 1
            }

            # Último fallback: último TextBox encontrado.
            if (
                $null -eq $campoPassword -and
                $textboxes.Count -ge 2
            ) {
                Write-Warning "No se detectó ES_PASSWORD. Se utilizará el último TextBox nativo."

                $campoPassword =
                    $textboxes |
                    Select-Object -Last 1
            }

            if ($null -eq $campoPassword) {
                Write-Host "Esperando controles de Usuario/Contraseña..."
                Start-Sleep -Seconds 1
            }
        }

        if ($null -eq $campoPassword) {
            throw "Se detectó 'Ingrese la contraseña', pero no se encontró el TextBox de contraseña."
        }

        Write-Host ""
        Write-Host "CAMPO CONTRASEÑA NATIVO DETECTADO"
        Write-Host "Clase : $($campoPassword.Class)"
        Write-Host "Handle: $($campoPassword.Handle)"
        Write-Host "PasswordStyle: $($campoPassword.IsPassword)"

        # WM_SETTEXT = 0x000C
        [void][Win32]::SendMessage(
            $campoPassword.Handle,
            0x000C,
            [IntPtr]::Zero,
            $Password
        )

        Write-Host "Contraseña enviada al TextBox mediante WM_SETTEXT."

        Start-Sleep -Seconds 1

        # Aceptar está deshabilitado hasta que la contraseña se complete.
        Click-ButtonByName `
            -Window $ventanaPassword `
            -ButtonName "Aceptar" `
            -TimeoutSeconds 30 `
            -PollSeconds 1

        Write-Host "Contraseña confirmada correctamente."

        Wait-WindowClosed `
            -Window $ventanaPassword `
            -TimeoutSeconds 30
    }


    # ============================================================
    # VALIDACIONES PREVIAS
    # ============================================================

    if ([string]::IsNullOrWhiteSpace($env:SETUP_PASSWORD)) {
        throw "No se encuentra definida la variable SetupPassword."
    }

    if (-not (Test-Path "C:\Release")) {
        throw "La carpeta C:\Release no existe en el equipo $env:COMPUTERNAME."
    }

    # ============================================================
    # BUSCAR SETUP
    # ============================================================

    $archivoExe = Get-ChildItem `
        -Path "C:\Release" `
        -Filter "*.exe" `
        -File |
        Select-Object -First 1

    if (-not $archivoExe) {
        throw "No se encontró ningún archivo .exe en C:\Release."
    }

    Write-Host ""
    Write-Host "Instalador encontrado: $($archivoExe.FullName)"

    # ============================================================
    # EJECUTAR SETUP
    # ============================================================

    $instalador = Start-Process `
        -FilePath $archivoExe.FullName `
        -PassThru

    Write-Host "Instalador iniciado: $($archivoExe.FullName)"
    Write-Host "PID inicial: $($instalador.Id)"

    # ============================================================
    # VENTANA INICIAL
    # ============================================================

    $ventanaInicial = Wait-WindowGlobal `
        -Title "Instalación de Softland" `
        -TimeoutSeconds 120

    Activate-Window `
        -Window $ventanaInicial

    # ============================================================
    # PASOS INICIALES
    # ============================================================

    Write-Host "Avanzando pantalla inicial..."

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER inicial"

    Start-Sleep -Seconds 5

    Write-Host "Seleccionando primera opción..."

    Activate-Window `
        -Window $ventanaInicial

    Send-KeySafe `
        -Keys "{TAB}" `
        -Description "TAB primer checkbox"

    Send-KeySafe `
        -Keys " " `
        -Description "ESPACIO primer checkbox"

    Start-Sleep -Seconds 1

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER confirmar primer checkbox"

    Start-Sleep -Seconds 5

    Write-Host "Seleccionando segunda opción..."

    Activate-Window `
        -Window $ventanaInicial

    Send-KeySafe `
        -Keys "{TAB}" `
        -Description "TAB segundo checkbox"

    Send-KeySafe `
        -Keys " " `
        -Description "ESPACIO segundo checkbox"

    Start-Sleep -Seconds 1

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER confirmar segundo checkbox"

    Start-Sleep -Seconds 1

    Write-Host "Iniciando instalación..."

    Activate-Window `
        -Window $ventanaInicial

    Send-KeySafe `
        -Keys "{ENTER}" `
        -Description "ENTER iniciar instalación"

    Write-Host ""
    Write-Host "Instalación trabajando..."

    Start-Sleep -Seconds 20

    # ============================================================
    # ACTUALIZACIÓN DE BASES
    # ============================================================

    $ventanaBD = Wait-WindowGlobal `
        -Title "Actualización de bases de datos" `
        -TimeoutSeconds 2700

    Write-Host ""
    Write-Host "La ventana de actualización ya está visible."
    Write-Host "Ahora se esperará hasta que termine la creación/actualización de modelos"
    Write-Host "y el botón 'Aceptar' quede habilitado."

    Click-ButtonByName `
        -Window $ventanaBD `
        -ButtonName "Aceptar" `
        -TimeoutSeconds 2700 `
        -PollSeconds 3

    Write-Host "Botón Aceptar de actualización de bases habilitado y presionado."

    # ============================================================
    # CONTRASEÑA
    #
    # El diálogo es VB6/ThunderRT6, por lo que se trabaja
    # directamente con controles Win32 nativos.
    # ============================================================

    Complete-PasswordDialogNative `
        -Password $env:SETUP_PASSWORD `
        -TimeoutSeconds 120


    # ============================================================
    # PRIMERA CONFIRMACIÓN
    # ============================================================

    $confirmacion1 = Wait-WindowGlobal `
        -Title "Configuración del Sistema de Gestión" `
        -TimeoutSeconds 120

    $handlePrimera =
        $confirmacion1.Handle.ToInt64()

    Click-ButtonByName `
        -Window $confirmacion1 `
        -ButtonName "Sí" `
        -TimeoutSeconds 30

    Write-Host "Primera confirmación aceptada."

    Wait-WindowClosed `
        -Window $confirmacion1 `
        -TimeoutSeconds 30

    Start-Sleep -Seconds 1

    # ============================================================
    # SEGUNDA CONFIRMACIÓN
    # ============================================================

    $confirmacion2 = Wait-WindowGlobal `
        -Title "Configuración del Sistema de Gestión" `
        -TimeoutSeconds 120 `
        -ExcludeHandle $handlePrimera

    Click-ButtonByName `
        -Window $confirmacion2 `
        -ButtonName "Sí" `
        -TimeoutSeconds 30

    Write-Host "Segunda confirmación aceptada."

    # ============================================================
    # FINAL
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "AUTOMATIZACIÓN COMPLETADA"
