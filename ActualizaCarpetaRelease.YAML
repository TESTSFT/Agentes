trigger: none

pool:
  name: 'Softland-QA'

steps:
- powershell: |
    # ============================================================
    # RUTAS DE ORIGEN
    # ============================================================

    $origen = "\\apollo\TES\Actualizacion_release"


    # ============================================================
    # SERVIDORES DESTINO POR VERSIÓN
    # ============================================================

    $destinos460 = @(
        "\\SARTES022022\Release",
        "\\SARTES022019\Release"
    )

    $destinos500 = @(
        "\\SARDT4001\Release",
        "\\SARDT4000\Release",
        "\\SARTES502022\Release",
        "\\SARTES042022\Release"
    )

    $destinofi460 = @(
        "\\SPETES0222\Release"
    )

    $destinofi500 = @(
        "\\OFISIS502022\Release"
    )


    # ============================================================
    # VALIDAR EXISTENCIA DEL ORIGEN
    # ============================================================

    if (-not (Test-Path $origen)) {
        Write-Error "La ruta de origen $origen no existe o no se puede acceder."
        exit 1
    }

    Write-Host "Origen accesible: $origen"


    # ============================================================
    # OBTENER ARCHIVOS setupSAR
    # ============================================================

    $setups1 = @(
        Get-ChildItem `
            -Path $origen `
            -Filter "setupSAR_*" `
            -File
    )

    if ($setups1.Count -eq 0) {
        Write-Error "No se encontraron archivos setupSAR_* en $origen."
        exit 1
    }

    Write-Host "Archivos setupSAR encontrados: $($setups1.Count)"

    foreach ($archivo in $setups1) {
        Write-Host " - $($archivo.Name)"
    }


    # ============================================================
    # OBTENER ARCHIVOS setupOFISIS
    # ============================================================

    $setups2 = @(
        Get-ChildItem `
            -Path $origen `
            -Filter "setupOFISIS_*" `
            -File
    )

    if ($setups2.Count -eq 0) {
        Write-Error "No se encontraron archivos setupOFISIS_* en $origen."
        exit 1
    }

    Write-Host "Archivos setupOFISIS encontrados: $($setups2.Count)"

    foreach ($archivo in $setups2) {
        Write-Host " - $($archivo.Name)"
    }


    # ============================================================
    # INICIALIZAR VARIABLES
    # ============================================================

    $setup460    = $null
    $setup500    = $null
    $setupofi460 = $null
    $setupofi500 = $null


    # ============================================================
    # DETECTAR VERSIONES SAR
    # ============================================================

    foreach ($archivo in $setups1) {

        $nombre = $archivo.Name

        if ($nombre -like "setupSAR_4.6.0*") {
            $setup460 = $archivo.FullName
        }
        elseif ($nombre -like "setupSAR_5.0.0*") {
            $setup500 = $archivo.FullName
        }
    }


    # ============================================================
    # DETECTAR VERSIONES OFISIS
    # ============================================================

    foreach ($archivo in $setups2) {

        $nombre = $archivo.Name

        if ($nombre -like "setupOFISIS_4.6.0*") {
            $setupofi460 = $archivo.FullName
        }
        elseif ($nombre -like "setupOFISIS_5.0.0*") {
            $setupofi500 = $archivo.FullName
        }
    }


    # ============================================================
    # MOSTRAR SETUPS DETECTADOS
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "SETUPS DETECTADOS"
    Write-Host "=============================================="

    Write-Host "SAR 4.6   : $setup460"
    Write-Host "SAR 5.0   : $setup500"
    Write-Host "OFISIS 4.6: $setupofi460"
    Write-Host "OFISIS 5.0: $setupofi500"


    # ============================================================
    # FUNCIÓN PARA LIMPIAR CARPETA
    # ============================================================

    function Limpiar-Carpeta {

        param(
            [string]$ruta
        )

        try {

            Write-Host ""
            Write-Host "Limpiando $ruta ..."

            Get-ChildItem `
                -Path $ruta `
                -Force `
                -ErrorAction Stop |
            Remove-Item `
                -Force `
                -Recurse `
                -ErrorAction Stop

            Write-Host "Carpeta limpiada correctamente: $ruta"

            return $true
        }
        catch {

            Write-Warning "No se pudo limpiar la carpeta $ruta."
            Write-Warning "Detalles del error: $($_.Exception.Message)"

            return $false
        }
    }


    # ============================================================
    # FUNCIÓN PARA COPIAR EL SETUP
    # ============================================================

    function Copiar-Setup {

        param(
            [string]$rutaDestino,
            [string]$archivoSetup
        )

        if (Test-Path $rutaDestino) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "Procesando destino: $rutaDestino"
            Write-Host "=============================================="

            $limpiezaOK = Limpiar-Carpeta -ruta $rutaDestino

            if (-not $limpiezaOK) {
                Write-Warning "Se omite la copia porque no se pudo limpiar $rutaDestino."
                return
            }

            try {

                Copy-Item `
                    -Path $archivoSetup `
                    -Destination $rutaDestino `
                    -Force `
                    -ErrorAction Stop

                Write-Host "Copiado:"
                Write-Host "Origen : $archivoSetup"
                Write-Host "Destino: $rutaDestino"
            }
            catch {

                Write-Warning "No se pudo copiar el setup a $rutaDestino."
                Write-Warning "Detalles del error: $($_.Exception.Message)"
            }
        }
        else {

            Write-Warning "No se encontró la ruta destino: $rutaDestino"
        }
    }


    # ============================================================
    # PROCESAR DESTINOS SAR 4.6
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "PROCESANDO SAR 4.6"
    Write-Host "=============================================="

    if ($setup460) {

        foreach ($ruta in $destinos460) {

            Copiar-Setup `
                -rutaDestino $ruta `
                -archivoSetup $setup460
        }
    }
    else {

        Write-Warning "No se encontró setup SAR 4.6."
    }


    # ============================================================
    # PROCESAR DESTINOS SAR 5.0
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "PROCESANDO SAR 5.0"
    Write-Host "=============================================="

    if ($setup500) {

        foreach ($ruta in $destinos500) {

            Copiar-Setup `
                -rutaDestino $ruta `
                -archivoSetup $setup500
        }
    }
    else {

        Write-Warning "No se encontró setup SAR 5.0."
    }


    # ============================================================
    # PROCESAR DESTINO OFISIS 4.6
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "PROCESANDO OFISIS 4.6"
    Write-Host "=============================================="

    if ($setupofi460) {

        foreach ($ruta in $destinofi460) {

            Copiar-Setup `
                -rutaDestino $ruta `
                -archivoSetup $setupofi460
        }
    }
    else {

        Write-Warning "No se encontró setup OFISIS 4.6."
    }


    # ============================================================
    # PROCESAR DESTINO OFISIS 5.0
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "PROCESANDO OFISIS 5.0"
    Write-Host "=============================================="

    if ($setupofi500) {

        foreach ($ruta in $destinofi500) {

            Copiar-Setup `
                -rutaDestino $ruta `
                -archivoSetup $setupofi500
        }
    }
    else {

        Write-Warning "No se encontró setup OFISIS 5.0."
    }


    # ============================================================
    # FINALIZACIÓN
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "ACTUALIZACIÓN DE CARPETAS RELEASE FINALIZADA"
    Write-Host "=============================================="

  displayName: 'Actualizar carpetas Release'
