trigger: none

pool:
  name: 'Softland-QA'

steps:
- powershell: |
    # ============================================================
    # RUTA DE ORIGEN
    # ============================================================

    $origen = "\\apollo\TES\Actualizacion_release"


    # ============================================================
    # DESTINOS SAR
    # Todos reciben el último SetupSAR_V2026.0.*
    # ============================================================

    $destinosSAR = @(
        "\\SARTES022019\Release",
        "\\SARDT4001\Release",
        "\\SARDT4000\Release",
        "\\SARTES502022\Release",
        "\\SARTES042022\Release"
    )


    # ============================================================
    # DESTINOS OFISIS
    # Todos reciben el último SetupOfisis_V2026.0.*
    # ============================================================

    $destinosOFISIS = @(
        "\\SPETES0222\Release",
        "\\OFISIS502022\Release"
    )


    # ============================================================
    # VALIDAR EXISTENCIA DEL ORIGEN
    # ============================================================

    Write-Host "=============================================="
    Write-Host "VALIDANDO ORIGEN"
    Write-Host "=============================================="

    if (-not (Test-Path $origen)) {
        Write-Error "La ruta de origen $origen no existe o no se puede acceder."
        exit 1
    }

    Write-Host "Origen accesible: $origen"


    # ============================================================
    # BUSCAR SetupSAR_V2026.0.*
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "BUSCANDO SETUP SAR 2026"
    Write-Host "=============================================="

    $setupsSAR = @(
        Get-ChildItem `
            -Path $origen `
            -Filter "SetupSAR_V2026.0.*.exe" `
            -File `
            -ErrorAction Stop
    )

    if ($setupsSAR.Count -eq 0) {
        Write-Error "No se encontró ningún archivo SetupSAR_V2026.0.*.exe en $origen."
        exit 1
    }

    $setupSAR = $setupsSAR |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1

    Write-Host "Setup SAR seleccionado:"
    Write-Host $setupSAR.FullName
    Write-Host "Fecha modificación: $($setupSAR.LastWriteTime)"


    # ============================================================
    # BUSCAR SetupOfisis_V2026.0.*
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "BUSCANDO SETUP OFISIS 2026"
    Write-Host "=============================================="

    $setupsOFISIS = @(
        Get-ChildItem `
            -Path $origen `
            -Filter "SetupOfisis_V2026.0.*.exe" `
            -File `
            -ErrorAction Stop
    )

    if ($setupsOFISIS.Count -eq 0) {
        Write-Error "No se encontró ningún archivo SetupOfisis_V2026.0.*.exe en $origen."
        exit 1
    }

    $setupOFISIS = $setupsOFISIS |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1

    Write-Host "Setup OFISIS seleccionado:"
    Write-Host $setupOFISIS.FullName
    Write-Host "Fecha modificación: $($setupOFISIS.LastWriteTime)"


    # ============================================================
    # FUNCIÓN PARA LIMPIAR CARPETA
    # ============================================================

    function Limpiar-Carpeta {

        param(
            [string]$ruta
        )

        try {

            Write-Host ""
            Write-Host "Limpiando $ruta ..."

            Get-ChildItem `
                -Path $ruta `
                -Force `
                -ErrorAction Stop |
            Remove-Item `
                -Force `
                -Recurse `
                -ErrorAction Stop

            Write-Host "Carpeta limpiada correctamente: $ruta"

            return $true
        }
        catch {

            Write-Warning "No se pudo limpiar la carpeta $ruta."
            Write-Warning "Detalles del error: $($_.Exception.Message)"

            return $false
        }
    }


    # ============================================================
    # FUNCIÓN PARA COPIAR SETUP
    # ============================================================

    function Copiar-Setup {

        param(
            [string]$rutaDestino,
            [string]$archivoSetup,
            [string]$tipoSetup
        )

        Write-Host ""
        Write-Host "=============================================="
        Write-Host "PROCESANDO DESTINO $tipoSetup"
        Write-Host "=============================================="
        Write-Host $rutaDestino

        if (-not (Test-Path $rutaDestino)) {

            Write-Warning "No se encontró la ruta destino: $rutaDestino"

            return $false
        }

        $limpiezaOK = Limpiar-Carpeta `
            -ruta $rutaDestino

        if (-not $limpiezaOK) {

            Write-Warning "Se omite la copia porque no se pudo limpiar $rutaDestino."

            return $false
        }

        try {

            Copy-Item `
                -Path $archivoSetup `
                -Destination $rutaDestino `
                -Force `
                -ErrorAction Stop

            $archivoCopiado = Join-Path `
                -Path $rutaDestino `
                -ChildPath ([System.IO.Path]::GetFileName($archivoSetup))

            if (-not (Test-Path $archivoCopiado)) {
                throw "El archivo no existe en destino luego de la copia."
            }

            Write-Host "$tipoSetup copiado correctamente."
            Write-Host "Origen : $archivoSetup"
            Write-Host "Destino: $archivoCopiado"

            return $true
        }
        catch {

            Write-Warning "No se pudo copiar $tipoSetup a $rutaDestino."
            Write-Warning "Detalles del error: $($_.Exception.Message)"

            return $false
        }
    }


    # ============================================================
    # COPIAR SETUP SAR A TODOS LOS DESTINOS SAR
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "COPIANDO SETUP SAR"
    Write-Host "=============================================="

    $errores = @()

    foreach ($ruta in $destinosSAR) {

        $ok = Copiar-Setup `
            -rutaDestino $ruta `
            -archivoSetup $setupSAR.FullName `
            -tipoSetup "SAR"

        if (-not $ok) {
            $errores += "SAR -> $ruta"
        }
    }


    # ============================================================
    # COPIAR SETUP OFISIS A TODOS LOS DESTINOS OFISIS
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "COPIANDO SETUP OFISIS"
    Write-Host "=============================================="

    foreach ($ruta in $destinosOFISIS) {

        $ok = Copiar-Setup `
            -rutaDestino $ruta `
            -archivoSetup $setupOFISIS.FullName `
            -tipoSetup "OFISIS"

        if (-not $ok) {
            $errores += "OFISIS -> $ruta"
        }
    }


    # ============================================================
    # RESULTADO FINAL
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "RESULTADO FINAL"
    Write-Host "=============================================="

    Write-Host "Setup SAR utilizado:"
    Write-Host $setupSAR.FullName
    Write-Host ""

    Write-Host "Setup OFISIS utilizado:"
    Write-Host $setupOFISIS.FullName
    Write-Host ""

    if ($errores.Count -gt 0) {

        Write-Error "La actualización falló en uno o más destinos:"

        foreach ($rutaError in $errores) {
            Write-Host " - $rutaError"
        }

        exit 1
    }

    Write-Host "Todos los destinos SAR y OFISIS fueron actualizados correctamente."

  displayName: 'Actualizar carpetas Release SAR y OFISIS 2026'
